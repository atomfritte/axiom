include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Der Core darf nie stillschweigend etwas verschlucken.
    unused_import: error
    unnecessary_null_comparison: error
    # Ein dynamischer Aufruf umgeht die Typpruefung vollstaendig — daran ist
    # die dauerhafte Anzeige gescheitert. Als Warnung war die Regel schon da
    # und wurde ueberlesen.
    avoid_dynamic_calls: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_const_constructors
    - unawaited_futures
