name: axiom_core
description: >
  AXIOM Kern — Domain, State Engine und Rule Engine.
  Reines Dart, keine Flutter-, Platform- oder I/O-Abhaengigkeit.
  Die Abwesenheit von Abhaengigkeiten ist Absicht, nicht Zufall: dieser Kern
  muss ohne Geraet, ohne Emulator und ohne UI testbar bleiben.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
