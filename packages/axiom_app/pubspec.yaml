name: axiom_app
description: "AXIOM — deterministisches Regelwerk zur Selbstregulation."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Nur fuer die Bausteine des Frameworks (Datumsauswahl, Vorlesen).
  # Die App-Texte kommen aus lib/i18n, nicht aus generiertem Code.
  flutter_localizations:
    sdk: flutter
  axiom_core:
    path: ../axiom_core
  axiom_data:
    path: ../axiom_data
  flutter_riverpod: ^3.3.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.0
  basic_utils: ^5.8.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/rules/
    - assets/expert/
    # Die Hilfe. Verzeichnisweise, damit ein neues Kapitel nur eine Datei
    # ist und kein Eintrag hier — vergessene Eintraege ergaeben eine Hilfe,
    # die es gibt und die niemand findet.
    - assets/help/de/
    - assets/help/en/
    - assets/help/img/
    # Die Schriftlizenz muss die Schriften begleiten.
    #
    # IBM Plex steht unter der SIL Open Font License, und die verlangt beim
    # Weitergeben, dass die Lizenz mitgeht. Flutter bindet Schriften unter
    # `fonts:` ein und nimmt eine Textdatei daneben nicht mit — beim
    # Verteilen der APK waere das eine Lizenzverletzung, die niemandem
    # auffaellt, weil die App laeuft.
    - assets/fonts/IBMPlex-OFL.txt

  fonts:
    - family: PlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
