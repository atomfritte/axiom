name: axiom_app
description: "AXIOM — deterministisches Regelwerk zur Selbstregulation."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Nur fuer die Bausteine des Frameworks (Datumsauswahl, Vorlesen).
  # Die App-Texte kommen aus lib/i18n, nicht aus generiertem Code.
  flutter_localizations:
    sdk: flutter
  axiom_core:
    path: ../axiom_core
  axiom_data:
    path: ../axiom_data
  flutter_riverpod: ^3.3.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/rules/
    - assets/expert/

  fonts:
    - family: PlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
