}
$('#cap-save').addEventListener('click',saveCapture);
$('#cap-text').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveCapture()}
});
$('#checkin-btn').addEventListener('click',()=>checkinDialog());

/* ── Reiter ──────────────────────────────────────────────────────── */
$('#tabs').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-tab]');
  if(!b) return;
  // Der Reiter wurde vorher markiert und gespeichert, bevor sein Inhalt da
  // war: Fiel das Laden aus, hob der Streifen „Ereignisse" hervor, die
  // Fläche zeigte weiter das Board, und niemand sagte warum. Markiert wird
  // jetzt vorläufig, gespeichert erst nach der Antwort — und geht sie
  // schief, steht der Streifen wieder dort, wo die Fläche steht.
  const before=tab;
  tab=b.dataset.tab;
  markTabs();
  try{
    await loadSurface();
  }catch(err){
    tab=before;markTabs();report(err);
    return;
  }
  localStorage.setItem('axiom.tab',tab);
  render();
});
function markTabs(){
  document.querySelectorAll('#tabs button[data-tab]').forEach(b=>
    b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
}
const VIEWS={tasks:viewTasks,board:viewBoard,inbox:viewInbox,state:viewState,
  rules:viewRules,review:viewReview,events:viewEvents,help:viewHelp};
function render(){
  if(!S) return;
  // Dieselbe Menge, die der Reiter daneben zeigt — sonst zählt die Zahl am
  // Reiter etwas anderes als der Inhalt dahinter.
  const unsorted=(inbox.notes||[]).length;
  $('#c-inbox').textContent=unsorted?' '+unsorted:'';
  paintTaskCount();
  // Ein unbekannter Name aus dem Speicher darf die Seite nicht leer lassen.
  put($('#surface'),(VIEWS[tab]||VIEWS.tasks)());
}
function paintTaskCount(){
  $('#c-tasks').textContent=tasks.length
    ?' '+tasks.filter(t=>t.state==='ready'||t.state==='active').length:'';
}

/* ── Aufgaben ────────────────────────────────────────────────────────
   Ein Baum, keine Liste. `parentId` legt der Atomizer beim Zerlegen an —
   damit ist die Kette Eltern → Kind schon da. Das IST die Projektfunktion:
   Ein eigener Projekt-Typ wäre eine zweite Ordnungsachse und damit
   Meta-Work-Treibstoff (D3).

   Sichtbar wird der Baum an drei Stellen, und an jeder für etwas anderes:
   in der Klammerleiste über dem Bestand (worauf filtere ich), in der
   Herkunftszeile an der Aufgabe (wozu gehört das hier) und vollständig in
   der Detailansicht (Kette nach oben, Schritte darunter). Die Einrückung in
   der Liste war ein vierter Anlauf auf dieselbe Sache und hat dabei die
   Rangfolge verbogen: Eine Klammer musste dorthin rücken, wo ihr bester
   Schritt stand, damit der Schritt nicht mit ihr ans Ende rutschte.

   Die Reihenfolge ist die der Auswahl und nicht verstellbar. Drei Filter,
   sonst keine — jeder weitere ist eine Entscheidung vor der Arbeit statt
   in ihr (G1). Sie hängen am Browser, nicht am Gerät: Es ist eine
   Eigenschaft dieses Bildschirms, nicht des Nutzers. */
const tprefs={
  q:localStorage.getItem('axiom.tasks.q')||'',
  reach:localStorage.getItem('axiom.tasks.reach')==='1',
  overdue:localStorage.getItem('axiom.tasks.overdue')==='1',
  done:localStorage.getItem('axiom.tasks.done')==='1'};
function setTPref(key,value){
  tprefs[key]=value;
  localStorage.setItem('axiom.tasks.'+key,
    value===true?'1':value===false?'0':String(value));
}

/* Die gewählte Klammer steht bewusst NICHT im Browser-Speicher, anders als
   die drei Filter darüber. Ein Ausschnitt, der das Schließen des Fensters
   überlebt, versteckt beim nächsten Öffnen Aufgaben, ohne dass zu sehen
   wäre, warum — und dann sucht man den Fehler im Bestand statt in der
   Leiste. Für eingeklappte Gruppen gilt derselbe Satz. */
let bracket=null;
const shut={};
function chooseBracket(id){bracket=id||null;redrawTasks()}

function viewTasks(){
  const frag=document.createDocumentFragment();
  const bar=el('div',{id:'brackets'}),head=el('div',{id:'bhead'});
  const list=el('div',{id:'tasklist',class:'groups'});
  frag.append(taskFilters(),bar,head,list);
  const m=taskModel();
  fillBrackets(bar,m);fillHead(head,m);fillTasks(list,m);
  return frag;
}

function viewBoard(){
  const frag=document.createDocumentFragment();
  const bar=el('div',{id:'brackets'}),head=el('div',{id:'bhead'});
  const box=el('div',{id:'board',class:'board'});
  frag.append(taskFilters(),bar,head,box);
  const m=taskModel();
  fillBrackets(bar,m);fillHead(head,m);fillBoard(box,m);
  return frag;
}

/* Nur Leiste, Kopfzeile und Bestand neu zeichnen, nicht die Filterzeile
   darüber: Sonst verliert das Suchfeld beim zweiten Buchstaben den Fokus. */
function redrawTasks(){
  const m=taskModel();
  const bar=$('#brackets');if(bar) fillBrackets(bar,m);
  const head=$('#bhead');if(head) fillHead(head,m);
  const list=$('#tasklist');
  if(list){fillTasks(list,m);return}
  const board=$('#board');
  if(board) fillBoard(board,m);
}

function taskFilters(){
  const tog=(key,label,title)=>el('button',{class:'tog',title,
    'aria-pressed':tprefs[key]?'true':'false',
    onclick:e=>{
      setTPref(key,!tprefs[key]);
      e.currentTarget.setAttribute('aria-pressed',tprefs[key]?'true':'false');
      redrawTasks();
    }},label);
  return el('div',{class:'filters'},
    el('button',{class:'btn primary',onclick:()=>taskDialog()},tr('Neue Aufgabe')),
    el('input',{type:'search',value:tprefs.q,placeholder:tr('Suchen'),'aria-label':tr('Aufgaben durchsuchen'),
      oninput:e=>{setTPref('q',e.target.value);redrawTasks()}}),
    tog('reach',tr('In Reichweite'),tr('Nur was unter der Kapazität von heute liegt')),
    tog('overdue',tr('Überfällig'),tr('Nur was seinen Zeitpunkt überschritten hat')),
    tog('done',tr('Erledigte'),tr('Erledigtes mit anzeigen')));
}

/* Ein Modell, zwei Ansichten. Liste und Board fragen dieselben Zahlen und
   denselben Filter ab — zweimal gefiltert wäre zweimal die Gelegenheit,
   unterschiedlich zu filtern, und dann zeigte dieselbe Auswahl auf zwei
   Reitern zwei verschiedene Bestände. */
function taskModel(){
  const cap=S.values?.capacity?.value??50;
  const inReach=t=>t.activationEnergy<=cap/10;
  const overdue=t=>!!t.decayAt&&new Date(t.decayAt).getTime()<Date.now();

  const byId=new Map(tasks.map(t=>[t.id,t]));
  const kids=new Map();
  for(const t of tasks){
    // Ein Elternteil, das nicht im Bestand steht, ist keins: Sonst hinge ein
    // Schritt an einer Klammer, die niemand sehen kann.
    const parent=t.parentId&&t.parentId!==t.id&&byId.has(t.parentId)?t.parentId:null;
    if(!parent) continue;
    if(!kids.has(parent)) kids.set(parent,[]);
    kids.get(parent).push(t);
  }
  // Eine Klammer, die es nicht mehr gibt, filterte sonst alles weg — und
  // zwar stumm, weil auch ihre Leiste verschwunden wäre.
  if(bracket&&!byId.has(bracket)) bracket=null;

  const q=tprefs.q.trim().toLowerCase();
  const parentOf=t=>
    t.parentId&&t.parentId!==t.id?(byId.get(t.parentId)||null):null;
  const open=t=>t.state!=='done'&&t.state!=='dropped';
  const openKids=t=>(kids.get(t.id)||[]).filter(open);
  // Eine Klammer ist eine Aufgabe mit offenen Schritten. Ist der letzte
  // abgearbeitet, ist sie keine mehr und steht wieder als Zeile im Bestand
  // — dort, wo sie erledigt werden kann.
  const isBracket=t=>open(t)&&openKids(t).length>0;
  /* „Wartet" kommt vom Server (`waiting`, `blockedByCount`). Solange er die
     Felder nicht liefert, bleibt der Zustand `blocked` die einzige Quelle —
     geraten wird nichts. */
  const waiting=t=>t.waiting===true||(t.blockedByCount||0)>0||t.state==='blocked';
  // Gedeckelt, weil eine im Kreis zeigende Kette sonst hier hängenbliebe.
  const chainOf=t=>{
    const out=[];let p=parentOf(t),guard=0;
    while(p&&guard++<24){out.unshift(p);p=parentOf(p)}
    return out;
  };
  // Der Ausschnitt reicht über alle Ebenen: Zerlegen geht beliebig tief,
  // und ein Filter, der nur eine Ebene tief greift, versteckte genau die
  // Schritte, für die man ihn gesetzt hat.
  const inScope=t=>{
    if(!bracket) return true;
    let p=parentOf(t),guard=0;
    while(p&&guard++<24){if(p.id===bracket) return true;p=parentOf(p)}
    return false;
  };

  const hits=t=>{
    if(t.state==='dropped') return false;
    if(t.state==='done'&&!tprefs.done) return false;
    if(!inScope(t)) return false;
    if(q&&!String(t.title||'').toLowerCase().includes(q)) return false;
    if(tprefs.reach&&!(inReach(t)&&t.state!=='done')) return false;
    if(tprefs.overdue&&!overdue(t)) return false;
    return true;
  };
  const rank=t=>t.state==='active'?0:t.state==='ready'?(inReach(t)?1:2)
    :t.state==='blocked'?3:4;
  // Gezählt wird auf dem Gerät: Zweimal dieselbe Zählung wäre zweimal die
  // Gelegenheit, sie unterschiedlich zu machen. Hier wird nur gezählt,
  // solange der Server die Zahlen nicht mitliefert.
  const total=t=>t.childCount===undefined?(kids.get(t.id)||[]).length:t.childCount;
  const doneKids=t=>t.doneCount===undefined
    ?(kids.get(t.id)||[]).filter(c=>c.state==='done').length:t.doneCount;
  return {cap,inReach,overdue,byId,kids,hits,rank,total,doneKids,parentOf,
    open,openKids,isBracket,waiting,chainOf,inScope};
}

/* ── Gruppen ─────────────────────────────────────────────────────────
   Eine Achse, nicht zwei. „In Reichweite" und „Nicht in Reichweite" sind
   Aussagen über die Kapazität von heute; „läuft" und „wartet" darüber, ob
   überhaupt angefangen werden kann. „Zerlegt" stand hier einmal daneben und
   war der Fehler: Das ist eine bauliche Tatsache, keine Position auf dieser
   Achse — und eine Aufgabe stand dann entweder zweimal da oder einmal
   falsch. Die zerlegten Aufgaben stehen jetzt als Klammern über dem Board.

   Jede Aufgabe steht in genau einer Gruppe, entschieden in dieser
   Reihenfolge: Was läuft, läuft. Was auf etwas anderes wartet, wartet. Über
   den Rest entscheidet die Kapazität.

   Eine Funktion, keine Konstante: Die Beschriftung entsteht beim Zeichnen.
   Als Konstante lief `tr()` beim Laden des Skripts — da galt noch die
   geratene Browsersprache, denn die des Telefons kommt erst mit der ersten
   Antwort. In einer englischen Oberfläche standen deshalb fünf deutsche
   Spaltenüberschriften, im aria-label eingeschlossen. */
function groups(){
  return [
    {key:'run',label:tr('Läuft'),color:'var(--calm)'},
    {key:'reach',label:tr('In Reichweite'),color:'var(--signal)'},
    {key:'far',label:tr('Nicht in Reichweite'),color:'var(--rule)'},
    // Erscheint erst, wenn etwas wartet. Eine dauerhaft leere Spalte ist
    // Fläche ohne Aussage — und der Server liefert `waiting` gerade erst.
    {key:'wait',label:tr('Wartet'),color:'var(--info)',onlyIfFull:true},
    // Erledigtes misst nichts mehr — deshalb die leiseste Farbe, und die
    // Gruppe erscheint nur, wenn derselbe Filter sie auch sonst zeigt.
    {key:'done',label:tr('Erledigt'),color:'var(--faint)'}];
}

function groupOf(t,m){
  if(t.state==='done') return 'done';
  if(t.state==='active') return 'run';
  if(m.waiting(t)) return 'wait';
  return (t.state==='ready'&&m.inReach(t))?'reach':'far';
}

function groupedTasks(m){
  const map=new Map(groups().map(g=>[g.key,[]]));
  let shown=0;
  for(const t of tasks){
    // Klammern stehen in der Leiste, nicht im Bestand: Sonst stünde die
    // zerlegte Aufgabe neben ihren eigenen Schritten zur Wahl, und genau
    // diese Doppelung löst das Zerlegen ja auf.
    if(!m.hits(t)||m.isBracket(t)) continue;
    map.get(groupOf(t,m)).push(t);
    shown++;
  }
  // Dieselbe Rangfolge wie überall: erst was läuft, dann was in Reichweite
  // ist, bei Gleichstand der leichtere Anfang. Keine zweite Ordnung.
  const order=(a,b)=>m.rank(a)-m.rank(b)||a.activationEnergy-b.activationEnergy
    ||String(a.title).localeCompare(String(b.title),'de');
  for(const list of map.values()) list.sort(order);
  return {map,shown};
}
/* Im Board bleibt eine leere Gruppe stehen: „In Reichweite: 0" ist dort die
   Antwort auf die Frage, wegen der man hinsieht. In der Liste wäre sie ein
   Band ohne Inhalt, an dem man vorbeiscrollt — eine Liste zeigt, was da
   ist. */
function visibleGroups(map,asColumns){
  return groups().filter(g=>{
    const count=map.get(g.key).length;
    if(g.key==='done') return tprefs.done&&(asColumns||count>0);
    if(g.onlyIfFull) return count>0;
    return asColumns||count>0;
  });
}

function groupBlock(g,list,m,asColumn){
  const open=!shut[g.key];
  const band=el('button',{class:'gband','aria-expanded':open?'true':'false',
    onclick:()=>{shut[g.key]=open;redrawTasks()}},
    el('span',{class:'caret'}),
    el('span',{class:'gname'},g.label),
    el('span',{class:'gcount mono'},String(list.length)));
  const body=!open?null:asColumn
    ?el('div',{class:'cards'},list.length?list.map(t=>boardCard(t,m)):el('p',{class:'empty'},'—'))
    :el('div',{class:'rows'},list.length?list.map(t=>taskRow(t,m)):el('p',{class:'empty'},'—'));
  return el('div',{class:'group'+(open?'':' shut'),role:'group',
    'aria-label':g.label+': '+list.length,style:'--group:'+g.color},
    band,body,
    open?el('button',{class:'gadd',onclick:()=>taskDialog()},tr('+ Aufgabe')):null);
}

/* ── Klammerleiste ───────────────────────────────────────────────────
   Gezeigt wird, was offene Schritte hat. Eine abgearbeitete Klammer
   verschwindet von selbst — sonst wächst die Leiste zu und wird selbst zur
   Pflege (D3). Der Fortschritt steht daneben, weil „2/5" die Frage
   beantwortet, für die man sonst hineinklickt. */
function bracketsIn(m){
  return tasks.filter(t=>m.isBracket(t)&&m.inScope(t))
    .sort((a,b)=>String(a.title).localeCompare(String(b.title),'de'));
}
function bracketChip(t,m,pressed){
  return el('button',{class:'brk','aria-pressed':pressed?'true':'false',
    onclick:()=>chooseBracket(t.id)},
    t.title,el('span',{class:'num'},m.doneKids(t)+'/'+m.total(t)));
}
function fillBrackets(box,m){
  const list=bracketsIn(m);
  const chosen=bracket?m.byId.get(bracket):null;
  // Ohne Klammern keine Leiste: eine Zeile, die immer „Alles" sagt, sagt
  // nichts.
  if(!list.length&&!chosen){put(box);return}
  const kids=[];
  if(chosen){
    // Brotkrumen statt einer Ebene: Zerlegen geht beliebig tief, und wer
    // drei Ebenen unten steht, muss zurückfinden, ohne zurückzuraten.
    const path=[...m.chainOf(chosen),chosen];
    kids.push(el('div',{class:'crumb'},
      el('button',{class:'brk',onclick:()=>chooseBracket(null)},tr('Alles')),
      path.map((p,i)=>[el('span',{class:'sep'},'›'),
        bracketChip(p,m,i===path.length-1)])));
  }else{
    kids.push(el('button',{class:'brk','aria-pressed':'true',
      onclick:()=>chooseBracket(null)},tr('Alles')));
  }
  for(const t of list) kids.push(bracketChip(t,m,false));
  put(box,el('div',{class:'brackets'},kids));
}

/* Die gewählte Klammer bekommt eine eigene Kopfzeile mit ihren eigenen
   Handlungen. Vorher war sie der eine Punkt, an den man nicht herankam:
   Als Karte stand sie zwischen ihren Schritten, gefiltert stand sie
   nirgends. */
function fillHead(box,m){
  const t=bracket?m.byId.get(bracket):null;
  if(!t){put(box);return}
  put(box,el('div',{class:'bhead'},
    el('div',{class:'eyebrow'},tr('Gewählte Klammer')),
    el('button',{class:'title tlink',onclick:()=>taskSheet(t.id)},t.title),
    el('div',{class:'cells'},cellsOf(t,m),
      el('span',{class:'cell'},tr('Schritte {0} von {1}',[m.doneKids(t),m.total(t)]))),
    el('div',{class:'acts'},taskActions(t,m),
      el('button',{class:'btn quiet',onclick:()=>taskSheet(t.id)},tr('Details')))));
}

function fillTasks(box,m){
  m=m||taskModel();
  if(!tasks.length){put(box,emptyStock());return}
  const {map,shown}=groupedTasks(m);
  if(!shown){put(box,noMatch());return}
  put(box,visibleGroups(map,false).map(g=>groupBlock(g,map.get(g.key),m,false)));
}

function fillBoard(box,m){
  m=m||taskModel();
  const {map,shown}=groupedTasks(m);
  box.classList.toggle('flat',!tasks.length||!shown);
  if(!tasks.length){put(box,emptyStock());return}
  if(!shown){put(box,noMatch());return}
  put(box,visibleGroups(map,true).map(g=>groupBlock(g,map.get(g.key),m,true)));
}

const emptyStock=()=>el('p',{},
  tr('Nichts eingetragen. Was du links erfasst, landet zuerst im Eingang.'));
const noMatch=()=>[
  el('p',{},bracket
    ?tr('In dieser Klammer ist gerade nichts offen.')
    :tr('Nichts passt zu dieser Auswahl.')),
  el('div',{class:'row'},el('button',{class:'btn quiet',onclick:()=>{
    setTPref('q','');setTPref('reach',false);setTPref('overdue',false);setTPref('done',false);
    bracket=null;render();
  }},tr('Filter zurücksetzen')))];

/* Vier Stufen, abgeleitet aus einem Abstand — nicht aus einer Meinung über
   die Aufgabe. Erledigtes bleibt neutral: Eine Frist, die nicht mehr läuft,
   misst nichts mehr. */
function dueRamp(t){
  if(!expires(t)) return null;
  const hours=(new Date(t.decayAt).getTime()-Date.now())/36e5;
  return hours<0?'over':hours<24?'day':hours<72?'days':null;
}
const expires=t=>!!t.decayAt&&t.state!=='done'&&t.state!=='dropped';

/* Die Werte einer Aufgabe, in immer derselben Reihenfolge und in immer
   derselben Form — daran hängt, dass die Spalten senkrecht fluchten. Gefüllt
   ist nur, was eine Messung trägt: Startenergie und Frist. Der Rest bleibt
   Beschriftung. */
function cellsOf(t,m){
  return [
    el('span',{class:'pill ae'},tr('Start {0}/10',[t.activationEnergy])),
    el('span',{class:'cell'},tr('Sog {0}',[t.salience])),
    el('span',{class:'cell'},tr('Folgen {0}',[t.stakes])),
    /* Aus demselben Grund steht an etwas Erledigtem keine Frist mehr:
       „Überfällig" an etwas, das getan ist, wäre ein Vorwurf für nichts. */
    expires(t)?el('span',{class:'pill due','data-due':dueRamp(t)},dueLabel(t.decayAt)):null,
    // Der Ort ist getippter Text des Nutzers. `toUpperCase()` machte daraus
    // ein Signalwort, das keins ist — und schrieb ihm seine Schreibweise um.
    t.place?el('span',{class:'cell'},tr('Ort {0}',[t.place])):null,
    m.waiting(t)?el('span',{class:'cell'},
      t.blockedByCount?tr('Wartet auf {0}',[t.blockedByCount]):tr('Wartet')):null];
}

/* Welche Handlungen offenstehen, hängt am Zustand und sonst nichts —
   dieselbe Liste in Liste, Board und Detailansicht, sonst böte dieselbe
   Aufgabe je nach Ort etwas anderes an. Und dieselbe Liste wie auf dem
   Telefon (tasks_screen.dart), sonst kann man im Browser etwas nicht, was
   dort geht — der teuerste Unterschied, weil man ihn für einen Fehler hält.

   Zerlegen hängt an jeder offenen Zeile, auf jeder Ebene: auch an einem
   Teilschritt, der sich als immer noch zu groß herausstellt, und auch an
   einer Klammer, die schon Schritte hat — dann kommen welche hinzu. Die
   Hürde liegt am Anfang, und wo sie liegt, weiß nur der Nutzer [D2].

   Nur „Anfangen" fehlt der Klammer: Sie ist durch ihre Schritte vertreten,
   und sie neben ihnen zur Wahl zu stellen wäre genau die Doppelung, die das
   Zerlegen auflöst. */
function taskActions(t,m,after){
  if(t.state==='done'||t.state==='dropped') return [];
  const go=fn=>()=>{if(after) after();fn()};
  const split=el('button',{class:'btn quiet',
    onclick:go(()=>atomizeDialog({taskId:t.id,title:t.title}))},tr('Zerlegen'));
  const complete=el('button',{class:'btn',onclick:go(()=>act(t.id,'complete'))},tr('Erledigt'));
  if(t.state==='active') return [
    el('button',{class:'btn primary',onclick:go(()=>act(t.id,'complete'))},tr('Erledigt')),
    el('button',{class:'btn',onclick:go(()=>act(t.id,'release'))},tr('Zurücklegen')),split];
  if(t.state==='blocked'||(m&&m.isBracket(t))) return [complete,split];
  return [
    el('button',{class:'btn primary',onclick:go(()=>act(t.id,'start'))},tr('Anfangen')),
    complete,split];
}

function taskRow(t,m){
  const cls=['trow'];
  if(t.state==='active') cls.push('run');
  if(t.state==='done') cls.push('done');
  const parent=m.parentOf(t);
  return el('div',{class:cls.join(' ')},
    el('div',{},
      el('button',{class:'title tlink',onclick:()=>taskSheet(t.id)},t.title),
      /* Der Bezug bleibt erkennbar, ohne den Baum nachzubauen: Ohne diese
         Zeile stünde ein Schritt da, ohne dass zu sehen wäre, wozu er
         gehört. */
      parent?el('span',{class:'kin'},tr('Teilschritt von {0}',[parent.title])):null),
    el('div',{class:'cells'},cellsOf(t,m)),
    el('div',{class:'acts'},taskActions(t,m)));
}

function boardCard(t,m){
  const cls=['card'];
  if(t.state==='active') cls.push('run');
  if(t.state==='done') cls.push('done');
  const parent=m.parentOf(t);
  const acts=taskActions(t,m);
  return el('div',{class:cls.join(' '),'data-due':dueRamp(t)},
    parent?el('span',{class:'kin'},tr('Teilschritt von {0}',[parent.title])):null,
    el('button',{class:'title tlink',onclick:()=>taskSheet(t.id)},t.title),
    el('div',{class:'cells'},cellsOf(t,m)),
    acts.length?el('div',{class:'acts'},acts):null);
}

/* ── Detailansicht ───────────────────────────────────────────────────
   Der Ort, an dem eine Aufgabe vollständig existiert: alle Felder, der Baum
   in beide Richtungen, die Blocker in beide Richtungen, der Ereignisstrom
   und sämtliche Handlungen. Liste und Board zeigen Bestand; hier steht der
   Zusammenhang.

   Sie geht sofort auf, mit dem, was ohnehin geladen ist, und ergänzt sich,
   sobald der Server geantwortet hat. Kennt er die Route nicht, bleibt
   stehen, was da ist, und darüber ein Satz, was fehlt — eine Ansicht, die
   bei einem 404 gar nicht erst aufgeht, ist die schlechtere Hälfte von
   beidem. */
let detailId=null,detailFull=null,detailError=null,detailNote=null;
$('#dlg').addEventListener('close',()=>{
  detailId=null;detailFull=null;detailError=null;detailNote=null;
});

async function taskSheet(id,keepNote){
  detailId=id;detailFull=null;detailError=null;
  if(!keepNote) detailNote=null;
  paintDetail();
  try{
    const full=await api('/api/tasks/'+encodeURIComponent(id));
    if(detailId!==id) return;
    detailFull=full;
  }catch(e){
    if(detailId!==id) return;
    detailError=e.message;
  }
  paintDetail();
}

function paintDetail(){
  const id=detailId;
  if(!id) return;
  const m=taskModel();
  const local=m.byId.get(id);
  if(!local&&!detailFull){
    sheet(tr('Aufgabe'),el('p',{},tr('Diese Aufgabe steht nicht mehr im Bestand.')),
      [],tr('Schließen'),{wide:true,focus:false});
    return;
  }
  const t=Object.assign({},local||{},detailFull||{});
  const close=()=>$('#dlg').close();
  const body=el('div',{class:'sheet'},
    el('div',{class:'cells'},cellsOf(t,m),
      el('span',{class:'cell'},m.inReach(t)?tr('In Reichweite'):tr('Nicht in Reichweite'))),
    detailError?el('p',{class:'why'},
      tr('Blocker und Ereignisstrom liefert dieser Server nicht — was hier steht, kommt aus dem Bestand.'),
      el('span',{class:'mono',style:'display:block;font-size:.78rem;margin-top:.3rem'},detailError)):null,
    treeSection(t,m),
    blockerSection(t,m),
    eventSection());
  sheet(t.title||tr('Aufgabe'),body,taskActions(t,m,close),tr('Schließen'),
    {wide:true,focus:false});
}

/* Kette nach oben, Schritte darunter. Beide Richtungen anklickbar: Wer eine
   Aufgabe offen hat, will von hier aus weiter und nicht zurück in die Liste
   und wieder hinein. */
function treeSection(t,m){
  const parents=(detailFull&&detailFull.parents)||m.chainOf(t);
  const children=(detailFull&&detailFull.children)||m.kids.get(t.id)||[];
  if(!parents.length&&!children.length) return null;
  return section(tr('Baum'),
    parents.length?el('div',{class:'crumb'},
      parents.map((p,i)=>[i?el('span',{class:'sep'},'›'):null,
        el('button',{class:'brk',onclick:()=>taskSheet(p.id)},p.title)])):null,
    children.length?el('div',{class:'tree'},
      children.map(c=>el('button',{class:'node'+(c.state==='done'?' done':''),
        onclick:()=>taskSheet(c.id)},
        c.title,
        c.activationEnergy?el('span',{class:'cell'},tr('Start {0}/10',[c.activationEnergy])):null))):null,
    children.length?null:el('p',{class:'faint'},tr('Keine Schritte. Zerlegen legt welche an.')));
}

/* Blocker in beide Richtungen: „wartet auf" ist die Frage, warum hier nichts
   geht; „hält auf" die Frage, warum es woanders nicht geht. Nur die zweite
   erklärt, weshalb eine kleine Aufgabe vorgezogen gehört. */
function blockerSection(t,m){
  if(!detailFull) return null;
  const before=detailFull.blockedBy||[],after=detailFull.blocks||[];
  const known=new Set([...before,...after].map(x=>x.id));
  const line=(x,drop)=>el('div',{class:'node'+(x.done||x.state==='done'?' done':'')},
    el('button',{class:'tlink',onclick:()=>taskSheet(x.id)},x.title),
    drop?el('button',{class:'drop',title:tr('Blocker entfernen'),
      onclick:()=>dropBlocker(t.id,x.id)},tr('Entfernen')):null);
  return section(tr('Blocker'),
    el('div',{class:'eyebrow'},tr('Wartet auf')),
    before.length?el('div',{class:'tree'},before.map(x=>line(x,true)))
      :el('p',{class:'faint'},tr('Nichts.')),
    el('div',{class:'eyebrow',style:'margin-top:.6rem'},tr('Hält auf')),
    after.length?el('div',{class:'tree'},after.map(x=>line(x,false)))
      :el('p',{class:'faint'},tr('Nichts.')),
    blockerPicker(t.id,known),
    cycleBox(m));
}

function blockerPicker(id,known){
  const out=el('div',{class:'picks'});
  const input=el('input',{type:'search',placeholder:tr('Wartet auf … (Aufgabe suchen)'),
    'aria-label':tr('Blocker suchen')});
  const fill=()=>{
    const q=input.value.trim().toLowerCase();
    const list=tasks.filter(x=>x.id!==id&&x.state!=='done'&&x.state!=='dropped'
      &&!known.has(x.id)&&(!q||String(x.title||'').toLowerCase().includes(q)))
      .slice(0,8);
    put(out,list.length
      ?list.map(x=>el('button',{class:'btn',onclick:()=>addBlocker(id,x.id)},x.title))
      :el('p',{class:'faint'},tr('Nichts gefunden.')));
  };
  input.addEventListener('input',fill);
  fill();
  return el('div',{style:'margin-top:.7rem'},input,out);
}

async function addBlocker(id,blockerId){
  try{
    await api('/api/tasks/'+encodeURIComponent(id)+'/blockers',
      {method:'POST',body:JSON.stringify({blockerId})});
    detailNote=null;
    await reload();
    await taskSheet(id);
  }catch(e){
    const path=e.data&&Array.isArray(e.data.path)?e.data.path:null;
    detailNote=(path&&path.length)?{path}:{text:e.message};
    paintDetail();
  }
}
async function dropBlocker(id,blockerId){
  try{
    await api('/api/tasks/'+encodeURIComponent(id)+'/blockers/'+encodeURIComponent(blockerId),
      {method:'DELETE'});
    detailNote=null;
    await reload();
    await taskSheet(id);
  }catch(e){detailNote={text:e.message};paintDetail()}
}

/* Der Kreis wird gezeigt, nicht bloß abgelehnt. „Geht nicht" ohne Grund ist
   in diesem System der teuerste Fehlermodus: Man probiert es dreimal und
   hält danach das Werkzeug für kaputt. */
function cycleBox(m){
  if(!detailNote) return null;
  if(!detailNote.path) return el('div',{class:'cycle'},el('p',{},detailNote.text));
  return el('div',{class:'cycle'},
    el('p',{},tr('Das schlösse einen Kreis. Jede dieser Aufgaben wartete am Ende auf sich selbst, und dann gibt es keine, mit der angefangen werden kann.')),
    el('p',{class:'path'},detailNote.path.map(p=>{
      if(p&&typeof p==='object') return String(p.title||p.id||'');
      const t=m.byId.get(p);
      return t?t.title:String(p);
    }).join(' → ')));
}

function eventSection(){
  if(!detailFull) return null;
  const events=detailFull.events||[];
  return section(tr('Ereignisse'),
    events.length?events.slice(0,60).map(e=>el('div',{class:'ev'},
      el('span',{class:'t'},new Date(e.at).toLocaleString('de',
        {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})),
      el('span',{class:'k'},e.type),
      el('span',{class:'p',title:JSON.stringify(e.payload)},JSON.stringify(e.payload))))
      :el('p',{class:'faint'},tr('Noch nichts geschehen.')),
    el('p',{class:'faint',style:'margin-top:.4rem'},
      tr('Nur lesend. Eine Korrektur ist ein neues Ereignis.')));
}

function viewInbox(){
  const frag=document.createDocumentFragment();
  if(!inbox.notes.length){frag.append(el('p',{},tr('Nichts zu sortieren.')));return frag}
  frag.append(el('div',{class:'sec'},
    el('span',{class:'eyebrow'},tr('Unsortiert · {0}',[inbox.notes.length])),el('span',{class:'line'})));
  for(const n of inbox.notes){
    frag.append(el('div',{class:'item'},el('span',{class:'bar'}),
      el('div',{},el('div',{class:'title'},n.text||''),
        el('div',{class:'meta'},
          el('span',{},new Date(n.at).toLocaleString('de',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})),
          // Der Kanal, wie er heißt. `toUpperCase()` machte aus „spen" ein
          // SPEN — ein Signalwort für etwas, das bloß dabeisteht.
          el('span',{},String(n.via||'')),
          noteAge(n))),
      el('div',{class:'acts'},
        // Ein Tipp, nicht drei Regler.
        //
        // „Sortieren" fragt Startenergie, Sog und Folgen ab — drei
        // Entscheidungen pro Notiz, und genau deshalb blieb der Eingang
        // liegen. Der Regelfall ist jetzt: uebernehmen, mit Mittelwerten,
        // sofort startbar. Die Zahlen stehen an der Aufgabe und lassen sich
        // dort jederzeit aendern; falsch geschaetzt ist besser als
        // unentschieden liegengeblieben (G1).
        el('button',{class:'btn primary',onclick:busy(()=>adoptNote(n))},tr('Als Aufgabe')),
        el('button',{class:'btn',onclick:()=>taskDialog(n.text,n.id)},tr('Mit Werten')),
        el('button',{class:'btn quiet',onclick:busy(()=>dismissNote(n))},tr('Keine Aufgabe')))));
  }
  return frag;
}

/* Wie lange die Notiz schon liegt — und ab drei Tagen sichtbar.
   Das Datum allein beantwortet die Frage nicht: „03.08." rechnet niemand
   im Kopf in „seit vier Tagen" um, und genau diese Zahl ist der Befund.
   Dieselbe Schwelle wie R-150, damit die Anzeige und die Regel nicht
   verschiedene Dinge „alt" nennen. */
function noteAge(n){
  const hours=(Date.now()-new Date(n.at).getTime())/3600000;
  if(hours<72) return null;
  const days=Math.floor(hours/24);
  return el('span',{style:'color:var(--caution)'},tr('seit {0} Tagen',[days]));
}

/* Der Titel einer übernommenen Notiz.

   Der Kern kennt keine Längengrenze — der Weg über HTTP schon: `/api/capture`
   nimmt 4000 Zeichen an, `/api/tasks` nur 500. Ein geteilter Artikelauszug
   ließ den Knopf deshalb wirkungslos aussehen: Die Anfrage wurde abgelehnt,
   die Notiz blieb stehen, gesagt wurde nichts. Übernommen wird jetzt die
   erste Zeile, nötigenfalls an einer Wortgrenze gekürzt. Verloren geht dabei
   nichts — die Erfassung bleibt als Ereignis stehen und hängt über
   `fromCapture` an der Aufgabe. */
const MAX_TITLE=500;
function noteTitle(text){
  const whole=String(text||'').trim();
  const first=whole.split('\n').map(s=>s.trim()).find(s=>s)||whole;
  if(first.length<=MAX_TITLE) return first;
  const cut=first.slice(0,MAX_TITLE-2);
  const space=cut.lastIndexOf(' ');
  return (space>MAX_TITLE/2?cut.slice(0,space):cut)+' …';
}

/* Notiz zu Aufgabe, ohne Rueckfrage. Mittelwerte, weil im Erfassungsmoment
   ohnehin niemand ehrlich schaetzt — dieselbe Begruendung, aus der der
   Eingang der App die Salienz nicht abfragt. */
async function adoptNote(n){
  const title=noteTitle(n.text);
  await api('/api/tasks',{method:'POST',body:JSON.stringify({
    title,activationEnergy:5,salience:5,stakes:5,fromCapture:n.id})});
  toast(title===String(n.text||'').trim()
    ?tr('Übernommen.')
    :tr('Übernommen — der Titel steht gekürzt an der Aufgabe.'));
  await reload();
}

/* Beantwortet, ohne Aufgabe zu werden. Das Ereignis bleibt — verworfen ist
   nicht geloescht. */
async function dismissNote(n){
  await api('/api/inbox/'+encodeURIComponent(n.id)+'/dismiss',{method:'POST'});
  toast(tr('Aus dem Eingang genommen.'));
  await reload();
}

        // Regel-ID und Defizitschlüssel sind Verweise und bleiben in Mono;

        el('div',{class:'meta'},el('span',{class:'rid'},r.id),

        // im YAML, das der Server ohnehin mitliefert.

function rationaleOf(rule){
  if(rule._rationale===undefined){
    try{rule._rationale=String(parseRuleDraft(rule.yaml||'').rationale||'')}
    catch(e){rule._rationale=String(rule.condition||'')}
  }
  return rule._rationale;
}

/* ── Hilfe ───────────────────────────────────────────────────────────
   Die Bedienungsanleitung, im Browser lesbar. Sie liegt als Markdown im
   App-Bündel und kommt kapitelweise vom Server — dieselben Texte, die auf
   dem Telefon in der Hilfe stehen, keine zweite Fassung.

   Warum sie hier überhaupt anders ist als dort: Auf dem Telefon liest man
   ein Kapitel und muss für jeden Sprung zurück. Hier stehen Liste und
   Kapitel nebeneinander und die Suche geht über alle — das ist der ganze
   Unterschied, und er ist der Grund, warum diese Fläche existiert.

   Die Sprachwahl gilt nur für die Doku und ist trotzdem an die Oberfläche
   gebunden: Voreingestellt ist deren Sprache, denn ein deutsches Kapitel in
   einer englischen Oberfläche ist eine halbe Übersetzung. Wer hier
   ausdrücklich wählt, gewinnt — dann bleibt es dabei, auch wenn die App
   umschaltet. Fehlt eine Fassung, kommt die deutsche mit einem Hinweis
   darüber statt einer leeren Seite. */
let helpChapters=[],helpId=null,helpDoc=null,helpQuery='',helpError=null;
let helpAllLoaded=false,helpLoading=null;
/* Der gespeicherte Wert nur, wenn er existiert: Sonst stand die Hilfe auf
   Deutsch, bevor die Sprache vom Telefon überhaupt da war — und blieb dort. */
let helpLang=(c=>c==='de'||c==='en'?c:LANG)(localStorage.getItem('axiom.help.lang'));
const helpCache=new Map();

async function loadHelp(){
  try{helpChapters=(await api('/api/help?lang='+helpLang)).chapters||[];helpError=null}
  catch(e){helpChapters=[];helpError=e.message}
  if(!helpChapters.some(c=>c.id===helpId))
    helpId=helpChapters.length?helpChapters[0].id:null;
  helpDoc=helpId?await helpDocOf(helpId):null;
}
/* Einmal geholt, bleibt im Speicher. Vierzehn Kapitel Text sind hier kein
   Speicherproblem — auf dem Telefon wäre das eine andere Frage, und genau
   deshalb steht die Suche nur hier. Fehlgeschlagenes wird nicht gemerkt:
   Ein Kapitel, das der Server gerade nicht hatte, soll beim nächsten Klick
   wieder versucht werden. */
async function helpDocOf(id){
  const key=helpLang+'/'+id;
  if(helpCache.has(key)) return helpCache.get(key);
  try{
    const doc=await api('/api/help/'+encodeURIComponent(id)+'?lang='+helpLang);
    helpCache.set(key,doc);
    return doc;
  }catch(e){return {id,title:'',markdown:'',error:e.message}}
}
async function openChapter(id){
  if(!id) return;
  helpId=id;
  helpDoc=await helpDocOf(id);
  if(tab!=='help'){tab='help';localStorage.setItem('axiom.tab',tab);markTabs()}
  render();
  // Wer einem Verweis folgt, will den Anfang des Kapitels sehen und nicht
  // die Stelle, an der er stand.
  const box=$('#chapter');
  if(box) box.scrollIntoView({block:'nearest'});
}
async function setHelpLang(lang){
  if(lang===helpLang) return;
  helpLang=lang;localStorage.setItem('axiom.help.lang',lang);
  helpAllLoaded=false;helpLoading=null;
  await loadHelp();render();
}

/* Gesucht wird im Text, nicht nur in den Überschriften: Wer „Reizbudget"
   eintippt, weiß meist nicht, in welchem Kapitel es steht — das ist der
   Grund, aus dem er sucht. Dafür werden beim ersten Tastendruck alle
   Kapitel einmal geholt. */
async function helpSearchInput(e){
  helpQuery=e.target.value;
  if(helpQuery.trim()&&!helpAllLoaded){
    // Auf denselben Lauf warten, nicht einen zweiten starten: Sonst
    // schickt jeder weitere Tastendruck vor der ersten Antwort noch
    // einmal vierzehn Anfragen an ein Telefon.
    helpLoading=helpLoading||Promise.all(helpChapters.map(c=>helpDocOf(c.id)));
    await helpLoading;
    helpAllLoaded=true;helpLoading=null;
  }
  const list=$('#help-list');
  if(list) fillToc(list);
}
function helpMatches(){
  const q=helpQuery.trim().toLowerCase();
  if(!q) return helpChapters.map(c=>({id:c.id,title:c.title,hit:null}));
  const out=[];
  for(const c of helpChapters){
    const doc=helpCache.get(helpLang+'/'+c.id);
    const text=String((doc&&doc.markdown)||'');
    const at=text.toLowerCase().indexOf(q);
    if(at<0&&!String(c.title||'').toLowerCase().includes(q)) continue;
    out.push({id:c.id,title:c.title,hit:at<0?null:helpExcerpt(text,at,q.length)});
  }
  return out;
}
function helpExcerpt(text,at,length){
  const from=Math.max(0,at-40);
  return (from?'… ':'')+
    text.slice(from,at+length+50).replace(/\s+/g,' ').trim()+' …';
}

function viewHelp(){
  const list=el('div',{id:'help-list'});
  const chapter=el('div',{class:'chapter md',id:'chapter'});
  fillToc(list);fillChapter(chapter);
  return el('div',{class:'help'},
    el('div',{class:'toc'},
      el('div',{class:'seg',role:'group','aria-label':tr('Sprache der Hilfe')},
        el('button',{'aria-pressed':helpLang==='de'?'true':'false',
          onclick:()=>setHelpLang('de')},tr('Deutsch')),
        el('button',{'aria-pressed':helpLang==='en'?'true':'false',
          onclick:()=>setHelpLang('en')},tr('Englisch'))),
      el('input',{type:'search',value:helpQuery,placeholder:tr('Suchen'),
        'aria-label':tr('Hilfe durchsuchen'),oninput:helpSearchInput}),
      list),
    chapter);
}
function fillToc(box){
  if(helpError){put(box,el('p',{class:'faint'},helpError));return}
  if(!helpChapters.length){
    put(box,el('p',{class:'faint'},tr('Keine Kapitel im Bündel.')));return;
  }
  const matches=helpMatches();
  if(!matches.length){put(box,el('p',{class:'faint'},tr('Nichts gefunden.')));return}
  put(box,matches.map(c=>el('button',{class:'ch',
    'aria-current':c.id===helpId?'true':'false',onclick:()=>openChapter(c.id)},
    el('span',{class:'num mono'},c.id),c.title,
    c.hit?el('span',{class:'hit'},c.hit):null)));
}
function fillChapter(box){
  if(!helpDoc){
    put(box,el('p',{class:'faint'},
      tr('Die Hilfe liegt als Text im App-Bündel. Steht dort nichts, zeigt der Server nichts — die Kapitel entstehen unter assets/help/.')));
    return;
  }
  if(helpDoc.error){put(box,el('p',{class:'faint'},helpDoc.error));return}
  put(box,
    helpDoc.fallback?el('p',{class:'why'},
      tr('Dieses Kapitel gibt es noch nicht auf Englisch. Darunter steht die deutsche Fassung.')):null,
    mdRender(helpDoc.markdown||''));
}

/* ── Hilfe: Darsteller — Anfang ───────────────────────────────────────
   Ein Markdown-Darsteller in genau dem Umfang, den die Doku benutzt:
   Überschriften, Fließtext mit fett und Code, zwei Sorten Aufzählung,
   hervorgehobener Absatz, Tabelle, Bild, Kapitelverweis. Mehr wäre eine
   zweite Baustelle mit eigenen Fehlern.

   **Kein Markup aus der Antwort.** Der Text ist von einem Menschen
   geschrieben, aber sein Weg hierher führt über das Netz — und ein
   Darsteller, der dem Browser eine Zeichenkette zum Auswerten gibt, macht
   aus jeder spitzen Klammer in der Doku eine Anweisung. Gebaut wird
   deshalb Knoten für Knoten mit el(). Der Test dazu verbietet die
   Eigenschaften, die das könnten, zwischen diesen beiden Marken
   namentlich — deshalb steht keine von ihnen hier im Text.

   Zwei Ziele werden erkannt, nicht übernommen: `img/name.webp` und
   `kapitel:NN`. Alles andere bleibt Text — auch ein Verweis nach draußen,
   den die Seite gar nicht laden dürfte (ADR-0005). Was der Darsteller
   nicht kennt, gibt er unverändert aus: Er darf nie werfen und nie etwas
   verschlucken, denn eine Zeile, die sichtbar unfertig aussieht, ist immer
   besser als eine, die verschwunden ist. */
/* Kursiv kommt nach fett — sonst schluckt `*…*` die erste Haelfte von
   `**…**` und aus fettem Text wird ein Sternchen mit Kursivschrift.
   Die Doku benutzt Kursiv fuer Navigationspfade („System → Erfassen") und
   fuer die Beschriftung von Bedienelementen; ohne diese Regel standen die
   Sternchen sichtbar im Text. */
const MD_INLINE=/\*\*([^*]+)\*\*|\*([^*\n]+)\*|`([^`]+)`|(!?)\[([^\]]*)\]\(([^)\s]+)\)/g;
const MD_IMG=/^img\/([a-z0-9-]+\.webp)$/;
const MD_CHAPTER=/^kapitel:(\d{2})$/;
const MD_BLOCK=/^(#{1,3}\s|\s*>|\s*[-*]\s|\s*\d+\.\s|\s*\|)/;

function mdRender(src){
  const frag=document.createDocumentFragment();
  const lines=String(src).replace(/\r/g,'').split('\n');
  let i=0;
  const take=test=>{const out=[];while(i<lines.length&&test(lines[i])) out.push(lines[i++]);return out};
  while(i<lines.length){
    const line=lines[i];
    if(!line.trim()){i++;continue}
    const head=/^(#{1,3})\s+(.*)$/.exec(line);
    if(head){i++;frag.append(el('h'+head[1].length,{},mdInline(head[2].trim())));continue}
    if(/^\s*>\s?/.test(line)){
      frag.append(el('blockquote',{},mdInline(
        take(l=>/^\s*>\s?/.test(l)).map(l=>l.replace(/^\s*>\s?/,'')).join(' ').trim())));
      continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      frag.append(el('ul',{},take(l=>/^\s*[-*]\s+/.test(l))
        .map(l=>el('li',{},mdInline(l.replace(/^\s*[-*]\s+/,''))))));
      continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      frag.append(el('ol',{},take(l=>/^\s*\d+\.\s+/.test(l))
        .map(l=>el('li',{},mdInline(l.replace(/^\s*\d+\.\s+/,''))))));
      continue;
    }
    if(/^\s*\|/.test(line)){frag.append(mdTable(take(l=>/^\s*\|/.test(l))));continue}
    // Die erste Zeile wird immer verbraucht — sonst stünde der Zeiger
    // still, wenn eine Zeile in keinen Zweig passt, und die Schleife liefe
    // ewig.
    const rows=[lines[i++]];
    while(i<lines.length&&lines[i].trim()&&!MD_BLOCK.test(lines[i])) rows.push(lines[i++]);
    frag.append(mdParagraph(rows.join(' ').trim()));
  }
  return frag;
}

/* Ein Absatz, der aus nichts als einem Bild besteht, wird zur Abbildung
   mit Unterschrift — der Alternativtext ist ohnehin die Bildunterschrift,
   und zweimal derselbe Satz wäre einmal zu viel. */
function mdParagraph(text){
  const only=/^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(text);
  if(only){
    const image=mdImage(only[2],only[1]);
    if(image) return el('figure',{},image,
      only[1]?el('figcaption',{},only[1]):null);
  }
  return el('p',{},mdInline(text));
}

function mdTable(rows){
  const cells=row=>row.trim().replace(/^\|/,'').replace(/\|$/,'')
    .split('|').map(c=>c.trim());
  const isRule=row=>/^\s*\|[\s:|-]+$/.test(row);
  const body=[];
  let head=null;
  rows.forEach((row,index)=>{
    // Die Trennzeile macht die Zeile darüber zum Kopf. Steht sie
    // woanders, wird sie übergangen statt als Inhalt gezeigt.
    if(isRule(row)){if(index===1&&body.length===1) head=body.pop();return}
    body.push(cells(row));
  });
  const table=el('table',{});
  if(head) table.append(el('thead',{},el('tr',{},head.map(c=>el('th',{},mdInline(c))))));
  table.append(el('tbody',{},body.map(r=>el('tr',{},r.map(c=>el('td',{},mdInline(c)))))));
  return el('div',{class:'scroll'},table);
}

function mdInline(text){
  const out=[];
  let last=0,m;
  MD_INLINE.lastIndex=0;
  while((m=MD_INLINE.exec(text))!==null){
    if(m.index>last) out.push(text.slice(last,m.index));
    last=MD_INLINE.lastIndex;
    if(m[1]!==undefined){out.push(el('strong',{},m[1]));continue}
    if(m[2]!==undefined){out.push(el('em',{},m[2]));continue}
    if(m[3]!==undefined){out.push(el('code',{},m[3]));continue}
    const node=m[4]==='!'?mdImage(m[6],m[5]):mdLink(m[6],m[5]);
    out.push(node===null?m[0]:node);
  }
  if(last<text.length) out.push(text.slice(last));
  return out;
}
/* Der Dateiname wird erkannt, nicht übernommen: Was nicht genau
   `img/name.webp` ist, wird hier kein Bildpfad. Der Server führt dieselbe
   Liste noch einmal und liefert nur aus, was darin steht — zwei Schlösser
   an derselben Tür, weil hinter ihr das ganze App-Bündel liegt. */
function mdImage(target,alt){
  const m=MD_IMG.exec(String(target));
  if(!m) return null;
  return el('img',{src:'/help/img/'+m[1],alt:alt||'',loading:'lazy'});
}
/* Nur Verweise ins eigene Regelwerk werden anklickbar, und sie werden ein
   Knopf statt eines Verweises: Ein Ziel aus dem Text der Antwort wäre eine
   Adresse, die diese Seite nicht kennt — und nach draußen führt hier
   nichts (ADR-0005). */
function mdLink(target,label){
  const m=MD_CHAPTER.exec(String(target));
  if(!m) return null;
  return el('button',{class:'lnk',onclick:()=>openChapter(m[1])},label||m[1]);
}

/* ── Blätter ─────────────────────────────────────────────────────────
   `showModal` wirft, wenn das Blatt schon offen ist. Die Detailansicht
   zeichnet sich aber neu, sobald der Server geantwortet hat — deshalb wird
   nur geöffnet, was noch zu ist, und der Fokus nur gesetzt, wo ein Blatt
   zum Ausfüllen da ist. In einer Ansicht mit Suchfeld spränge der Cursor
   sonst bei jeder Antwort dorthin zurück. */
function sheet(title,body,actions,closeLabel,opts){
  const d=$('#dlg');
  d.className=(opts&&opts.wide)?'wide':'';
  put(d,el('h2',{},title),body,
    el('div',{class:'row'},...actions,
      el('button',{class:'btn quiet',onclick:()=>d.close()},closeLabel||tr('Abbrechen'))));
  if(!d.open) d.showModal();
  if(!opts||opts.focus!==false){
    const first=d.querySelector('input,textarea');
    if(first) setTimeout(()=>first.focus(),30);
  }
  return d;
}
function dial(label,hint,low,high,value,min=1,max=5){
  const out=el('span',{class:'val mono'},String(value));
  const input=el('input',{type:'range',min,max,value,step:1,
    oninput:e=>{out.textContent=e.target.value}});
  const box=el('div',{class:'dial'},
    el('div',{class:'head'},el('label',{},label),out),
    hint?el('p',{class:'faint'},hint):null,input,
    el('div',{class:'ends'},el('span',{},low),el('span',{},high)));
  box.value=()=>Number(input.value);
  return box;
}

/* Dieselbe Grenze, die der Kern zieht (expert_server.dart). Vorher ließ der
   Dialog beliebig viele Zeilen anlegen; ab der einundzwanzigsten lehnte der
   Server ab, und weil der Knopf keinen Fehlerpfad hatte, geschah sichtbar
   gar nichts. Eine Grenze, die man erst nach dem Tippen erfährt, ist keine.
   [D2] */
const MAX_STEPS=20;

function atomizeDialog(cand){
  const rows=el('div',{});
  const note=el('p',{class:'hint'});
  const more=el('button',{class:'btn quiet'},tr('+ Schritt'));
  const add=(t='',e=2)=>{
    if(rows.children.length>=MAX_STEPS) return;
    rows.append(el('div',{class:'field',style:'display:flex;gap:.5rem;align-items:end'},
      el('div',{style:'flex:1'},el('label',{},tr('Schritt')),
        el('input',{type:'text',value:t,placeholder:tr('Erster kleiner Schritt')})),
      el('div',{},el('label',{},tr('Start')),
        el('input',{type:'number',min:1,max:10,value:e,style:'width:5rem'}))));
    const full=rows.children.length>=MAX_STEPS;
    more.disabled=full;
    note.textContent=full?tr('{0} Schritte sind die Grenze. Mehr ist ein Projektplan, kein Anfang.',[MAX_STEPS]):'';
  };
  more.addEventListener('click',()=>add());
  add();add();
  sheet(tr('Zerlegen: {0}',[cand.title]),el('div',{},
    el('p',{style:'margin-bottom:.9rem'},tr('Der erste Schritt muss so klein sein, dass er heute in Reichweite liegt. Alles andere darf größer bleiben.')),
    rows,more,note),[
    el('button',{class:'btn primary',onclick:busy(async()=>{
      const steps=[...rows.querySelectorAll('.field')].map(f=>({
        title:f.querySelector('input[type=text]').value.trim(),
        energy:Number(f.querySelector('input[type=number]').value)||2})).filter(s=>s.title);
      if(!steps.length){toast(tr('Mindestens ein Schritt.'));return}
      await api('/api/tasks/'+cand.taskId+'/atomize',{method:'POST',body:JSON.stringify({steps})});
      $('#dlg').close();toast(tr('Zerlegt.'));await reload();
    })},tr('Übernehmen'))]);
}

/* ── Regeleditor ─────────────────────────────────────────────────────
   Dasselbe wie am Telefon, nur mit Platz. Der Wortschatz kommt aus der
   Engine (/api/vocabulary) — der Editor bietet deshalb nur an, was sie
   versteht, statt eine Regel bauen zu lassen, die beim Laden abgelehnt
   wird. Jede Änderung wird gegen den Zustand von JETZT ausgewertet: Wer
   nachrechnen kann, muss nicht glauben (G2).

   Was er nicht tut: Er schreibt nicht nach rules/. Die Änderung liegt als
   Overlay in der Datenbank und lässt sich als YAML zurückkopieren. Und er
   lässt keine Regel sofort sprechen — sieben Tage stumm, ohne Ausnahme. */
let editor=null,vocab=null,vocabError=false,previewTimer=null;
let refPreview=null,refProblems=null,refSave=null;

async function openEditor(rule){
  if(S.configLocked) return;
  if(!vocab&&!vocabError){
    try{vocab=await api('/api/vocabulary')}catch(e){vocabError=true}
  }
  const draft=rule?draftOf(rule):newDraft();
  if(vocabError&&draft.mode!=='yaml'){draft.mode='yaml';draft.raw=yamlOrRaw(draft)}
  editor=draft;
  render();previewSoon();
}
function closeEditor(){clearTimeout(previewTimer);editor=null;render()}

function draftOf(rule){
  try{
    const d=parseRuleDraft(rule.yaml||'');
    d.edited=!!(rule.edited||rule.overridden);
    return d;
  }catch(e){
    // Lieber roh als gar nicht: Eine Regel, die dieser Editor nicht
    // darstellen kann, bleibt trotzdem bearbeitbar.
    const d=newDraft();
    d.id=rule.id;d.isNew=false;d.edited=!!(rule.edited||rule.overridden);
    d.mode='yaml';d.raw=rule.yaml||'';d.parseError=e.message;
    return d;
  }
}
function yamlOrRaw(d){try{return ruleYaml(d)}catch(e){return d.raw||''}}

/* Neue Regeln bekommen Nummern ab R-200. Darunter liegt das mitgelieferte
   Regelwerk; würde der Editor dort hineinvergeben, kollidierte die nächste
   ausgelieferte Regel mit einer selbst geschriebenen. */
function newDraft(){
  const used=rules.map(r=>parseInt(String(r.id).replace('R-',''),10))
    .filter(n=>Number.isFinite(n)&&n>=200);
  const next=used.length?Math.max(...used)+1:200;
  return {id:'R-'+String(next).padStart(3,'0'),isNew:true,edited:false,mode:'guided',
    title:'',rationale:'',deficit:null,severity:'nudge',priority:50,
    cooldownMinutes:120,maxPerDay:0,backoff:false,
    action:'notify',params:{},enabled:true,
    extra:{titles:{},rationales:{}},
    root:{t:'group',any:false,negated:false,children:[newLeaf()]},
    raw:null,preview:null,parseError:null};
}
function newLeaf(){
  const leaf={t:'leaf',kind:'number',negated:false,variable:'capacity',
    event:'checkin',op:'lt',number:40,symbol:'',from:'22:00',to:'05:00'};
  switchKind(leaf,'number');
  return leaf;
}
/* Beim Wechsel der Art gleich passende Voreinstellungen setzen: Sonst
   stünde dort ein Operator, den die neue Art nicht kennt — und die Regel
   liesse sich erst nach einem weiteren, unerklärten Schritt speichern. */
function switchKind(f,kind){
  const numerics=(vocab&&vocab.numerics)||[],symbolics=(vocab&&vocab.symbolics)||[],
    evts=(vocab&&vocab.events)||[];
  f.kind=kind;
  if(kind==='number'){f.variable=(numerics[0]||{id:'capacity'}).id;f.op='lt';f.number=40}
  else if(kind==='choice'){
    const first=symbolics[0];
    f.variable=first?first.id:'load_level';
    f.symbol=first?(Object.keys(first.values||{})[0]||''):'L2';
    f.op='eq';
  }else if(kind==='since'){f.event=(evts[0]||{id:'checkin'}).id;f.op='gte';f.number=120}
  else if(kind==='count'){f.event=(evts[0]||{id:'checkin'}).id;f.op='lt';f.number=1}
}
