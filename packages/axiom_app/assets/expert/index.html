<!--
  Expertenmodus — AXIOM am großen Bildschirm.

  Kein zweites AXIOM mit eigenem Geschmack, sondern dasselbe Instrument auf
  einer Fläche, die mehr trägt: dieselben sechs Paletten aus tokens.dart,
  dieselben zwei Schriften aus dem App-Bündel, dieselbe Kapazitätslinie.
  Wer beide nebeneinander offen hat, soll keinen Bruch sehen.

  Was hinzukommt, ist das, was ein Schreibtisch hergibt und eine Hand nicht:
  Bestand NEBEN der Handlung statt an ihrer Stelle, Tastenkürzel, Rohdaten.

  Was nicht hinzukommt, ist eine zweite Art zu entscheiden. Oben links steht
  genau eine Handlung, so wie auf dem Telefon (G1). Die Liste daneben ist
  Bestand, nicht Auswahl.

  Vollständig eigenständig: kein CDN, kein nachgeladenes Skript, keine
  fremde Schriftart. Das ist die Bedingung aus ADR-0005 — AXIOM ruft nichts
  von sich aus auf, und eine Seite, die eine Schrift von fremden Servern
  holt, täte genau das.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>AXIOM · Expertenmodus</title>
<!-- Dieselbe Marke wie im Kopf, ausgeliefert vom Server (`/favicon.svg`).
     Ohne sie steht im Reiter ein leeres Blatt, und wer AXIOM neben acht
     anderen Reitern offen hat, findet es am Symbol, nicht am Titel. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
/* ── Schriften ─────────────────────────────────────────────────────────
   Aus dem App-Bündel, ausgeliefert vom Server selbst. Mono trägt jeden
   Messwert — eine Systemschrift an dieser Stelle macht aus einem
   abgelesenen Wert einen gemeinten. */
@font-face{font-family:Plex;src:url(/font/sans-400.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/font/sans-500.ttf);font-weight:500;font-display:swap}
@font-face{font-family:PlexMono;src:url(/font/mono-400.ttf);font-weight:400;font-display:swap}
@font-face{font-family:PlexMono;src:url(/font/mono-500.ttf);font-weight:500;font-display:swap}

/* ── Paletten ──────────────────────────────────────────────────────────
   Wortgleich aus lib/design/tokens.dart, nicht nachempfunden.

   Eine einzige Rolle steht dort nicht: die Schrift auf der Signalfläche.
   Sie ist deshalb keine eigene Farbe, sondern die Seitenfarbe — in den
   dunklen Fassungen der größtmögliche Abstand zum Bernstein, in den hellen
   das Weiß der Frontplatte. So bleibt jeder Wert in dieser Datei einer aus
   tokens.dart, und ein siebter Farbwert kann nicht daneben altern. */
:root,[data-scheme=instrument][data-mode=dark]{
  --base:#0E1113;--panel:#171B1E;--raised:#1F2529;--rule:#2A3237;
  --ink:#ECEAE4;--dim:#9BA4AB;--faint:#7A848B;
  --signal:#E8A33D;--deep:#B8761F;--calm:#7FA88A;--caution:#C4653A;--info:#6E90A4;
  --on-signal:var(--base)}
[data-scheme=instrument][data-mode=light]{
  --base:#F2F1ED;--panel:#FFFFFF;--raised:#FAF9F6;--rule:#CFCCC4;
  --ink:#15181B;--dim:#4A545B;--faint:#6E767C;
  --signal:#9A6510;--deep:#7A4E08;--calm:#3F6B4F;--caution:#9C4522;--info:#3E6072;
  --on-signal:var(--panel)}
[data-scheme=contrast][data-mode=dark]{
  --base:#0A0C0E;--panel:#15191C;--raised:#1E2428;--rule:#3D474D;
  --ink:#F5F3EE;--dim:#C2C9CE;--faint:#9BA5AC;
  --signal:#FFBB55;--deep:#D08A28;--calm:#9CC7A6;--caution:#E08356;--info:#8FB3C7;
  --on-signal:var(--base)}
[data-scheme=contrast][data-mode=light]{
  --base:#FAFAF8;--panel:#FFFFFF;--raised:#F2F1ED;--rule:#B4B0A7;
  --ink:#0D1012;--dim:#3B4248;--faint:#5C666D;
  --signal:#7A4E08;--deep:#5C3A05;--calm:#2E5239;--caution:#7C3316;--info:#2B4757;
  --on-signal:var(--panel)}
[data-scheme=muted][data-mode=dark]{
  --base:#12100D;--panel:#1A1714;--raised:#221E1A;--rule:#332C26;
  --ink:#E0D8CC;--dim:#A3988A;--faint:#7D7264;
  --signal:#D79A55;--deep:#A87433;--calm:#8FA98C;--caution:#BE7A55;--info:#8B9AA0;
  --on-signal:var(--base)}
[data-scheme=muted][data-mode=light]{
  --base:#F4F0E7;--panel:#FBF8F1;--raised:#FFFDF8;--rule:#D5CDBE;
  --ink:#221E19;--dim:#57503F;--faint:#7A7263;
  --signal:#8A5A16;--deep:#6B450F;--calm:#44634A;--caution:#8C4A26;--info:#3F5A66;
  --on-signal:var(--panel)}

/* Vier Stufen wie in der App — kein stufenloser Regler. Ein Regler ist
   eine Entscheidung mit unendlich vielen Antworten (G1). */
[data-size=s]{--scale:.9}[data-size=m]{--scale:1}
[data-size=l]{--scale:1.18}[data-size=xl]{--scale:1.38}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--scale,1))}
body{background:var(--base);color:var(--ink);
  font:400 1rem/1.55 Plex,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem}
.mono{font-family:PlexMono,ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;
  padding:.7rem 1.25rem;background:color-mix(in srgb,var(--base) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:.5rem;font-weight:500;letter-spacing:.14em;font-size:.78rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.chip{font-family:PlexMono,monospace;font-size:.66rem;letter-spacing:.09em;padding:.28rem .5rem;
  border:1px solid var(--rule);border-radius:3px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.chip.on{border-color:var(--signal);color:var(--signal)}
.chip.warn{border-color:var(--caution);color:var(--caution)}
.spacer{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{font-family:PlexMono,monospace;font-size:.64rem;letter-spacing:.08em;padding:.3rem .48rem;
  color:var(--faint);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--signal)}
.seg button:hover{color:var(--ink)}
.budget{display:flex;align-items:center;gap:.45rem;min-width:8rem}
.budget .track{position:relative;flex:1;height:2px;background:var(--rule)}
.budget .fill{position:absolute;inset:0 auto 0 0;background:var(--signal)}
.budget.over .fill{background:var(--caution)}

main{max-width:1560px;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
@media(min-width:1080px){main{grid-template-columns:minmax(340px,26rem) 1fr;align-items:start}
  .rail{position:sticky;top:4.6rem}}
/* Ohne min-width:0 bemisst ein Grid-Feld sich am breitesten Inhalt statt am
   Platz. Eine waagerecht scrollende Spalte darin schöbe sonst die ganze
   Seite auseinander, statt selbst zu scrollen. */
.stack{min-width:0}
.rail{display:grid;gap:1rem;align-content:start}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:1.1rem}
.panel.accent{border-color:color-mix(in srgb,var(--signal) 55%,var(--rule))}
.panel.calm{border-color:color-mix(in srgb,var(--calm) 55%,var(--rule))}
.eyebrow{font-family:PlexMono,monospace;font-size:.65rem;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.sec{display:flex;align-items:center;gap:.75rem;margin:0 0 .7rem}
.sec .line{flex:1;height:1px;background:var(--rule)}
h1{font-size:1.65rem;font-weight:400;line-height:1.2;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:500}
p{color:var(--dim);font-size:.9rem}
.faint{color:var(--faint);font-size:.8rem}
.stamp{display:inline-flex;align-items:center;gap:.35rem;font-family:PlexMono,monospace;font-size:.68rem;
  letter-spacing:.08em;border:1px solid color-mix(in srgb,var(--info) 60%,transparent);
  color:var(--info);padding:.2rem .45rem;border-radius:3px}
.why{color:var(--dim);font-size:.85rem;border-left:2px solid var(--rule);padding-left:.75rem;margin:.85rem 0 0}
.row{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1.05rem}
.btn{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--rule);color:var(--ink);font-size:.88rem;
  transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--signal);color:var(--on-signal);border-color:var(--signal);font-weight:500}
.btn.primary:hover{background:var(--deep);border-color:var(--deep)}
.btn.quiet{border-color:transparent;color:var(--faint)}
.btn.quiet:hover{color:var(--ink)}
.btn.grow{flex:1 1 8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.capline{width:100%;height:76px;display:block;overflow:visible}
.capline .axis{stroke:var(--rule);stroke-width:1}
.capline .din{fill:var(--calm)}
.capline .dout{fill:none;stroke:var(--faint)}
.capline .dnow{fill:var(--signal)}
.capline .m{stroke:var(--signal);stroke-width:2}
.capline text{font-family:PlexMono,monospace;font-size:9px;fill:var(--faint);letter-spacing:.1em}

#cap-text{width:100%;min-height:4.2rem;resize:vertical;background:var(--raised);
  border:1px solid var(--rule);border-radius:4px;padding:.7rem .8rem;line-height:1.5}
#cap-text:focus{outline:none;border-color:var(--signal)}

.tabs{display:flex;gap:.15rem;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.tabs button{padding:.55rem .8rem;font-size:.85rem;color:var(--faint);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--signal)}
.tabs button:hover{color:var(--ink)}
.tabs .count{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint);margin-left:.3rem}

/* Bestandszeile für Eingang und Regelwerk. Dort steht Fließtext, und
   Fließtext braucht kein Raster. Die Aufgabenliste hat deshalb ihre eigene
   Form (`.rows` weiter unten): Dort fluchten Spalten. */
.item{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:.85rem;align-items:start;
  padding:.8rem 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--rule);min-height:2.1rem}
.item .title{font-size:.94rem;overflow-wrap:anywhere}
.meta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.2rem}
.meta span{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint)}
.acts{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.acts .btn{padding:.32rem .58rem;font-size:.77rem}

/* ── Gruppen ───────────────────────────────────────────────────────────
   Ein Band, kein Strich. Der Bestand zerfällt in wenige Gruppen, und welche
   das ist, soll man im Vorbeigehen sehen statt lesen müssen — dafür ist die
   Fläche eines Bandes da und die eines Hairlines nicht.

   Farbe trägt genau zwei Messungen und sonst nichts: das Band die Gruppe,
   die Fristpille den Abstand zum Zeitpunkt. Keine Ampel. Grün gut und rot
   schlecht wäre ein Urteil über eine Aufgabe, und ein Urteil, das man beim
   Draufsehen mitliest, erzeugt Vermeidung statt Handlung (R7). „Nicht in
   Reichweite" bekommt deshalb die leiseste Farbe der Palette, nicht die
   lauteste — die Aufgabe ist nicht schlecht, sie ist heute zu schwer. */
.groups{display:grid;gap:1rem;overflow-x:auto}
.group{min-width:0;border-radius:0 5px 5px 0;
  border-left:3px solid color-mix(in srgb,var(--group,var(--rule)) 70%,var(--rule));
  background:color-mix(in srgb,var(--group,var(--rule)) 5%,transparent)}
.gband{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;
  padding:.55rem .75rem;border-radius:0 5px 0 0;
  background:color-mix(in srgb,var(--group,var(--rule)) 20%,var(--panel))}
.gband:hover{background:color-mix(in srgb,var(--group,var(--rule)) 30%,var(--panel))}
.gband .gname{font-size:.85rem;font-weight:500;overflow-wrap:anywhere}
.gband .gcount{margin-left:auto;flex:none;font-size:.7rem;color:var(--ink);border-radius:999px;
  padding:.05rem .5rem;background:color-mix(in srgb,var(--group,var(--rule)) 38%,var(--panel))}
/* Dreieck aus Rändern statt Schriftzeichen: Es dreht sich, wächst in rem
   mit der Textgröße mit und setzt keine Schrift voraus, die es enthält. */
.caret{flex:none;width:0;height:0;border:.3rem solid transparent;
  border-left-color:currentColor;transition:transform .12s}
.gband[aria-expanded=true] .caret{transform:rotate(90deg)}
.gadd{display:block;width:100%;text-align:left;padding:.5rem .75rem;font-size:.8rem;
  color:color-mix(in srgb,var(--group,var(--ink)) 70%,var(--ink))}
.gadd:hover{background:color-mix(in srgb,var(--group,var(--rule)) 14%,transparent)}
.empty{color:var(--faint);font-size:.78rem;padding:.5rem .75rem;grid-column:1/-1}

/* ── Aufgabenliste ─────────────────────────────────────────────────────
   Alle Zeilen einer Gruppe teilen sich ein Raster, damit die Werte
   senkrecht fluchten: Man scannt dann eine Spalte, statt jede Zeile einzeln
   zu lesen. Keine festen Spaltenbreiten — feste Breiten sind das, was bei
   2,4-facher Schrift überläuft. Reicht der Platz nicht, scrollt die Gruppe
   waagerecht in ihrem eigenen Kasten, so wie eine breite Tabelle in der
   Hilfe. */
.rows{display:grid;grid-template-columns:minmax(7rem,1fr) auto auto;padding:0 .75rem}
.trow{display:grid;grid-column:1/-1;grid-template-columns:subgrid;gap:.85rem;
  align-items:start;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.trow:hover{background:color-mix(in srgb,var(--raised) 70%,transparent)}
.trow .title{font-size:.94rem;overflow-wrap:anywhere}
.trow.run .title{color:var(--calm)}
.trow.done .title{color:var(--faint);text-decoration:line-through}
/* Der Titel führt in die Detailansicht — der Ort, an dem eine Aufgabe
   vollständig existiert. Deshalb ist er ein Knopf und sieht auch so aus. */
.tlink{display:block;width:100%;text-align:left;padding:0;overflow-wrap:anywhere}
.tlink:hover{color:var(--signal)}
.kin{display:block;font-family:PlexMono,monospace;font-size:.66rem;color:var(--faint);
  overflow-wrap:anywhere;margin-top:.15rem}
.cells{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;min-width:0}
.cell{font-family:PlexMono,monospace;font-size:.66rem;color:var(--faint);white-space:nowrap}
.pill{font-family:PlexMono,monospace;font-size:.66rem;letter-spacing:.04em;white-space:nowrap;
  padding:.22rem .5rem;border-radius:999px;color:var(--dim);
  background:color-mix(in srgb,var(--rule) 55%,transparent)}
.pill.ae{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
/* Dieselbe Rampe wie früher am Strich, jetzt in der Pille: der Abstand zu
   decayAt, sonst nichts. Ohne Frist und jenseits von drei Tagen bleibt sie
   neutral, und an etwas Erledigtem steht sie gar nicht — „überfällig" an
   etwas, das getan ist, wäre ein Vorwurf für nichts. */
.pill.due[data-due=days]{background:color-mix(in srgb,var(--signal) 14%,transparent)}
.pill.due[data-due=day]{background:color-mix(in srgb,var(--signal) 26%,transparent);color:var(--signal)}
.pill.due[data-due=over]{background:color-mix(in srgb,var(--caution) 24%,transparent);color:var(--caution)}
@media(max-width:760px){.rows{grid-template-columns:minmax(0,1fr)}.trow{gap:.4rem}}

/* ── Klammern als Leiste über dem Bestand ──────────────────────────────
   Eine zerlegte Aufgabe ist keine Spalte. „In Reichweite" misst die
   Kapazität von heute; „zerlegt" ist eine bauliche Tatsache. Zwei Achsen in
   einer Reihe zu stapeln hieße, dieselbe Aufgabe zweimal zu zeigen oder
   einmal falsch einzuordnen. Die Klammern stehen deshalb über dem Bestand
   und filtern ihn, statt in ihm zu stehen.

   Die Wahl hängt bewusst nicht am Browser-Speicher: Ein Filter, der nach
   dem Schließen des Fensters noch greift, versteckt Aufgaben, ohne dass zu
   sehen ist, warum. */
.brackets{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:0 0 .9rem}
.crumb{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;width:100%}
.crumb .sep{color:var(--faint);font-size:.8rem}
.brk{display:inline-flex;align-items:center;gap:.4rem;max-width:100%;text-align:left;
  padding:.34rem .62rem;border-radius:999px;font-size:.8rem;overflow-wrap:anywhere;
  border:1px solid var(--rule);background:var(--raised);color:var(--dim)}
.brk:hover{color:var(--ink);border-color:var(--dim)}
.brk[aria-pressed=true]{border-color:var(--signal);color:var(--signal);
  background:color-mix(in srgb,var(--signal) 12%,var(--raised))}
.brk .num{font-family:PlexMono,monospace;font-size:.7rem;color:var(--faint)}
.brk[aria-pressed=true] .num{color:var(--signal)}
/* Die gewählte Klammer selbst — mit ihren eigenen Handlungen. An sie kam
   man vorher nicht heran: Sie stand als Karte zwischen ihren Schritten
   oder gar nicht. */
.bhead{border:1px solid var(--rule);border-left:3px solid var(--signal);border-radius:5px;
  background:var(--raised);padding:.75rem .9rem;margin:0 0 1rem;display:grid;gap:.5rem}
.bhead .title{font-size:1rem;font-weight:500}
.bhead .acts{justify-content:flex-start}

/* ── Board ─────────────────────────────────────────────────────────────
   Dieselben Gruppen, nebeneinander statt untereinander. Die Liste
   beantwortet „was zuerst", das Board „wie viel wovon" — die Bestandsfrage,
   für die man sonst scrollt.

   Kein Ziehen zwischen den Spalten: Eine Spalte ist hier eine Messung und
   kein Ablagefach. Etwas hineinzuziehen hieße, die Kapazität von heute von
   Hand zu übergehen — also genau die Zahl, wegen der das Board überhaupt
   sortiert.

   Schmal untereinander, breit nebeneinander und waagerecht scrollbar. Die
   Spaltenbreite steht in rem und wächst mit der Schrift mit: Bei 2,4-facher
   Größe wird die Spalte breiter, statt den Text abzuschneiden. */
.board{display:flex;flex-direction:column;gap:.9rem}
@media(min-width:720px){
  .board{flex-direction:row;align-items:flex-start;overflow-x:auto;
    padding-bottom:.7rem;scroll-snap-type:x proximity}
  .board .group{flex:0 0 17rem;scroll-snap-align:start}
  .board .group.shut{flex:0 0 auto}
}
.board.flat{display:block}
.cards{display:flex;flex-direction:column;gap:.5rem;padding:.5rem}

/* Dieselbe Rampe wie in der Liste, nur an der Kante statt in der Pille. */
.card{background:var(--raised);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:5px;padding:.55rem .65rem}
.card[data-due=over]{border-left-color:var(--caution)}
.card[data-due=day]{border-left-color:var(--signal)}
.card[data-due=days]{border-left-color:color-mix(in srgb,var(--signal) 45%,var(--rule))}
.card .title{font-size:.86rem;line-height:1.35}
.card.run .title{color:var(--calm)}
.card.done .title{color:var(--faint);text-decoration:line-through}
.card .cells{margin-top:.35rem}
.card .acts{justify-content:flex-start;margin-top:.45rem}
.card .acts .btn{padding:.26rem .5rem;font-size:.72rem}

/* ── Filterzeile und Umschalter ───────────────────────────────────────
   Drei Filter, kein Baukasten. Jeder weitere wäre eine Entscheidung mehr
   vor der Arbeit statt in ihr (G1, D3). */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.filters input[type=search]{flex:1 1 12rem;min-width:7rem;width:auto}
.tog{font-family:PlexMono,monospace;font-size:.66rem;letter-spacing:.09em;padding:.42rem .6rem;
  border:1px solid var(--rule);border-radius:3px;color:var(--faint);white-space:nowrap}
.tog[aria-pressed=true]{border-color:var(--signal);color:var(--signal)}
.tog:hover{color:var(--ink)}

/* ── Regeleditor ───────────────────────────────────────────────────── */
.ed{display:grid;gap:1.35rem}
.step{display:grid;gap:.5rem}
.pick{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.pick .btn{padding:.32rem .6rem;font-size:.78rem}
.cond{border:1px solid var(--rule);border-radius:5px;padding:.6rem .7rem;
  background:var(--raised);margin-bottom:.5rem}
.cond.grp{background:transparent;border-style:dashed}
.cond .top{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.cond .fields{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.cond .now{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint);margin-top:.45rem}
.slim{width:auto;max-width:100%;min-width:5rem}
.hint{color:var(--faint);font-size:.78rem}

.dial{margin:0 0 1.05rem}
.dial .head{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.dial .val{font-family:PlexMono,monospace;color:var(--signal);font-weight:500}
.dial .ends{display:flex;justify-content:space-between;margin-top:.15rem}
.dial .ends span{font-family:PlexMono,monospace;font-size:.66rem;color:var(--faint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:.5rem 0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}

  border-radius:50%;background:var(--signal);border:2px solid var(--panel)}

input[type=text],input[type=number],input[type=password],input[type=datetime-local],

/* ── Hilfe ─────────────────────────────────────────────────────────────
   Kapitelliste und Kapitel nebeneinander — das ist der eine Vorteil dieser
   Fläche gegenüber dem Telefon, wo man für jeden Sprung zurück muss.

   Umbruch über flex-wrap statt über eine Breitenabfrage: Bei 2,4-facher
   Schrift sind 13rem keine 208 Pixel mehr, sondern 500. Eine Abfrage in
   Pixeln ließe dann zwei Spalten stehen, die nicht mehr hineinpassen; der
   Umbruch rechnet mit dem, was der Inhalt tatsächlich braucht. */
.help{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:flex-start}
.help .toc{flex:0 1 13rem;min-width:0;display:grid;gap:.3rem;align-content:start}
.help .chapter{flex:1 1 22rem;min-width:0}
.toc .seg{margin-bottom:.2rem}
.toc button.ch{display:block;width:100%;text-align:left;font-size:.86rem;color:var(--dim);
  padding:.35rem .5rem;border-left:2px solid transparent;border-radius:3px;overflow-wrap:anywhere}
.toc button.ch:hover{color:var(--ink)}
.toc button.ch[aria-current=true]{color:var(--ink);background:var(--raised);border-left-color:var(--signal)}
.toc .num{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint);margin-right:.45rem}
.toc .hit{display:block;font-size:.72rem;color:var(--faint);margin-top:.15rem;overflow-wrap:anywhere}

/* Lesebreite in rem: Sie wächst mit der Schrift mit, statt bei großer
   Schrift zwei Wörter je Zeile stehen zu lassen. */
/* Ein Pfad oder ein Bezeichner ohne Leerzeichen ist länger als jede
   Spalte. Ohne diese Zeile schöbe er die Seite auf, statt umzubrechen. */
.md{max-width:46rem;overflow-wrap:break-word}
.md h1{margin:.1rem 0 .8rem}
.md h2{margin:1.7rem 0 .5rem}
.md h3{font-size:.95rem;font-weight:500;color:var(--dim);margin:1.2rem 0 .4rem}
.md p{margin:0 0 .8rem;font-size:.92rem}
.md ul,.md ol{margin:0 0 .9rem;padding-left:1.3rem;color:var(--dim);font-size:.92rem}
.md li{margin-bottom:.3rem}
.md blockquote{border-left:2px solid var(--signal);padding-left:.85rem;margin:0 0 .9rem;
  color:var(--ink);font-size:.92rem}
.md code{font-family:PlexMono,monospace;font-size:.85em;background:var(--raised);
  border:1px solid var(--rule);border-radius:3px;padding:.05rem .3rem;overflow-wrap:anywhere}
/* Eine breite Tabelle scrollt in ihrem eigenen Kasten. Ohne das schöbe sie
   die ganze Seite auseinander — derselbe Grund wie bei .stack. */
.md .scroll{overflow-x:auto;margin:0 0 .9rem}
.md table{border-collapse:collapse;font-size:.86rem}
.md th,.md td{border:1px solid var(--rule);padding:.35rem .6rem;text-align:left;vertical-align:top}
.md th{background:var(--raised);color:var(--ink);font-weight:500}
.md td{color:var(--dim)}
.md figure{margin:0 0 1.1rem;max-width:30rem;background:var(--raised);
  border:1px solid var(--rule);border-radius:5px;padding:.5rem}
.md figure img{display:block;width:100%;height:auto;border-radius:3px}
.md figcaption{color:var(--faint);font-size:.76rem;margin-top:.45rem}
.md img{max-width:100%;height:auto}
.md .lnk{color:var(--signal);font-size:inherit;padding:0;
  text-decoration:underline;text-underline-offset:2px}
.md .lnk:hover{color:var(--deep)}

dialog{border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);
  padding:1.4rem;width:min(34rem,calc(100vw - 2rem));max-height:86vh;overflow:auto}
/* Die Detailansicht trägt mehr als ein Regler-Blatt: Baum, Blocker,
   Ereignisstrom. Sie bekommt deshalb Breite, aber keine eigene Fläche —
   eine zweite Seite wäre ein zweiter Ort mit eigenem Zustand. */

dialog::backdrop{background:color-mix(in srgb,var(--base) 72%,transparent);backdrop-filter:blur(3px)}
dialog h2{margin-bottom:.9rem}

/* Der Kreis wird gezeigt, nicht bloß abgelehnt: „Geht nicht" ohne Grund
   ist in diesem System der teuerste Fehlermodus. */
.cycle{margin-top:.6rem;border:1px solid color-mix(in srgb,var(--caution) 55%,var(--rule));
  border-radius:5px;padding:.6rem .7rem}
.cycle .path{font-family:PlexMono,monospace;font-size:.78rem;color:var(--caution);

kbd{font-family:PlexMono,monospace;font-size:.7rem;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:.05rem .32rem;color:var(--dim)}

#toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1rem);

  color:var(--signal);text-align:center;padding:1rem 0}

    <div class="chips" id="hchips"></div>

  <main>
    <div class="rail">
      <section class="panel accent" id="act" aria-live="polite"></section>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{
  const n=document.createElement(t);
  for(const [k,v] of Object.entries(a)){
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') n.className=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);
  }
  // Tief flach klopfen: Ein Baustein, der eine Liste zurückgibt, soll sich
  // wie ein einzelnes Kind einsetzen lassen — sonst steht irgendwann
  // "[object Object]" in der Oberfläche.
  for(const k of kids.flat(Infinity)) if(k!==null&&k!==undefined&&k!==false)
    n.append(k.nodeType?k:document.createTextNode(String(k)));
  return n;
};
const fmt=n=>(n===null||n===undefined)?'–':String(n);

/* `replaceChildren` filtert null NICHT — es macht daraus einen Textknoten
   mit dem Wort "null". Zwei weggelassene Chips standen deshalb als
   "nullnull" in der Kopfzeile. Der el()-Helfer filtert; diese Funktion
   zieht dieselbe Regel fuer alles nach, was direkt ersetzt wird. */
const put=(node,...kids)=>node.replaceChildren(
  ...kids.flat(Infinity).filter(k=>k!==null&&k!==undefined&&k!==false));
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),3200)}

async function api(path,opts={}){
  const res=await fetch(path,{credentials:'same-origin',
    headers:opts.body?{'Content-Type':'application/json'}:{},...opts});
  if(res.status===401){showGate();throw new Error('401')}
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    // Die Einzelmeldungen mitschleppen: Bei einer abgelehnten Regel steht in
    // `issues`, WAS nicht stimmt — „Regel ungültig" allein hilft niemandem.
    const err=new Error(data.error||('HTTP '+res.status));
    err.data=data;
    throw err;
  }
  return data;
}

/* ── Darstellung ─────────────────────────────────────────────────────
   Im Browser gespeichert, nicht auf dem Gerät: Es ist eine Eigenschaft
   dieses Bildschirms, nicht des Nutzers. Der Monitor im Büro verlangt
   etwas anderes als das Telefon in der Hand. */
const prefs={mode:localStorage.getItem('axiom.mode')||'auto',
  scheme:localStorage.getItem('axiom.scheme')||'instrument',
  size:localStorage.getItem('axiom.size')||'m'};
const darkQ=matchMedia('(prefers-color-scheme: dark)');
function applyPrefs(){
  const r=document.documentElement;
  r.dataset.scheme=prefs.scheme;
  r.dataset.mode=prefs.mode==='auto'?(darkQ.matches?'dark':'light'):prefs.mode;
  r.dataset.size=prefs.size;
  // Nur die Schalter in der Kopfzeile: `[data-mode]` träfe sonst auch das
  // Wurzelelement, das dieselben Namen als Zustand trägt.
  document.querySelectorAll('header .seg button').forEach(b=>{
    for(const key of ['mode','scheme','size'])
      if(b.dataset[key]!==undefined)
        b.setAttribute('aria-pressed',b.dataset[key]===prefs[key]?'true':'false');
  });
}
darkQ.addEventListener('change',()=>{if(prefs.mode==='auto')applyPrefs()});
document.querySelectorAll('header .seg button').forEach(b=>b.addEventListener('click',()=>{
  for(const key of ['mode','scheme','size'])
    if(b.dataset[key]){prefs[key]=b.dataset[key];localStorage.setItem('axiom.'+key,b.dataset[key])}
  applyPrefs();
}));
applyPrefs();

/* ── Freigabe per Zahlenabgleich ──────────────────────────────────────
   Statt eine PIN abzutippen: Der Browser fragt eine Freigabe an und
   bekommt eine Zahl. Dieselbe Zahl erscheint auf dem Telefon, zusammen
   mit einem Knopf.

   Der Schutz liegt im Abgleich, nicht in der Zahl. Fragt jemand anders im
   selben Moment eine Freigabe an, zeigt das Telefon dessen Zahl — und die
   steht dann nicht auf diesem Bildschirm. Wer nur bestätigt, was
   übereinstimmt, gibt niemand anderen herein. Eine Freigabe ohne
   Vergleich wäre bloß ein Knopf, den man wegdrückt. */
let pushPoll=null;
async function startPush(){
  clearInterval(pushPoll);
  $('#match').textContent='··';
  $('#push-msg').textContent='Frage an …';
  try{
    const c=await fetch('/api/auth/request',{method:'POST',credentials:'same-origin'})
      .then(r=>r.json());
    if(c.error){$('#push-msg').textContent=c.error;return}
    $('#match').textContent=c.number;
    $('#push-msg').textContent='Auf dem Telefon freigeben, wenn die Zahl stimmt.';
    let waited=0;
    pushPoll=setInterval(async()=>{
      waited+=2;
      const r=await fetch('/api/auth/poll?id='+encodeURIComponent(c.id),{credentials:'same-origin'});
      if(r.status===200){clearInterval(pushPoll);await enter();return}
      if(r.status!==202||waited>120){
        clearInterval(pushPoll);
        $('#push-msg').textContent=r.status===403
          ? 'Abgelehnt. Wenn du das nicht warst, hat jemand anders angefragt.'
          : 'Abgelaufen. Erneut versuchen.';
        $('#match').textContent='··';
      }
    },2000);
  }catch(e){$('#push-msg').textContent='Der Server antwortet nicht.'}
}
function showGate(){
  clearInterval(pushPoll);
  // Ohne Sitzung gibt es auch keinen Kanal — sonst liefe im Hintergrund ein
  // Verbindungsversuch, den der Server ohnehin abweist.
  wsStop();
  // Ein offenes Blatt liegt über allem, auch über der Anmeldung. Es
  // stehenzulassen hieße, die Freigabe hinter einem Dialog zu verstecken.
  if($('#dlg').open) $('#dlg').close();
  $('#gate').classList.remove('hide');$('#app').classList.add('hide');
  $('#pin').value='';
  startPush();
}
$('#use-pin').addEventListener('click',()=>{
  clearInterval(pushPoll);
  $('#gate-push').classList.add('hide');$('#gate-pin').classList.remove('hide');$('#pin').focus();
});
$('#use-push').addEventListener('click',()=>{
  $('#gate-pin').classList.add('hide');$('#gate-push').classList.remove('hide');startPush();
});
async function login(){
  const pin=$('#pin').value.trim();
  if(pin.length<4){$('#gate-msg').textContent='Sechs Ziffern.';return}
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({pin})});
    await enter();
  }catch(e){
    $('#gate-msg').textContent='Stimmt nicht. Nach fünf Versuchen schaltet sich der Server ab.';
    $('#pin').value='';$('#pin').focus();
  }
}
$('#gate-go').addEventListener('click',login);
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function enter(){
  clearInterval(pushPoll);
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  markTabs();
  await reload();
  wsStart();
}

/* ── Zustand ───────────────────────────────────────────────────────
   Die Reihenfolge ist zugleich die der Zifferntasten 1 … 7 — eine Liste,
   nicht zwei, sonst zeigt die Taste irgendwann woandershin als der Reiter.
   Welcher Reiter offen war, hängt am Browser: Wer die Seite acht Stunden
   offen hat, lädt sie irgendwann neu und will dort weitermachen, wo er war,
   nicht wieder bei den Aufgaben anfangen. */
const TABS=['tasks','board','inbox','state','rules','review','events','help'];
let S=null,tasks=[],rules=[],events=[],inbox={notes:[],tasks:[]},review=null;
/* Voreingestellt das Board: Es beantwortet „wie viel wovon", und das ist
   die Frage, mit der man an einen Bildschirm mit Platz geht. Die Liste
   beantwortet „was zuerst" — dafür steht links schon die eine Handlung.
   Eine getroffene Wahl gewinnt weiterhin; nur die Voreinstellung dreht. */
let tab=TABS.includes(localStorage.getItem('axiom.tab'))
  ?localStorage.getItem('axiom.tab'):'board';
let ruleIssues=[];

async function refresh(){S=await api('/api/state');paintHeader();paintAction();paintCapline()}
async function loadSurface(){
  // Board und Liste zeigen denselben Bestand und holen ihn deshalb gleich.
  if(tab==='tasks'||tab==='board') tasks=(await api('/api/tasks')).tasks;
  else if(tab==='rules'){
    const data=await api('/api/rules');
    rules=data.rules;
    // Abgelehnte Einträge sichtbar machen: Eine stumm übersprungene Regel
    // ist schlimmer als eine, die laut fehlschlägt.
    ruleIssues=data.issues||[];
  }
  else if(tab==='events') events=(await api('/api/events?limit=250')).events;

  else if(tab==='review') review=await api('/api/review?scope='+(review?.scope||'day'));
  else if(tab==='help') await loadHelp();
}

/* ── Die eine Handlung ───────────────────────────────────────────────
   Dieselbe Rangfolge wie auf dem Telefon: Eine feuernde Regel schlägt
   alles, dann das Laufende, dann der Vorschlag, dann das Zerlegen. */
function paintAction(){
  const box=$('#act');box.className='panel accent';
  const kids=[];
  const running=(S.running||[])[0],d=S.decision,next=(S.startable||[])[0],split=(S.atomize||[])[0];

  if(d){
    kids.push(el('div',{class:'eyebrow'},'JETZT'),el('h1',{},d.title),
      el('div',{class:'row',style:'margin:.6rem 0 0'},
        el('span',{class:'stamp'},d.ruleId),
        d.deficit?el('span',{class:'stamp'},d.deficit):null));
    if(d.rationale) kids.push(el('p',{class:'why'},d.rationale));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>respond(d.id,'accepted')},'Verstanden'),
      el('button',{class:'btn',onclick:()=>respond(d.id,'deferred')},'Später'),
      el('button',{class:'btn quiet',onclick:()=>respond(d.id,'rejected')},'Passt nicht')));
    if(running) kids.push(el('p',{class:'faint',style:'margin-top:.9rem'},'Läuft daneben: '+running.title));
  }else if(running){
    box.className='panel calm';
    kids.push(el('div',{class:'eyebrow'},'LÄUFT'),el('h1',{},running.title));
    if(S.focus) kids.push(el('p',{class:'mono',style:'color:var(--calm);margin-top:.4rem'},
      S.focus.elapsedMinutes+' von '+S.focus.plannedMinutes+' min'));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>act(running.id,'complete')},'Erledigt'),
      el('button',{class:'btn',onclick:()=>act(running.id,'release')},'Zurücklegen')));
  }else if(next){
    kids.push(el('div',{class:'eyebrow'},'JETZT'),el('h1',{},next.title),
      el('div',{class:'row',style:'margin:.6rem 0 0'},
        el('span',{class:'stamp'},'START '+next.activationEnergy+'/10'),
        next.decayAt?el('span',{class:'stamp'},dueLabel(next.decayAt)):null));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>act(next.id,'start')},'Anfangen'),
      el('button',{class:'btn',onclick:()=>act(next.id,'complete')},'Erledigt')));
  }else if(split){
    kids.push(el('div',{class:'eyebrow'},'ZERLEGEN'),el('h1',{},split.title),
      el('p',{class:'why'},split.reason),
      el('div',{class:'row'},
        el('button',{class:'btn primary',onclick:()=>atomizeDialog(split)},'In Schritte zerlegen')));
  }else{
    box.className='panel';
    kids.push(el('div',{class:'eyebrow'},'NICHTS ANLIEGEND'),el('h1',{},'Ruhig gerade.'),
      el('p',{style:'margin-top:.6rem'},'Kein Vorschlag heißt: gerade ist nichts nötig. Was dir einfällt, kannst du links erfassen.'));
  }
  if(S.nextStep) kids.push(el('p',{class:'faint',style:'margin-top:1rem'},
    S.nextStep.label+' · '+new Date(S.nextStep.at).toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'})+' — '+S.nextStep.anchor));
  put(box,kids);
}

function dueLabel(iso){
  const diff=new Date(iso)-new Date();
  if(diff<0) return 'ÜBERFÄLLIG';
  const h=Math.round(diff/36e5);
  return h<24?('IN '+h+' H'):('IN '+Math.round(h/24)+' T');
}
async function respond(id,response){
  try{await api('/api/decisions/'+id,{method:'POST',body:JSON.stringify({response})})}catch(e){}
  await reload();
}
async function act(id,verb){
  try{await api('/api/tasks/'+id+'/'+verb,{method:'POST'});await reload()}catch(e){toast(e.message)}
}

/* ── Kapazitätslinie ─────────────────────────────────────────────────
   Dasselbe Instrument wie auf dem Telefon: eine Achse von leicht nach
   schwer, jede offene Aufgabe ein Punkt, die Kapazität als Marke. Was
   links davon liegt, ist heute erreichbar. Eine Messung, kein Urteil. */
function paintCapline(){
  const cap=S.values?.capacity?.value??50, W=320, pad=10;
  const x=ae=>pad+((ae-1)/9)*(W-2*pad);
  const mark=x(cap/10);
  const open=[...(S.startable||[]),...(S.running||[])];
  const parts=['<line class="axis" x1="'+pad+'" y1="48" x2="'+(W-pad)+'" y2="48"/>',
    '<line class="m" x1="'+mark+'" y1="32" x2="'+mark+'" y2="54"/>',
    '<text x="'+pad+'" y="66">LEICHT</text>',
    '<text x="'+mark+'" y="66" text-anchor="middle" style="fill:var(--signal)">HIER</text>',
    '<text x="'+(W-pad)+'" y="66" text-anchor="end">SCHWER</text>'];
  const seen={};
  for(const t of open){
    const cx=x(t.activationEnergy), k=Math.round(cx);
    const dy=(seen[k]=(seen[k]||0)+1)-1;
    const cls=t.state==='active'?'dnow':(cx<=mark?'din':'dout');
    parts.push('<circle class="'+cls+'" cx="'+cx+'" cy="'+(36-dy*9)+'" r="4"><title>'+
      String(t.title).replace(/[<&>]/g,'')+' — Start '+t.activationEnergy+'/10</title></circle>');
  }
  $('#capline').innerHTML=parts.join('');
  $('#cap-label').textContent='KAPAZITÄT '+cap;
  const n=(S.startable||[]).length;
  $('#cap-note').textContent=n
    ? n+' startbar. Was rechts der Marke liegt, braucht heute mehr Anlauf, als da ist.'
    : 'Heute liegt nichts unter der Linie. Zerlegen hilft mehr als Anlauf nehmen.';
}

/* ── Aufgaben ────────────────────────────────────────────────────────
   Ein Baum, keine Liste. `parentId` legt der Atomizer beim Zerlegen an —
   damit ist die Kette Eltern → Kind schon da. Das IST die Projektfunktion:
   Ein eigener Projekt-Typ wäre eine zweite Ordnungsachse und damit
   Meta-Work-Treibstoff (D3).

   Sichtbar wird der Baum an drei Stellen, und an jeder für etwas anderes:
   in der Klammerleiste über dem Bestand (worauf filtere ich), in der
   Herkunftszeile an der Aufgabe (wozu gehört das hier) und vollständig in
   der Detailansicht (Kette nach oben, Schritte darunter). Die Einrückung in
   der Liste war ein vierter Anlauf auf dieselbe Sache und hat dabei die
   Rangfolge verbogen: Eine Klammer musste dorthin rücken, wo ihr bester
   Schritt stand, damit der Schritt nicht mit ihr ans Ende rutschte.

   Die Reihenfolge ist die der Auswahl und nicht verstellbar. Drei Filter,
   sonst keine — jeder weitere ist eine Entscheidung vor der Arbeit statt
   in ihr (G1). Sie hängen am Browser, nicht am Gerät: Es ist eine
   Eigenschaft dieses Bildschirms, nicht des Nutzers. */
const tprefs={
  q:localStorage.getItem('axiom.tasks.q')||'',
  reach:localStorage.getItem('axiom.tasks.reach')==='1',
  overdue:localStorage.getItem('axiom.tasks.overdue')==='1',
  done:localStorage.getItem('axiom.tasks.done')==='1'};
function setTPref(key,value){
  tprefs[key]=value;
  localStorage.setItem('axiom.tasks.'+key,
    value===true?'1':value===false?'0':String(value));
}

/* Die gewählte Klammer steht bewusst NICHT im Browser-Speicher, anders als
   die drei Filter darüber. Ein Ausschnitt, der das Schließen des Fensters
   überlebt, versteckt beim nächsten Öffnen Aufgaben, ohne dass zu sehen
   wäre, warum — und dann sucht man den Fehler im Bestand statt in der
   Leiste. Für eingeklappte Gruppen gilt derselbe Satz. */
let bracket=null;
const shut={};
function chooseBracket(id){bracket=id||null;redrawTasks()}

function viewTasks(){
  const frag=document.createDocumentFragment();
  const bar=el('div',{id:'brackets'}),head=el('div',{id:'bhead'});
  const list=el('div',{id:'tasklist',class:'groups'});
  frag.append(taskFilters(),bar,head,list);
  const m=taskModel();
  fillBrackets(bar,m);fillHead(head,m);fillTasks(list,m);
  return frag;
}

function viewBoard(){
  const frag=document.createDocumentFragment();
  const bar=el('div',{id:'brackets'}),head=el('div',{id:'bhead'});
  const box=el('div',{id:'board',class:'board'});
  frag.append(taskFilters(),bar,head,box);
  const m=taskModel();
  fillBrackets(bar,m);fillHead(head,m);fillBoard(box,m);
  return frag;
}

/* Nur Leiste, Kopfzeile und Bestand neu zeichnen, nicht die Filterzeile
   darüber: Sonst verliert das Suchfeld beim zweiten Buchstaben den Fokus. */
function redrawTasks(){
  const m=taskModel();
  const bar=$('#brackets');if(bar) fillBrackets(bar,m);
  const head=$('#bhead');if(head) fillHead(head,m);
  const list=$('#tasklist');
  if(list){fillTasks(list,m);return}
  const board=$('#board');
  if(board) fillBoard(board,m);
}

function taskFilters(){
  const tog=(key,label,title)=>el('button',{class:'tog',title,
    'aria-pressed':tprefs[key]?'true':'false',
    onclick:e=>{
      setTPref(key,!tprefs[key]);
      e.currentTarget.setAttribute('aria-pressed',tprefs[key]?'true':'false');
      redrawTasks();
    }},label);
  return el('div',{class:'filters'},
    el('button',{class:'btn primary',onclick:()=>taskDialog()},'Neue Aufgabe'),
    el('input',{type:'search',value:tprefs.q,placeholder:'Suchen','aria-label':'Aufgaben durchsuchen',
      oninput:e=>{setTPref('q',e.target.value);redrawTasks()}}),
    tog('reach','IN REICHWEITE','Nur was unter der Kapazität von heute liegt'),
    tog('overdue','ÜBERFÄLLIG','Nur was seinen Zeitpunkt überschritten hat'),
    tog('done','ERLEDIGTE','Erledigtes mit anzeigen'));
}

/* Ein Modell, zwei Ansichten. Liste und Board fragen dieselben Zahlen und
   denselben Filter ab — zweimal gefiltert wäre zweimal die Gelegenheit,
   unterschiedlich zu filtern, und dann zeigte dieselbe Auswahl auf zwei
   Reitern zwei verschiedene Bestände. */
function taskModel(){
  const cap=S.values?.capacity?.value??50;
  const inReach=t=>t.activationEnergy<=cap/10;
  const overdue=t=>!!t.decayAt&&new Date(t.decayAt).getTime()<Date.now();

  const byId=new Map(tasks.map(t=>[t.id,t]));
  const kids=new Map();
  for(const t of tasks){
    // Ein Elternteil, das nicht im Bestand steht, ist keins: Sonst hinge ein
    // Schritt an einer Klammer, die niemand sehen kann.
    const parent=t.parentId&&t.parentId!==t.id&&byId.has(t.parentId)?t.parentId:null;
    if(!parent) continue;
    if(!kids.has(parent)) kids.set(parent,[]);
    kids.get(parent).push(t);
  }
  // Eine Klammer, die es nicht mehr gibt, filterte sonst alles weg — und
  // zwar stumm, weil auch ihre Leiste verschwunden wäre.
  if(bracket&&!byId.has(bracket)) bracket=null;

  const q=tprefs.q.trim().toLowerCase();
  const parentOf=t=>
    t.parentId&&t.parentId!==t.id?(byId.get(t.parentId)||null):null;
  const open=t=>t.state!=='done'&&t.state!=='dropped';
  const openKids=t=>(kids.get(t.id)||[]).filter(open);
  // Eine Klammer ist eine Aufgabe mit offenen Schritten. Ist der letzte
  // abgearbeitet, ist sie keine mehr und steht wieder als Zeile im Bestand
  // — dort, wo sie erledigt werden kann.
  const isBracket=t=>open(t)&&openKids(t).length>0;
  /* „Wartet" kommt vom Server (`waiting`, `blockedByCount`). Solange er die
     Felder nicht liefert, bleibt der Zustand `blocked` die einzige Quelle —
     geraten wird nichts. */
  const waiting=t=>t.waiting===true||(t.blockedByCount||0)>0||t.state==='blocked';
  // Gedeckelt, weil eine im Kreis zeigende Kette sonst hier hängenbliebe.
  const chainOf=t=>{
    const out=[];let p=parentOf(t),guard=0;
    while(p&&guard++<24){out.unshift(p);p=parentOf(p)}
    return out;
  };
  // Der Ausschnitt reicht über alle Ebenen: Zerlegen geht beliebig tief,
  // und ein Filter, der nur eine Ebene tief greift, versteckte genau die
  // Schritte, für die man ihn gesetzt hat.
  const inScope=t=>{
    if(!bracket) return true;
    let p=parentOf(t),guard=0;
    while(p&&guard++<24){if(p.id===bracket) return true;p=parentOf(p)}
    return false;
  };

  const hits=t=>{
    if(t.state==='dropped') return false;
    if(t.state==='done'&&!tprefs.done) return false;
    if(!inScope(t)) return false;
    if(q&&!String(t.title||'').toLowerCase().includes(q)) return false;
    if(tprefs.reach&&!(inReach(t)&&t.state!=='done')) return false;
    if(tprefs.overdue&&!overdue(t)) return false;
    return true;
  };
  const rank=t=>t.state==='active'?0:t.state==='ready'?(inReach(t)?1:2)
    :t.state==='blocked'?3:4;
  // Gezählt wird auf dem Gerät: Zweimal dieselbe Zählung wäre zweimal die
  // Gelegenheit, sie unterschiedlich zu machen. Hier wird nur gezählt,
  // solange der Server die Zahlen nicht mitliefert.
  const total=t=>t.childCount===undefined?(kids.get(t.id)||[]).length:t.childCount;
  const doneKids=t=>t.doneCount===undefined
    ?(kids.get(t.id)||[]).filter(c=>c.state==='done').length:t.doneCount;
  return {cap,inReach,overdue,byId,kids,hits,rank,total,doneKids,parentOf,
    open,openKids,isBracket,waiting,chainOf,inScope};
}

/* ── Gruppen ─────────────────────────────────────────────────────────
   Eine Achse, nicht zwei. „In Reichweite" und „Nicht in Reichweite" sind
   Aussagen über die Kapazität von heute; „läuft" und „wartet" darüber, ob
   überhaupt angefangen werden kann. „Zerlegt" stand hier einmal daneben und
   war der Fehler: Das ist eine bauliche Tatsache, keine Position auf dieser
   Achse — und eine Aufgabe stand dann entweder zweimal da oder einmal
   falsch. Die zerlegten Aufgaben stehen jetzt als Klammern über dem Board.

   Jede Aufgabe steht in genau einer Gruppe, entschieden in dieser
   Reihenfolge: Was läuft, läuft. Was auf etwas anderes wartet, wartet. Über
   den Rest entscheidet die Kapazität. */
const GROUPS=[
  {key:'run',label:'Läuft',color:'var(--calm)'},
  {key:'reach',label:'In Reichweite',color:'var(--signal)'},
  {key:'far',label:'Nicht in Reichweite',color:'var(--rule)'},
  // Erscheint erst, wenn etwas wartet. Eine dauerhaft leere Spalte ist
  // Fläche ohne Aussage — und der Server liefert `waiting` gerade erst.
  {key:'wait',label:'Wartet',color:'var(--info)',onlyIfFull:true},
  // Erledigtes misst nichts mehr — deshalb die leiseste Farbe, und die
  // Gruppe erscheint nur, wenn derselbe Filter sie auch sonst zeigt.
  {key:'done',label:'Erledigt',color:'var(--faint)'}];

function groupOf(t,m){
  if(t.state==='done') return 'done';
  if(t.state==='active') return 'run';
  if(m.waiting(t)) return 'wait';
  return (t.state==='ready'&&m.inReach(t))?'reach':'far';
}

function groupedTasks(m){
  const map=new Map(GROUPS.map(g=>[g.key,[]]));
  let shown=0;
  for(const t of tasks){
    // Klammern stehen in der Leiste, nicht im Bestand: Sonst stünde die
    // zerlegte Aufgabe neben ihren eigenen Schritten zur Wahl, und genau
    // diese Doppelung löst das Zerlegen ja auf.
    if(!m.hits(t)||m.isBracket(t)) continue;
    map.get(groupOf(t,m)).push(t);
    shown++;
  }
  // Dieselbe Rangfolge wie überall: erst was läuft, dann was in Reichweite
  // ist, bei Gleichstand der leichtere Anfang. Keine zweite Ordnung.
  const order=(a,b)=>m.rank(a)-m.rank(b)||a.activationEnergy-b.activationEnergy
    ||String(a.title).localeCompare(String(b.title),'de');
  for(const list of map.values()) list.sort(order);
  return {map,shown};
}
/* Im Board bleibt eine leere Gruppe stehen: „In Reichweite: 0" ist dort die
   Antwort auf die Frage, wegen der man hinsieht. In der Liste wäre sie ein
   Band ohne Inhalt, an dem man vorbeiscrollt — eine Liste zeigt, was da
   ist. */
function visibleGroups(map,asColumns){
  return GROUPS.filter(g=>{
    const count=map.get(g.key).length;
    if(g.key==='done') return tprefs.done&&(asColumns||count>0);
    if(g.onlyIfFull) return count>0;
    return asColumns||count>0;
  });
}

function groupBlock(g,list,m,asColumn){
  const open=!shut[g.key];
  const band=el('button',{class:'gband','aria-expanded':open?'true':'false',
    onclick:()=>{shut[g.key]=open;redrawTasks()}},
    el('span',{class:'caret'}),
    el('span',{class:'gname'},g.label),
    el('span',{class:'gcount mono'},String(list.length)));
  const body=!open?null:asColumn
    ?el('div',{class:'cards'},list.length?list.map(t=>boardCard(t,m)):el('p',{class:'empty'},'—'))
    :el('div',{class:'rows'},list.length?list.map(t=>taskRow(t,m)):el('p',{class:'empty'},'—'));
  return el('div',{class:'group'+(open?'':' shut'),role:'group',
    'aria-label':g.label+': '+list.length,style:'--group:'+g.color},
    band,body,
    open?el('button',{class:'gadd',onclick:()=>taskDialog()},'+ Aufgabe'):null);
}

/* ── Klammerleiste ───────────────────────────────────────────────────
   Gezeigt wird, was offene Schritte hat. Eine abgearbeitete Klammer
   verschwindet von selbst — sonst wächst die Leiste zu und wird selbst zur
   Pflege (D3). Der Fortschritt steht daneben, weil „2/5" die Frage
   beantwortet, für die man sonst hineinklickt. */
function bracketsIn(m){
  return tasks.filter(t=>m.isBracket(t)&&m.inScope(t))
    .sort((a,b)=>String(a.title).localeCompare(String(b.title),'de'));
}
function bracketChip(t,m,pressed){
  return el('button',{class:'brk','aria-pressed':pressed?'true':'false',
    onclick:()=>chooseBracket(t.id)},
    t.title,el('span',{class:'num'},m.doneKids(t)+'/'+m.total(t)));
}
function fillBrackets(box,m){
  const list=bracketsIn(m);
  const chosen=bracket?m.byId.get(bracket):null;
  // Ohne Klammern keine Leiste: eine Zeile, die immer „Alles" sagt, sagt
  // nichts.
  if(!list.length&&!chosen){put(box);return}
  const kids=[];
  if(chosen){
    // Brotkrumen statt einer Ebene: Zerlegen geht beliebig tief, und wer
    // drei Ebenen unten steht, muss zurückfinden, ohne zurückzuraten.
    const path=[...m.chainOf(chosen),chosen];
    kids.push(el('div',{class:'crumb'},
      el('button',{class:'brk',onclick:()=>chooseBracket(null)},'Alles'),
      path.map((p,i)=>[el('span',{class:'sep'},'›'),
        bracketChip(p,m,i===path.length-1)])));
  }else{
    kids.push(el('button',{class:'brk','aria-pressed':'true',
      onclick:()=>chooseBracket(null)},'Alles'));
  }
  for(const t of list) kids.push(bracketChip(t,m,false));
  put(box,el('div',{class:'brackets'},kids));
}

/* Die gewählte Klammer bekommt eine eigene Kopfzeile mit ihren eigenen
   Handlungen. Vorher war sie der eine Punkt, an den man nicht herankam:
   Als Karte stand sie zwischen ihren Schritten, gefiltert stand sie
   nirgends. */
function fillHead(box,m){
  const t=bracket?m.byId.get(bracket):null;
  if(!t){put(box);return}
  put(box,el('div',{class:'bhead'},
    el('div',{class:'eyebrow'},'GEWÄHLTE KLAMMER'),
    el('button',{class:'title tlink',onclick:()=>taskSheet(t.id)},t.title),
    el('div',{class:'cells'},cellsOf(t,m),
      el('span',{class:'cell'},'SCHRITTE '+m.doneKids(t)+' VON '+m.total(t))),
    el('div',{class:'acts'},taskActions(t,m),
      el('button',{class:'btn quiet',onclick:()=>taskSheet(t.id)},'Details'))));
}

function fillTasks(box,m){
  m=m||taskModel();
  if(!tasks.length){put(box,emptyStock());return}
  const {map,shown}=groupedTasks(m);
  if(!shown){put(box,noMatch());return}
  put(box,visibleGroups(map,false).map(g=>groupBlock(g,map.get(g.key),m,false)));
}

function fillBoard(box,m){
  m=m||taskModel();
  const {map,shown}=groupedTasks(m);
  box.classList.toggle('flat',!tasks.length||!shown);
  if(!tasks.length){put(box,emptyStock());return}
  if(!shown){put(box,noMatch());return}
  put(box,visibleGroups(map,true).map(g=>groupBlock(g,map.get(g.key),m,true)));
}

const emptyStock=()=>el('p',{},
  'Nichts eingetragen. Was du links erfasst, landet zuerst im Eingang.');
const noMatch=()=>[
  el('p',{},bracket
    ?'In dieser Klammer ist gerade nichts offen.'
    :'Nichts passt zu dieser Auswahl.'),
  el('div',{class:'row'},el('button',{class:'btn quiet',onclick:()=>{
    setTPref('q','');setTPref('reach',false);setTPref('overdue',false);setTPref('done',false);
    bracket=null;render();
  }},'Filter zurücksetzen'))];

/* Vier Stufen, abgeleitet aus einem Abstand — nicht aus einer Meinung über
   die Aufgabe. Erledigtes bleibt neutral: Eine Frist, die nicht mehr läuft,
   misst nichts mehr. */
function dueRamp(t){
  if(!expires(t)) return null;
  const hours=(new Date(t.decayAt).getTime()-Date.now())/36e5;
  return hours<0?'over':hours<24?'day':hours<72?'days':null;
}
const expires=t=>!!t.decayAt&&t.state!=='done'&&t.state!=='dropped';

/* Die Werte einer Aufgabe, in immer derselben Reihenfolge und in immer
   derselben Form — daran hängt, dass die Spalten senkrecht fluchten. Gefüllt
   ist nur, was eine Messung trägt: Startenergie und Frist. Der Rest bleibt
   Beschriftung. */
function cellsOf(t,m){
  return [
    el('span',{class:'pill ae'},'START '+t.activationEnergy+'/10'),
    el('span',{class:'cell'},'SOG '+t.salience),
    el('span',{class:'cell'},'FOLGEN '+t.stakes),
    /* Aus demselben Grund steht an etwas Erledigtem keine Frist mehr:
       „ÜBERFÄLLIG" an etwas, das getan ist, wäre ein Vorwurf für nichts. */
    expires(t)?el('span',{class:'pill due','data-due':dueRamp(t)},dueLabel(t.decayAt)):null,
    t.place?el('span',{class:'cell'},'ORT '+String(t.place).toUpperCase()):null,
    m.waiting(t)?el('span',{class:'cell'},
      t.blockedByCount?('WARTET AUF '+t.blockedByCount):'WARTET'):null];
}

/* Welche Handlungen offenstehen, hängt am Zustand und sonst nichts —
   dieselbe Liste in Liste, Board und Detailansicht, sonst böte dieselbe
   Aufgabe je nach Ort etwas anderes an. Und dieselbe Liste wie auf dem
   Telefon (tasks_screen.dart), sonst kann man im Browser etwas nicht, was
   dort geht — der teuerste Unterschied, weil man ihn für einen Fehler hält.

   Zerlegen hängt an jeder offenen Zeile, auf jeder Ebene: auch an einem
   Teilschritt, der sich als immer noch zu groß herausstellt, und auch an
   einer Klammer, die schon Schritte hat — dann kommen welche hinzu. Die
   Hürde liegt am Anfang, und wo sie liegt, weiß nur der Nutzer [D2].

   Nur „Anfangen" fehlt der Klammer: Sie ist durch ihre Schritte vertreten,
   und sie neben ihnen zur Wahl zu stellen wäre genau die Doppelung, die das
   Zerlegen auflöst. */
function taskActions(t,m,after){
  if(t.state==='done'||t.state==='dropped') return [];
  const go=fn=>()=>{if(after) after();fn()};
  const split=el('button',{class:'btn quiet',
    onclick:go(()=>atomizeDialog({taskId:t.id,title:t.title}))},'Zerlegen');
  const complete=el('button',{class:'btn',onclick:go(()=>act(t.id,'complete'))},'Erledigt');
  if(t.state==='active') return [
    el('button',{class:'btn primary',onclick:go(()=>act(t.id,'complete'))},'Erledigt'),
    el('button',{class:'btn',onclick:go(()=>act(t.id,'release'))},'Zurücklegen'),split];
  if(t.state==='blocked'||(m&&m.isBracket(t))) return [complete,split];
  return [
    el('button',{class:'btn primary',onclick:go(()=>act(t.id,'start'))},'Anfangen'),
    complete,split];
}

function taskRow(t,m){
  const cls=['trow'];
  if(t.state==='active') cls.push('run');
  if(t.state==='done') cls.push('done');
  const parent=m.parentOf(t);
  return el('div',{class:cls.join(' ')},
    el('div',{},
      el('button',{class:'title tlink',onclick:()=>taskSheet(t.id)},t.title),
      /* Der Bezug bleibt erkennbar, ohne den Baum nachzubauen: Ohne diese
         Zeile stünde ein Schritt da, ohne dass zu sehen wäre, wozu er
         gehört. */
      parent?el('span',{class:'kin'},'Teilschritt von '+parent.title):null),
    el('div',{class:'cells'},cellsOf(t,m)),
    el('div',{class:'acts'},taskActions(t,m)));
}

function boardCard(t,m){
  const cls=['card'];
  if(t.state==='active') cls.push('run');
  if(t.state==='done') cls.push('done');
  const parent=m.parentOf(t);
  const acts=taskActions(t,m);
  return el('div',{class:cls.join(' '),'data-due':dueRamp(t)},
    parent?el('span',{class:'kin'},'Teilschritt von '+parent.title):null,
    el('button',{class:'title tlink',onclick:()=>taskSheet(t.id)},t.title),
    el('div',{class:'cells'},cellsOf(t,m)),
    acts.length?el('div',{class:'acts'},acts):null);
}

/* ── Detailansicht ───────────────────────────────────────────────────
   Der Ort, an dem eine Aufgabe vollständig existiert: alle Felder, der Baum
   in beide Richtungen, die Blocker in beide Richtungen, der Ereignisstrom
   und sämtliche Handlungen. Liste und Board zeigen Bestand; hier steht der
   Zusammenhang.

   Sie geht sofort auf, mit dem, was ohnehin geladen ist, und ergänzt sich,
   sobald der Server geantwortet hat. Kennt er die Route nicht, bleibt
   stehen, was da ist, und darüber ein Satz, was fehlt — eine Ansicht, die
   bei einem 404 gar nicht erst aufgeht, ist die schlechtere Hälfte von
   beidem. */
let detailId=null,detailFull=null,detailError=null,detailNote=null;
$('#dlg').addEventListener('close',()=>{
  detailId=null;detailFull=null;detailError=null;detailNote=null;
});

async function taskSheet(id,keepNote){
  detailId=id;detailFull=null;detailError=null;
  if(!keepNote) detailNote=null;
  paintDetail();
  try{
    const full=await api('/api/tasks/'+encodeURIComponent(id));
    if(detailId!==id) return;
    detailFull=full;
  }catch(e){
    if(detailId!==id) return;
    detailError=e.message;
  }
  paintDetail();
}

function paintDetail(){
  const id=detailId;
  if(!id) return;
  const m=taskModel();
  const local=m.byId.get(id);
  if(!local&&!detailFull){
    sheet('Aufgabe',el('p',{},'Diese Aufgabe steht nicht mehr im Bestand.'),
      [],'Schließen',{wide:true,focus:false});
    return;
  }
  const t=Object.assign({},local||{},detailFull||{});
  const close=()=>$('#dlg').close();
  const body=el('div',{class:'sheet'},
    el('div',{class:'cells'},cellsOf(t,m),
      el('span',{class:'cell'},m.inReach(t)?'IN REICHWEITE':'NICHT IN REICHWEITE')),
    detailError?el('p',{class:'why'},
      'Blocker und Ereignisstrom liefert dieser Server nicht — was hier steht, kommt aus dem Bestand.',
      el('span',{class:'mono',style:'display:block;font-size:.78rem;margin-top:.3rem'},detailError)):null,
    treeSection(t,m),
    blockerSection(t,m),
    eventSection());
  sheet(t.title||'Aufgabe',body,taskActions(t,m,close),'Schließen',
    {wide:true,focus:false});
}

/* Kette nach oben, Schritte darunter. Beide Richtungen anklickbar: Wer eine
   Aufgabe offen hat, will von hier aus weiter und nicht zurück in die Liste
   und wieder hinein. */
function treeSection(t,m){
  const parents=(detailFull&&detailFull.parents)||m.chainOf(t);
  const children=(detailFull&&detailFull.children)||m.kids.get(t.id)||[];
  if(!parents.length&&!children.length) return null;
  return section('Baum',
    parents.length?el('div',{class:'crumb'},
      parents.map((p,i)=>[i?el('span',{class:'sep'},'›'):null,
        el('button',{class:'brk',onclick:()=>taskSheet(p.id)},p.title)])):null,
    children.length?el('div',{class:'tree'},
      children.map(c=>el('button',{class:'node'+(c.state==='done'?' done':''),
        onclick:()=>taskSheet(c.id)},
        c.title,
        c.activationEnergy?el('span',{class:'cell'},'START '+c.activationEnergy+'/10'):null))):null,
    children.length?null:el('p',{class:'faint'},'Keine Schritte. Zerlegen legt welche an.'));
}

/* Blocker in beide Richtungen: „wartet auf" ist die Frage, warum hier nichts
   geht; „hält auf" die Frage, warum es woanders nicht geht. Nur die zweite
   erklärt, weshalb eine kleine Aufgabe vorgezogen gehört. */
function blockerSection(t,m){
  if(!detailFull) return null;
  const before=detailFull.blockedBy||[],after=detailFull.blocks||[];
  const known=new Set([...before,...after].map(x=>x.id));
  const line=(x,drop)=>el('div',{class:'node'+(x.done||x.state==='done'?' done':'')},
    el('button',{class:'tlink',onclick:()=>taskSheet(x.id)},x.title),
    drop?el('button',{class:'drop',title:'Blocker entfernen',
      onclick:()=>dropBlocker(t.id,x.id)},'Entfernen'):null);
  return section('Blocker',
    el('div',{class:'eyebrow'},'WARTET AUF'),
    before.length?el('div',{class:'tree'},before.map(x=>line(x,true)))
      :el('p',{class:'faint'},'Nichts.'),
    el('div',{class:'eyebrow',style:'margin-top:.6rem'},'HÄLT AUF'),
    after.length?el('div',{class:'tree'},after.map(x=>line(x,false)))
      :el('p',{class:'faint'},'Nichts.'),
    blockerPicker(t.id,known),
    cycleBox(m));
}

function blockerPicker(id,known){
  const out=el('div',{class:'picks'});
  const input=el('input',{type:'search',placeholder:'Wartet auf … (Aufgabe suchen)',
    'aria-label':'Blocker suchen'});
  const fill=()=>{
    const q=input.value.trim().toLowerCase();
    const list=tasks.filter(x=>x.id!==id&&x.state!=='done'&&x.state!=='dropped'
      &&!known.has(x.id)&&(!q||String(x.title||'').toLowerCase().includes(q)))
      .slice(0,8);
    put(out,list.length
      ?list.map(x=>el('button',{class:'btn',onclick:()=>addBlocker(id,x.id)},x.title))
      :el('p',{class:'faint'},'Nichts gefunden.'));
  };
  input.addEventListener('input',fill);
  fill();
  return el('div',{style:'margin-top:.7rem'},input,out);
}

async function addBlocker(id,blockerId){
  try{
    await api('/api/tasks/'+encodeURIComponent(id)+'/blockers',
      {method:'POST',body:JSON.stringify({blockerId})});
    detailNote=null;
    await reload();
    await taskSheet(id);
  }catch(e){
    const path=e.data&&Array.isArray(e.data.path)?e.data.path:null;
    detailNote=(path&&path.length)?{path}:{text:e.message};
    paintDetail();
  }
}
async function dropBlocker(id,blockerId){
  try{
    await api('/api/tasks/'+encodeURIComponent(id)+'/blockers/'+encodeURIComponent(blockerId),
      {method:'DELETE'});
    detailNote=null;
    await reload();
    await taskSheet(id);
  }catch(e){detailNote={text:e.message};paintDetail()}
}

/* Der Kreis wird gezeigt, nicht bloß abgelehnt. „Geht nicht" ohne Grund ist
   in diesem System der teuerste Fehlermodus: Man probiert es dreimal und
   hält danach das Werkzeug für kaputt. */
function cycleBox(m){
  if(!detailNote) return null;
  if(!detailNote.path) return el('div',{class:'cycle'},el('p',{},detailNote.text));
  return el('div',{class:'cycle'},
    el('p',{},'Das schlösse einen Kreis. Jede dieser Aufgaben wartete am Ende auf sich selbst, und dann gibt es keine, mit der angefangen werden kann.'),
    el('p',{class:'path'},detailNote.path.map(p=>{
      if(p&&typeof p==='object') return String(p.title||p.id||'');
      const t=m.byId.get(p);
      return t?t.title:String(p);
    }).join(' → ')));
}

function eventSection(){
  if(!detailFull) return null;
  const events=detailFull.events||[];
  return section('Ereignisse',
    events.length?events.slice(0,60).map(e=>el('div',{class:'ev'},
      el('span',{class:'t'},new Date(e.at).toLocaleString('de',
        {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})),
      el('span',{class:'k'},e.type),
      el('span',{class:'p',title:JSON.stringify(e.payload)},JSON.stringify(e.payload))))
      :el('p',{class:'faint'},'Noch nichts geschehen.'),
    el('p',{class:'faint',style:'margin-top:.4rem'},
      'Nur lesend. Eine Korrektur ist ein neues Ereignis.'));
}

/* Der Deckel greift. Sachlich, mit Regel-ID, ohne Vorwurf — dieselben Worte
   wie im Editor am Telefon. */

function rationaleOf(rule){

}

/* ── Hilfe ───────────────────────────────────────────────────────────
   Die Bedienungsanleitung, im Browser lesbar. Sie liegt als Markdown im
   App-Bündel und kommt kapitelweise vom Server — dieselben Texte, die auf
   dem Telefon in der Hilfe stehen, keine zweite Fassung.

   Warum sie hier überhaupt anders ist als dort: Auf dem Telefon liest man
   ein Kapitel und muss für jeden Sprung zurück. Hier stehen Liste und
   Kapitel nebeneinander und die Suche geht über alle — das ist der ganze
   Unterschied, und er ist der Grund, warum diese Fläche existiert.

   Die Sprachwahl gilt nur für die Doku. Die Oberfläche ringsum ist
   deutsch, und ein englisches Kapitel darin ist eine halbe Übersetzung —
   aber die Texte gibt es in beiden Fassungen, und wer die englische lesen
   will, soll sie nicht suchen müssen. Fehlt sie, kommt die deutsche mit
   einem Hinweis darüber statt einer leeren Seite. */
let helpChapters=[],helpId=null,helpDoc=null,helpQuery='',helpError=null;
let helpAllLoaded=false,helpLoading=null;
let helpLang=localStorage.getItem('axiom.help.lang')==='en'?'en':'de';
const helpCache=new Map();

async function loadHelp(){
  try{helpChapters=(await api('/api/help?lang='+helpLang)).chapters||[];helpError=null}
  catch(e){helpChapters=[];helpError=e.message}
  if(!helpChapters.some(c=>c.id===helpId))
    helpId=helpChapters.length?helpChapters[0].id:null;
  helpDoc=helpId?await helpDocOf(helpId):null;
}
/* Einmal geholt, bleibt im Speicher. Vierzehn Kapitel Text sind hier kein
   Speicherproblem — auf dem Telefon wäre das eine andere Frage, und genau
   deshalb steht die Suche nur hier. Fehlgeschlagenes wird nicht gemerkt:
   Ein Kapitel, das der Server gerade nicht hatte, soll beim nächsten Klick
   wieder versucht werden. */
async function helpDocOf(id){
  const key=helpLang+'/'+id;
  if(helpCache.has(key)) return helpCache.get(key);
  try{
    const doc=await api('/api/help/'+encodeURIComponent(id)+'?lang='+helpLang);
    helpCache.set(key,doc);
    return doc;
  }catch(e){return {id,title:'',markdown:'',error:e.message}}
}
async function openChapter(id){
  if(!id) return;
  helpId=id;
  helpDoc=await helpDocOf(id);
  if(tab!=='help'){tab='help';localStorage.setItem('axiom.tab',tab);markTabs()}
  render();
  // Wer einem Verweis folgt, will den Anfang des Kapitels sehen und nicht
  // die Stelle, an der er stand.
  const box=$('#chapter');
  if(box) box.scrollIntoView({block:'nearest'});
}
async function setHelpLang(lang){
  if(lang===helpLang) return;
  helpLang=lang;localStorage.setItem('axiom.help.lang',lang);
  helpAllLoaded=false;helpLoading=null;
  await loadHelp();render();
}

/* Gesucht wird im Text, nicht nur in den Überschriften: Wer „Reizbudget"
   eintippt, weiß meist nicht, in welchem Kapitel es steht — das ist der
   Grund, aus dem er sucht. Dafür werden beim ersten Tastendruck alle
   Kapitel einmal geholt. */
async function helpSearchInput(e){
  helpQuery=e.target.value;
  if(helpQuery.trim()&&!helpAllLoaded){
    // Auf denselben Lauf warten, nicht einen zweiten starten: Sonst
    // schickt jeder weitere Tastendruck vor der ersten Antwort noch
    // einmal vierzehn Anfragen an ein Telefon.
    helpLoading=helpLoading||Promise.all(helpChapters.map(c=>helpDocOf(c.id)));
    await helpLoading;
    helpAllLoaded=true;helpLoading=null;
  }
  const list=$('#help-list');
  if(list) fillToc(list);
}
function helpMatches(){
  const q=helpQuery.trim().toLowerCase();
  if(!q) return helpChapters.map(c=>({id:c.id,title:c.title,hit:null}));
  const out=[];
  for(const c of helpChapters){
    const doc=helpCache.get(helpLang+'/'+c.id);
    const text=String((doc&&doc.markdown)||'');
    const at=text.toLowerCase().indexOf(q);
    if(at<0&&!String(c.title||'').toLowerCase().includes(q)) continue;
    out.push({id:c.id,title:c.title,hit:at<0?null:helpExcerpt(text,at,q.length)});
  }
  return out;
}
function helpExcerpt(text,at,length){
  const from=Math.max(0,at-40);
  return (from?'… ':'')+
    text.slice(from,at+length+50).replace(/\s+/g,' ').trim()+' …';
}

function viewHelp(){
  const list=el('div',{id:'help-list'});
  const chapter=el('div',{class:'chapter md',id:'chapter'});
  fillToc(list);fillChapter(chapter);
  return el('div',{class:'help'},
    el('div',{class:'toc'},
      el('div',{class:'seg',role:'group','aria-label':'Sprache der Hilfe'},
        el('button',{'aria-pressed':helpLang==='de'?'true':'false',
          onclick:()=>setHelpLang('de')},'DEUTSCH'),
        el('button',{'aria-pressed':helpLang==='en'?'true':'false',
          onclick:()=>setHelpLang('en')},'ENGLISH')),
      el('input',{type:'search',value:helpQuery,placeholder:'Suchen',
        'aria-label':'Hilfe durchsuchen',oninput:helpSearchInput}),
      list),
    chapter);
}
function fillToc(box){
  if(helpError){put(box,el('p',{class:'faint'},helpError));return}
  if(!helpChapters.length){
    put(box,el('p',{class:'faint'},'Keine Kapitel im Bündel.'));return;
  }
  const matches=helpMatches();
  if(!matches.length){put(box,el('p',{class:'faint'},'Nichts gefunden.'));return}
  put(box,matches.map(c=>el('button',{class:'ch',
    'aria-current':c.id===helpId?'true':'false',onclick:()=>openChapter(c.id)},
    el('span',{class:'num mono'},c.id),c.title,
    c.hit?el('span',{class:'hit'},c.hit):null)));
}
function fillChapter(box){
  if(!helpDoc){
    put(box,el('p',{class:'faint'},
      'Die Hilfe liegt als Text im App-Bündel. Steht dort nichts, zeigt der Server nichts — die Kapitel entstehen unter assets/help/.'));
    return;
  }
  if(helpDoc.error){put(box,el('p',{class:'faint'},helpDoc.error));return}
  put(box,
    helpDoc.fallback?el('p',{class:'why'},
      'Dieses Kapitel gibt es noch nicht auf Englisch. Darunter steht die deutsche Fassung.'):null,
    mdRender(helpDoc.markdown||''));
}

/* ── Hilfe: Darsteller — Anfang ───────────────────────────────────────
   Ein Markdown-Darsteller in genau dem Umfang, den die Doku benutzt:
   Überschriften, Fließtext mit fett und Code, zwei Sorten Aufzählung,
   hervorgehobener Absatz, Tabelle, Bild, Kapitelverweis. Mehr wäre eine
   zweite Baustelle mit eigenen Fehlern.

   **Kein Markup aus der Antwort.** Der Text ist von einem Menschen
   geschrieben, aber sein Weg hierher führt über das Netz — und ein
   Darsteller, der dem Browser eine Zeichenkette zum Auswerten gibt, macht
   aus jeder spitzen Klammer in der Doku eine Anweisung. Gebaut wird
   deshalb Knoten für Knoten mit el(). Der Test dazu verbietet die
   Eigenschaften, die das könnten, zwischen diesen beiden Marken
   namentlich — deshalb steht keine von ihnen hier im Text.

   Zwei Ziele werden erkannt, nicht übernommen: `img/name.webp` und
   `kapitel:NN`. Alles andere bleibt Text — auch ein Verweis nach draußen,
   den die Seite gar nicht laden dürfte (ADR-0005). Was der Darsteller
   nicht kennt, gibt er unverändert aus: Er darf nie werfen und nie etwas
   verschlucken, denn eine Zeile, die sichtbar unfertig aussieht, ist immer
   besser als eine, die verschwunden ist. */
/* Kursiv kommt nach fett — sonst schluckt `*…*` die erste Haelfte von
   `**…**` und aus fettem Text wird ein Sternchen mit Kursivschrift.
   Die Doku benutzt Kursiv fuer Navigationspfade („System → Erfassen") und
   fuer die Beschriftung von Bedienelementen; ohne diese Regel standen die
   Sternchen sichtbar im Text. */
const MD_INLINE=/\*\*([^*]+)\*\*|\*([^*\n]+)\*|`([^`]+)`|(!?)\[([^\]]*)\]\(([^)\s]+)\)/g;
const MD_IMG=/^img\/([a-z0-9-]+\.webp)$/;
const MD_CHAPTER=/^kapitel:(\d{2})$/;
const MD_BLOCK=/^(#{1,3}\s|\s*>|\s*[-*]\s|\s*\d+\.\s|\s*\|)/;

function mdRender(src){
  const frag=document.createDocumentFragment();
  const lines=String(src).replace(/\r/g,'').split('\n');
  let i=0;
  const take=test=>{const out=[];while(i<lines.length&&test(lines[i])) out.push(lines[i++]);return out};
  while(i<lines.length){
    const line=lines[i];
    if(!line.trim()){i++;continue}
    const head=/^(#{1,3})\s+(.*)$/.exec(line);
    if(head){i++;frag.append(el('h'+head[1].length,{},mdInline(head[2].trim())));continue}
    if(/^\s*>\s?/.test(line)){
      frag.append(el('blockquote',{},mdInline(
        take(l=>/^\s*>\s?/.test(l)).map(l=>l.replace(/^\s*>\s?/,'')).join(' ').trim())));
      continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      frag.append(el('ul',{},take(l=>/^\s*[-*]\s+/.test(l))
        .map(l=>el('li',{},mdInline(l.replace(/^\s*[-*]\s+/,''))))));
      continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      frag.append(el('ol',{},take(l=>/^\s*\d+\.\s+/.test(l))
        .map(l=>el('li',{},mdInline(l.replace(/^\s*\d+\.\s+/,''))))));
      continue;
    }
    if(/^\s*\|/.test(line)){frag.append(mdTable(take(l=>/^\s*\|/.test(l))));continue}
    // Die erste Zeile wird immer verbraucht — sonst stünde der Zeiger
    // still, wenn eine Zeile in keinen Zweig passt, und die Schleife liefe
    // ewig.
    const rows=[lines[i++]];
    while(i<lines.length&&lines[i].trim()&&!MD_BLOCK.test(lines[i])) rows.push(lines[i++]);
    frag.append(mdParagraph(rows.join(' ').trim()));
  }
  return frag;
}

/* Ein Absatz, der aus nichts als einem Bild besteht, wird zur Abbildung
   mit Unterschrift — der Alternativtext ist ohnehin die Bildunterschrift,
   und zweimal derselbe Satz wäre einmal zu viel. */
function mdParagraph(text){
  const only=/^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(text);
  if(only){
    const image=mdImage(only[2],only[1]);
    if(image) return el('figure',{},image,
      only[1]?el('figcaption',{},only[1]):null);
  }
  return el('p',{},mdInline(text));
}

function mdTable(rows){
  const cells=row=>row.trim().replace(/^\|/,'').replace(/\|$/,'')
    .split('|').map(c=>c.trim());
  const isRule=row=>/^\s*\|[\s:|-]+$/.test(row);
  const body=[];
  let head=null;
  rows.forEach((row,index)=>{
    // Die Trennzeile macht die Zeile darüber zum Kopf. Steht sie
    // woanders, wird sie übergangen statt als Inhalt gezeigt.
    if(isRule(row)){if(index===1&&body.length===1) head=body.pop();return}
    body.push(cells(row));
  });
  const table=el('table',{});
  if(head) table.append(el('thead',{},el('tr',{},head.map(c=>el('th',{},mdInline(c))))));
  table.append(el('tbody',{},body.map(r=>el('tr',{},r.map(c=>el('td',{},mdInline(c)))))));
  return el('div',{class:'scroll'},table);
}

function mdInline(text){
  const out=[];
  let last=0,m;
  MD_INLINE.lastIndex=0;
  while((m=MD_INLINE.exec(text))!==null){
    if(m.index>last) out.push(text.slice(last,m.index));
    last=MD_INLINE.lastIndex;
    if(m[1]!==undefined){out.push(el('strong',{},m[1]));continue}
    if(m[2]!==undefined){out.push(el('em',{},m[2]));continue}
    if(m[3]!==undefined){out.push(el('code',{},m[3]));continue}
    const node=m[4]==='!'?mdImage(m[6],m[5]):mdLink(m[6],m[5]);
    out.push(node===null?m[0]:node);
  }
  if(last<text.length) out.push(text.slice(last));
  return out;
}
/* Der Dateiname wird erkannt, nicht übernommen: Was nicht genau
   `img/name.webp` ist, wird hier kein Bildpfad. Der Server führt dieselbe
   Liste noch einmal und liefert nur aus, was darin steht — zwei Schlösser
   an derselben Tür, weil hinter ihr das ganze App-Bündel liegt. */
function mdImage(target,alt){
  const m=MD_IMG.exec(String(target));
  if(!m) return null;
  return el('img',{src:'/help/img/'+m[1],alt:alt||'',loading:'lazy'});
}
/* Nur Verweise ins eigene Regelwerk werden anklickbar, und sie werden ein
   Knopf statt eines Verweises: Ein Ziel aus dem Text der Antwort wäre eine
   Adresse, die diese Seite nicht kennt — und nach draußen führt hier
   nichts (ADR-0005). */
function mdLink(target,label){
  const m=MD_CHAPTER.exec(String(target));
  if(!m) return null;
  return el('button',{class:'lnk',onclick:()=>openChapter(m[1])},label||m[1]);
}
/* ── Hilfe: Darsteller — Ende ─────────────────────────────────────── */

/* ── Blätter ─────────────────────────────────────────────────────────
   `showModal` wirft, wenn das Blatt schon offen ist. Die Detailansicht
   zeichnet sich aber neu, sobald der Server geantwortet hat — deshalb wird
   nur geöffnet, was noch zu ist, und der Fokus nur gesetzt, wo ein Blatt
   zum Ausfüllen da ist. In einer Ansicht mit Suchfeld spränge der Cursor
   sonst bei jeder Antwort dorthin zurück. */
function sheet(title,body,actions,closeLabel,opts){
  const d=$('#dlg');
  d.className=(opts&&opts.wide)?'wide':'';
  put(d,el('h2',{},title),body,
    el('div',{class:'row'},...actions,
      el('button',{class:'btn quiet',onclick:()=>d.close()},closeLabel||'Abbrechen')));
  if(!d.open) d.showModal();
  if(!opts||opts.focus!==false){
    const first=d.querySelector('input,textarea');
    if(first) setTimeout(()=>first.focus(),30);
  }
  return d;
}
function dial(label,hint,low,high,value,min=1,max=5){
  const out=el('span',{class:'val mono'},String(value));
  const input=el('input',{type:'range',min,max,value,step:1,
    oninput:e=>{out.textContent=e.target.value}});
  const box=el('div',{class:'dial'},
    el('div',{class:'head'},el('label',{},label),out),
    hint?el('p',{class:'faint'},hint):null,input,
    el('div',{class:'ends'},el('span',{},low),el('span',{},high)));
  box.value=()=>Number(input.value);
  return box;
}
