      stepper(tr('Höchstens pro Tag'),[0,1,2,3,5,10],d.maxPerDay,tr('mal'),
        v=>{d.maxPerDay=v},tr('Eine harte Obergrenze zusätzlich zum Abstand.'),tr('kein Limit')),
      stepper(tr('Rang bei Gleichstand'),[10,30,50,70,90],d.priority,'',
        v=>{d.priority=v},
        tr('Feuern zwei Regeln gleichzeitig, gewinnt die mit dem höheren Rang. Bei Gleichstand entscheidet die Nummer — nie der Zufall.')),
      el('div',{class:'pick',style:'margin-top:.6rem'},
        el('button',{class:'tog','aria-pressed':d.enabled?'true':'false',
          onclick:()=>{d.enabled=!d.enabled;redraw()}},tr('Regel aktiv')),
        el('button',{class:'tog','aria-pressed':d.backoff?'true':'false',
          title:tr('Der Abstand verdoppelt sich, solange die Regel folgenlos bleibt'),
          onclick:()=>{d.backoff=!d.backoff;redraw()}},tr('Abstand verdoppeln'))),
      el('p',{class:'hint'},tr('Ausgeschaltet bleibt die Regel erhalten, wird aber nicht ausgewertet.'))),
    (Object.keys(d.extra.titles).length||Object.keys(d.extra.rationales).length)
      ?el('p',{class:'hint'},tr('Die englischen Fassungen bleiben unverändert erhalten.')):null);
}

function textField(value,placeholder,set){
  return el('input',{type:'text',value:value||'',placeholder,
    oninput:e=>{set(e.target.value);previewSoon();refreshVerdict()}});
}
function rationaleField(d){
  const box=el('textarea',{style:'min-height:6.5rem',
    placeholder:tr('Was diese Regel verhindern oder auslösen soll'),
    oninput:e=>{d.rationale=e.target.value;previewSoon();refreshVerdict()}});
  box.value=d.rationale||'';
  return box;
}
function numberField(value,min,max,set){
  return el('input',{type:'number',min,max,value,style:'width:6.5rem',
    oninput:e=>{set(Number(e.target.value));previewSoon();refreshVerdict()}});
}
function timeField(value,set){
  return el('input',{type:'time',value:value||'00:00',style:'width:8.5rem',
    oninput:e=>{set(e.target.value);previewSoon();refreshVerdict()}});
}
function sel(items,value,onChange,label){
  const box=el('select',{class:'slim','aria-label':label||'',
    onchange:e=>onChange(e.target.value)});
  for(const it of items){
    const option=el('option',{value:String(it.v)},it.l||String(it.v));
    if(String(it.v)===String(value)) option.selected=true;
    box.append(option);
  }
  return box;
}
function stepper(label,steps,value,unit,set,meaning,zeroLabel){
  return el('div',{style:'margin-top:.3rem'},
    el('label',{},label),
    el('div',{class:'pick'},steps.map(s=>el('button',
      {class:'btn'+(s===value?' primary':''),onclick:()=>{set(s);redraw()}},
      s===0&&zeroLabel?zeroLabel:(unit?s+' '+unit:String(s))))),
    meaning?el('p',{class:'hint',style:'margin-top:.35rem'},meaning):null);
}

function deficitPicker(d){
  const list=(vocab&&vocab.deficits)||[];
  if(!list.length) return el('p',{class:'hint'},tr('Keine Liste abrufbar. Ohne Zuordnung ist eine Regel verdächtig.'));
  return el('div',{class:'pick'},list.map(x=>el('button',
    {class:'btn'+(d.deficit===x.id?' primary':''),
     onclick:()=>{d.deficit=d.deficit===x.id?null:x.id;redraw()}},
    x.id+' · '+x.label)));
}
function severityPicker(d){
  const list=((vocab&&vocab.severities)||[]);
  const shown=list.length?list:[{id:d.severity,label:d.severity}];
  const current=list.find(s=>s.id===d.severity);
  return [el('div',{class:'pick'},shown.map(s=>el('button',
    {class:'btn'+(d.severity===s.id?' primary':''),
     // Die Beschriftung kommt übersetzt vom Server („nur protokollieren").
     // In Versalien gesetzt war sie eine Ansage statt einer Wahl.
     onclick:()=>{d.severity=s.id;redraw()}},String(s.label||s.id)))),
    current&&current.meaning?el('p',{class:'hint'},current.meaning):null];
}
function actionPicker(d){
  const list=(vocab&&vocab.actions)||[];
  const spec=list.find(a=>a.type===d.action);
  const kids=[sel(list.length?list.map(a=>({v:a.type,l:a.label})):[{v:d.action,l:d.action}],
    d.action,v=>{d.action=v;redraw()},tr('Was die Regel auslöst'))];
  if(spec&&spec.meaning) kids.push(el('p',{class:'hint'},spec.meaning));
  // Welche Angaben eine Aktion braucht, sagt die Engine — sonst wäre die
  // Liste hier eine zweite Wahrheit, die still veraltet.
  const declared=(spec&&spec.params)||(d.action==='notify'?{text:tr('Was dort stehen soll')}:{});
  for(const [name,label] of Object.entries(declared)){
    kids.push(el('label',{style:'margin-top:.5rem'},tr('{0} (optional)',[label])),
      textField(d.params[name]===undefined?'':String(d.params[name]),name,v=>{
        const text=v.trim();
        if(!text) delete d.params[name];
        // Zahlen als Zahlen: `max_seconds: "15"` läse die Engine als Text.
        else d.params[name]=/^-?\d+$/.test(text)?Number(text):text;
      }));
  }
  const rest=Object.keys(d.params).filter(k=>!(k in declared));
  if(rest.length) kids.push(el('p',{class:'hint'},
    tr('Unverändert übernommen: {0}',[rest.map(k=>k+': '+scalarYaml(d.params[k])).join(', ')])));
  return kids;
}

/* ── Bedingungsbaum ──────────────────────────────────────────────────
   „nicht" ist ein Schalter an der Bedingung, keine dritte Sorte Knoten:
   Eine Ebene weniger im Baum ist eine Entscheidung weniger beim Lesen. */
function groupCard(g,depth,onRemove){
  const box=el('div',{class:'cond grp'});
  box.append(el('div',{class:'top'},
    el('button',{class:'tog','aria-pressed':g.any?'false':'true',
      onclick:()=>{g.any=false;redraw()}},tr('Alle Bedingungen')),
    el('button',{class:'tog','aria-pressed':g.any?'true':'false',
      onclick:()=>{g.any=true;redraw()}},tr('Eine von ihnen')),
    notToggle(g),
    onRemove?el('button',{class:'btn quiet',onclick:onRemove},tr('Gruppe entfernen')):null));
  g.children.forEach((child,i)=>{
    const remove=()=>{g.children.splice(i,1);redraw()};
    box.append(child.t==='group'
      ?groupCard(child,depth+1,remove)
      :leafCard(child,(depth===0&&g.children.length===1)?null:remove));
  });
  box.append(el('div',{class:'pick'},
    el('button',{class:'btn quiet',onclick:()=>{g.children.push(newLeaf());redraw()}},tr('+ Bedingung')),
    // Verschachtelung bis zur dritten Ebene: Drei sind lesbar, vier sind
    // ein Programm.
    depth<2?el('button',{class:'btn quiet',onclick:()=>{
      g.children.push({t:'group',any:!g.any,negated:false,children:[newLeaf()]});redraw();
    }},tr('+ Gruppe')):null));
  return box;
}
function notToggle(node){
  return el('button',{class:'tog','aria-pressed':node.negated?'true':'false',
    onclick:()=>{node.negated=!node.negated;redraw()}},tr('Nicht'));
}
function leafCard(f,onRemove){
  const kinds=[{v:'number',l:tr('Zahl')},{v:'choice',l:tr('Auswahl')},{v:'time',l:tr('Uhrzeit')},
    {v:'since',l:tr('Seit einem Ereignis')},{v:'count',l:tr('Anzahl heute')}];
  const box=el('div',{class:'cond'});
  box.append(el('div',{class:'top'},
    sel(kinds,f.kind,v=>{switchKind(f,v);redraw()},tr('Art der Bedingung')),
    notToggle(f),
    onRemove?el('button',{class:'btn quiet',onclick:onRemove},tr('Entfernen')):null));
  box.append(el('div',{class:'fields'},leafFields(f)));
  const meaning=leafMeaning(f);
  if(meaning) box.append(el('p',{class:'now'},meaning));
  const actual=leafActual(f);
  if(actual!==null) box.append(el('p',{class:'now'},tr('jetzt: {0}',[actual])));
  return box;
}
function leafFields(f){
  const numerics=(vocab&&vocab.numerics)||[],symbolics=(vocab&&vocab.symbolics)||[],
    evts=(vocab&&vocab.events)||[];
  if(f.kind==='number'){
    // Grenzen kommen aus dem Wortschatz: geraten läge jede andere Skala daneben.
    const spec=numerics.find(v=>v.id===f.variable)||{};
    return [
      sel(numerics.map(v=>({v:v.id,l:v.label})),f.variable,v=>{f.variable=v;redraw()},tr('Größe')),
      sel(opItems(false),f.op,v=>{f.op=v;redraw()},tr('Vergleich')),
      numberField(f.number,spec.min===undefined?0:spec.min,
        spec.max===undefined?100:spec.max,v=>{f.number=v})];
  }
  if(f.kind==='choice'){
    const spec=symbolics.find(s=>s.id===f.variable);
    const values=spec?Object.entries(spec.values||{}):[];
    return [
      sel(symbolics.map(v=>({v:v.id,l:v.label})),f.variable,v=>{
        f.variable=v;
        const next=symbolics.find(s=>s.id===v);
        f.symbol=next?(Object.keys(next.values||{})[0]||''):'';
        redraw();
      },tr('Größe')),
      sel(opItems(true),f.op,v=>{f.op=v;redraw()},tr('Vergleich')),
      values.map(([key,label])=>el('button',
        {class:'btn'+(f.symbol===key?' primary':''),
         onclick:()=>{f.symbol=key;redraw()}},label))];
  }
  if(f.kind==='time') return [
    el('span',{class:'hint'},tr('von')),timeField(f.from,v=>{f.from=v}),
    el('span',{class:'hint'},tr('bis')),timeField(f.to,v=>{f.to=v})];
  return [
    sel(evts.map(v=>({v:v.id,l:v.label})),f.event,v=>{f.event=v;redraw()},tr('Ereignis')),
    sel(opItems(false),f.op,v=>{f.op=v;redraw()},tr('Vergleich')),
    numberField(f.number,0,f.kind==='since'?1440:50,v=>{f.number=v}),
    el('span',{class:'hint'},f.kind==='since'?tr('Minuten'):tr('mal heute'))];
}
/* Welche Vergleiche es gibt, sagt die Engine; wie sie in der Oberfläche
   heißen, steht hier. Vorher gewann das Etikett aus dem Wortschatz — das ist
   hart deutsch (`rule_vocabulary.dart`) und ließ die Liste in der englischen
   Oberfläche deutsch. Für alles, was die Engine darüber hinaus kennt, gilt
   weiterhin ihr Etikett; erfunden wird hier nichts.

   `OPS` ist zugleich die Menge der Schlüssel, an denen der Leser einen
   Vergleich im YAML erkennt (`parseCondition`). Die Beschriftung entsteht
   erst beim Zeichnen: Ein `tr()` beim Laden fror die Sprache ein, die der
   Browser geraten hatte — die des Telefons kommt erst mit der ersten
   Antwort. */
const OPS=['lt','lte','gte','gt','eq','ne'];
function opLabel(op){
  return {lt:tr('kleiner als'),lte:tr('höchstens'),gte:tr('mindestens'),
    gt:tr('größer als'),eq:tr('genau'),ne:tr('nicht')}[op];
}
function opItems(symbolic){
  const source=(vocab&&vocab.operators)||{};
  const labels=(vocab&&vocab.operatorLabels)||{};
  const raw=(symbolic?source.symbolic:source.numeric)||
    (symbolic?['eq','ne']:OPS);
  return raw.map(o=>typeof o==='string'
    ?{v:o,l:opLabel(o)||labels[o]||o}
    :{v:o.id||o.op||o.token,l:opLabel(o.id)||o.label||labels[o.id]||o.id});
}
function leafMeaning(f){
  const find=(list,id)=>((vocab&&vocab[list])||[]).find(x=>x.id===id);
  if(f.kind==='number') return (find('numerics',f.variable)||{}).meaning||'';
  if(f.kind==='choice') return (find('symbolics',f.variable)||{}).meaning||'';
  if(f.kind==='time') return tr('Über Mitternacht hinweg erlaubt — 22:00 bis 05:00 meint die Nacht.');
  if(f.kind==='since') return tr('Ein Ereignis, das nie eintrat, gilt als unendlich lange her.');
  return '';
}
/* Was gerade tatsächlich anliegt — die halbe Miete beim Regelschreiben.
   Zahlen kommen aus dem Zustand, den die Kopfzeile ohnehin zeigt. */
function leafActual(f){
  if(f.kind==='number'){
    const v=(S.values||{})[f.variable];
    return v&&v.value!==null&&v.value!==undefined?String(v.value):null;
  }
  if(f.kind==='choice') return f.variable==='load_level'?(S.loadLevel||null):null;
  if(f.kind==='time') return new Date().toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'});
  return null;
}

/* ── Vorschau, Probleme, Speichern ───────────────────────────────── */
function previewSoon(){
  clearTimeout(previewTimer);
  const d=editor;
  if(!d) return;
  previewTimer=setTimeout(async()=>{
    const yaml=currentYaml();
    if(yaml===null){d.preview=null;d.previewError=null;refreshVerdict();return}
    try{
      const result=await api('/api/rules/preview',{method:'POST',body:JSON.stringify({yaml})});
      if(editor!==d) return;
      d.preview=result;d.previewError=null;
    }catch(e){
      // Eine Vorschau, die den Server nicht erreicht, ist kein Urteil über
      // die Regel — sie darf das Speichern deshalb nicht sperren. Geprüft
      // wird beim Speichern ohnehin, und Abgelehntes wird nicht gespeichert.
      if(editor!==d) return;
      d.preview=null;d.previewError=e.message;
    }
    refreshVerdict();
  },400);
}
function refreshVerdict(){
  if(!editor) return;
  if(refPreview) put(refPreview,previewKids());
  if(refProblems) put(refProblems,problemKids());
  if(refSave) refSave.disabled=!canSave();
}
function previewKids(){
  const p=editor.preview;
  const head=el('span',{class:'eyebrow'},tr('Mit dem Zustand von jetzt'));
  if(editor.previewError) return [head,el('p',{class:'faint',style:'margin-top:.4rem'},
    tr('Die Vorschau ist gerade nicht erreichbar ({0}). Beim Speichern wird trotzdem geprüft.',[editor.previewError]))];
  if(!p) return [head,el('p',{class:'faint',style:'margin-top:.4rem'},tr('Wird geprüft …'))];
  const kids=[head];
  if(p.ok===false){
    kids.push(el('p',{style:'margin-top:.4rem;color:var(--caution)'},
      tr('So lässt sich die Regel nicht laden. Was fehlt, steht darunter.')));
  }else{
    kids.push(el('h2',{style:'margin:.4rem 0'},
      p.firesNow?tr('Sie würde jetzt feuern.'):tr('Sie würde jetzt nicht feuern.')));
    if(p.explanation) kids.push(el('p',{class:'why'},p.explanation));
    // Der erklärende Satz nennt die scheiternde Stelle bereits. Nur wenn er
    // fehlt, steht sie hier für sich.
    else if(!p.firesNow&&p.failedAt) kids.push(el('p',{class:'mono',style:'font-size:.8rem'},
      tr('Es scheitert an: {0}',[p.failedAt])));
  }
  for(const w of p.warnings||[]) kids.push(el('p',{class:'faint',style:'margin-top:.4rem'},w));
  return kids;
}
function problemKids(){
  const list=clientProblems();
  const p=editor.preview;
  if(p&&p.ok===false) for(const e of p.errors||[]) if(list.indexOf(e)<0) list.push(e);
  if(!list.length) return [];
  return [el('div',{class:'panel',style:'margin-top:1rem;border-color:color-mix(in srgb,var(--caution) 55%,var(--rule))'},
    el('span',{class:'eyebrow'},tr('Fehlt noch')),
    list.map(x=>el('p',{style:'margin-top:.4rem'},'· '+x)))];
}
/* Dieselben Pflichten wie im Validator, nur früher. `rationale` und
   `cooldown` sind keine Formalien: ohne Begründung ist eine Ausgabe nicht
   nachvollziehbar (G2), ohne Abstand entsteht Meldungsflut (R2). */
function clientProblems(){
  const d=editor,out=[];
  if(d.mode==='yaml'){
    if(!String(d.raw||'').trim()) out.push(tr('Der Text ist leer.'));
    return out;
  }
  if(String(d.title||'').trim().length<3)
    out.push(tr('Der Titel fehlt. Er steht später in der Meldung.'));
  if(String(d.rationale||'').trim().length<40)
    out.push(tr('Die Begründung ist zu kurz. Sie erscheint im Systeminspektor und muss in einem halben Jahr noch erklären, warum es diese Regel gibt.'));
  if(!(d.cooldownMinutes>=1))
    out.push(tr('Ohne Abstand meldet sich die Regel beliebig oft.'));
  try{condMap(d.root)}catch(e){out.push(e.message)}
  return out;
}
function canSave(){
  if(!editor) return false;
  if(currentYaml()===null) return false;
  if(clientProblems().length) return false;
  const p=editor.preview;
  return !(p&&p.ok===false);
}
function currentYaml(){
  const d=editor;
  if(!d) return null;
  if(d.mode==='yaml') return d.raw||'';
  try{return ruleYaml(d)}catch(e){return null}
}
function setMode(mode){
  const d=editor;
  if(!d||mode===d.mode) return;
  if(mode==='yaml'){
    const yaml=currentYaml();
    if(yaml===null){toast(tr('Erst vervollständigen — der Entwurf ergibt noch kein YAML.'));return}
    d.raw=yaml;d.mode='yaml';
  }else{
    if(vocabError){toast(tr('Ohne den Wortschatz der Engine geht geführt nicht.'));return}
    let parsed;
    try{parsed=parseRuleDraft(d.raw||'')}
    catch(e){toast(tr('Der Text lässt sich nicht lesen: {0}',[e.message]));return}
    // Die Nummer bleibt, was sie war: IDs werden nicht umgebogen.
    parsed.id=d.id;parsed.isNew=d.isNew;parsed.edited=d.edited;
    parsed.preview=d.preview;parsed.mode='guided';
    editor=parsed;
  }
  redraw();
}
function shadowPanel(){
  return el('div',{class:'panel',style:'margin-top:1rem;border-color:color-mix(in srgb,var(--info) 50%,var(--rule))'},
    el('span',{class:'eyebrow'},tr('Sieben Tage stumm')),
    el('p',{style:'margin-top:.5rem'},
      tr('Die Regel läuft ab dem Speichern mit und wird protokolliert, sagt aber nichts. Im Systeminspektor siehst du, wie oft sie gefeuert hätte — danach entscheidest du, ob sie das wirklich soll.')));
}
async function saveRule(){
  const d=editor,yaml=currentYaml();
  if(yaml===null||!canSave()) return;
  try{
    await api('/api/rules/'+encodeURIComponent(d.id),
      {method:'PUT',body:JSON.stringify({yaml})});
    editor=null;
    toast(tr('Gespeichert — läuft sieben Tage stumm mit.'));
    await reload();
  }catch(e){
    const issues=(e.data&&e.data.issues)||[];
    if(issues.length){d.preview={ok:false,errors:issues};refreshVerdict()}
    toast(issues.length?issues[0]:e.message);
  }
}
async function resetRule(){
  const d=editor;
  if(!confirm(tr('Die eigene Fassung von {0} entfernen? Danach gilt wieder die mitgelieferte Regel; eine selbst geschriebene verschwindet. Die Nummer wird nicht wiederverwendet.',[d.id]))) return;
  try{
    await api('/api/rules/'+encodeURIComponent(d.id),{method:'DELETE'});
    editor=null;toast(tr('Zurückgenommen.'));await reload();
  }catch(e){toast(e.message)}
}

/* ── YAML, so viel wie das Regelwerk braucht ─────────────────────────
   Kein allgemeiner Parser: Blockabbildungen, Blocklisten, Fließformen und
   gefaltete Textblöcke — genau die Formen, die in rules/ vorkommen. Mehr
   wäre eine zweite Baustelle; weniger reichte nicht, um eine geladene
   Regel wieder geführt darzustellen.

   Geschrieben wird in derselben Form wie ruleToYaml in axiom_data: Ein
   Export soll sich nicht daran erkennen lassen, dass er aus dem Browser
   kommt — er muss nach rules/ zurückkopiert werden können. */
function ruleYaml(d){
  let out='- id: '+d.id+'\n  title: '+quoteYaml(d.title)+'\n';
  for(const [lang,text] of Object.entries(d.extra.titles||{}))
    out+='  title_'+lang+': '+quoteYaml(text)+'\n';
  if(d.deficit) out+='  deficit: '+d.deficit+'\n';
  out+=foldedYaml('rationale',d.rationale);
  for(const [lang,text] of Object.entries(d.extra.rationales||{}))
    out+=foldedYaml('rationale_'+lang,text);
  out+='  when:\n'+condYaml(condMap(d.root),4);
  out+='  then:\n    action: '+d.action+'\n';
  if(Object.keys(d.params||{}).length) out+='    params: '+flowYaml(d.params)+'\n';
  out+='  priority: '+d.priority+'\n  severity: '+d.severity+'\n';
  const cooldown={minutes:d.cooldownMinutes};
  if(d.maxPerDay) cooldown.max_per_day=d.maxPerDay;
  if(d.backoff) cooldown.backoff='exponential';
  out+='  cooldown: '+flowYaml(cooldown)+'\n  enabled: '+(d.enabled?'true':'false')+'\n';
  return out;
}
function condMap(n){
  if(n.t==='group'){
    if(!n.children.length) throw new Error(tr('Eine Gruppe braucht mindestens eine Bedingung.'));
    const built=n.children.map(condMap);
    // Eine Gruppe mit einem Kind ist im YAML unnötig — im Editor bleibt sie
    // trotzdem, damit „eine zweite hinzufügen" ein Klick bleibt.
    const inner=built.length===1?built[0]:(n.any?{any:built}:{all:built});
    return n.negated?{not:inner}:inner;
  }
  const number=Number(n.number);
  let inner;
  if(n.kind==='number'||n.kind==='since'||n.kind==='count'){
    if(!Number.isFinite(number)) throw new Error(tr('Eine Zahl fehlt.'));
  }
  if(n.kind==='number') inner={[n.variable]:{[n.op]:number}};
  else if(n.kind==='choice'){
    if(!n.symbol) throw new Error(tr('Ein Wert fehlt.'));
    inner={[n.variable]:{[n.op]:n.symbol}};
  }else if(n.kind==='time'){
    if(!/^\d{2}:\d{2}$/.test(String(n.from))||!/^\d{2}:\d{2}$/.test(String(n.to)))
      throw new Error(tr('Uhrzeit im Format 22:00 angeben.'));
    inner={time_between:[n.from,n.to]};
  }else if(n.kind==='since') inner={minutes_since:{event:n.event,[n.op]:Math.round(number)}};
  else inner={count_today:{event:n.event,[n.op]:Math.round(number)}};
  return n.negated?{not:inner}:inner;
}
function condYaml(node,indent){
  const pad=' '.repeat(indent);
  const key=Object.keys(node)[0],value=node[key];
  if(key==='all'||key==='any'){
    let out=pad+key+':\n';
    for(const child of value) out+=pad+'  - '+condYaml(child,indent+4).replace(/^\s+/,'');
    return out;
  }
  if(key==='not') return pad+'not:\n'+condYaml(value,indent+2);
  if(key==='time_between') return pad+'time_between: ['+value.map(scalarYaml).join(', ')+']\n';
  return pad+key+': '+flowYaml(value)+'\n';
}
function flowYaml(map){
  return '{ '+Object.entries(map).map(([k,v])=>k+': '+scalarYaml(v)).join(', ')+' }';
}
function scalarYaml(value){
  if(typeof value==='number'||typeof value==='boolean') return String(value);
  if(Array.isArray(value)) return '['+value.map(scalarYaml).join(', ')+']';
  const text=String(value);
  // Unquotiert nur, wo YAML es garantiert wieder als Text liest.
  return /^[A-Za-z][A-Za-z0-9_.-]*$/.test(text)?text:quoteYaml(text);
}
const quoteYaml=text=>'"'+String(text).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
/* Gefalteter Block, Umbruch bei 72 Zeichen — `>-` statt `>`, sonst käme
   der Text mit einem Zeilenumbruch zurück, den niemand geschrieben hat. */
function foldedYaml(key,text){
  const words=String(text||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  let out='  '+key+': >-\n',line='   ';
  for(const word of words){
    if(line.length+word.length+1>72){out+=line+'\n';line='   '}
    line+=' '+word;
  }
  if(line.trim()) out+=line+'\n';
  return out;
}

function parseRuleDraft(text){
  const doc=yamlParse(text);
  const node=Array.isArray(doc)?doc[0]:doc;
  if(!node||typeof node!=='object') throw new Error(tr('Keine Regel gefunden.'));
  const extra={titles:{},rationales:{}};
  for(const key of Object.keys(node)){
    if(key.startsWith('title_')) extra.titles[key.slice(6)]=String(node[key]);
    if(key.startsWith('rationale_')) extra.rationales[key.slice(10)]=String(node[key]);
  }
  const cooldown=node.cooldown||{},then=node.then||{};
  return {
    id:String(node.id||''),isNew:false,edited:false,mode:'guided',
    title:String(node.title||''),rationale:String(node.rationale||''),
    deficit:node.deficit?String(node.deficit):null,
    severity:String(node.severity||'nudge'),
    priority:typeof node.priority==='number'?node.priority:50,
    cooldownMinutes:typeof cooldown.minutes==='number'?cooldown.minutes:120,
    maxPerDay:typeof cooldown.max_per_day==='number'?cooldown.max_per_day:0,
    backoff:String(cooldown.backoff||'')==='exponential',
    action:String(then.action||'notify'),
    params:Object.assign({},then.params||{}),
    enabled:node.enabled!==false,
    extra,root:rootNode(node.when),raw:null,preview:null,parseError:null};
}
/* Der Wurzelknoten ist immer eine Gruppe — auch bei einer einzelnen
   Bedingung. So ist „eine zweite hinzufügen" ein Klick und kein Umbau. */
function rootNode(when){
  if(!when||typeof when!=='object') throw new Error(tr('Der Wenn-Teil fehlt.'));
  const node=condNode(when,false);
  return node.t==='group'?node:{t:'group',any:false,negated:false,children:[node]};
}
function condNode(map,negated){
  if(!map||typeof map!=='object') throw new Error(tr('Eine Bedingung ist leer.'));
  const key=Object.keys(map)[0];
  const value=map[key];
  if(key==='not') return condNode(value,!negated);
  if(key==='all'||key==='any') return {t:'group',any:key==='any',negated,
    children:(value||[]).map(child=>condNode(child,false))};
  const leaf=newLeaf();
  leaf.negated=negated;
  if(key==='time_between'){
    leaf.kind='time';
    leaf.from=String((value||[])[0]||'00:00');
    leaf.to=String((value||[])[1]||'00:00');
    return leaf;
  }
  if(key==='minutes_since'||key==='count_today'){
    const op=opOf(value);
    leaf.kind=key==='minutes_since'?'since':'count';
    leaf.event=String(value.event||'checkin');
    leaf.op=op;leaf.number=Number(value[op]);
    return leaf;
  }
  const op=opOf(value);
  const raw=value[op];
  const symbolic=((vocab&&vocab.symbolics)||[]).some(s=>s.id===key);
  if(symbolic||typeof raw!=='number'){
    leaf.kind='choice';leaf.variable=key;leaf.op=op;leaf.symbol=String(raw);
  }else{
    leaf.kind='number';leaf.variable=key;leaf.op=op;leaf.number=raw;
  }
  return leaf;
}
function opOf(value){
  if(!value||typeof value!=='object') throw new Error(tr('Ein Vergleich fehlt.'));
  const op=Object.keys(value).find(k=>OPS.includes(k));
  if(!op) throw new Error(tr('Unbekannter Vergleich in: {0}',[Object.keys(value).join(', ')]));
  return op;
}

function yamlParse(src){
  const lines=String(src).replace(/\t/g,'  ').split('\n').map(raw=>{
    const trimmed=raw.trim();
    return {raw,indent:raw.search(/\S/),blank:trimmed===''||trimmed[0]==='#'};
  });
  let i=0;
  const skip=()=>{while(i<lines.length&&lines[i].blank) i++};
  const isItem=line=>{
    const t=cutComment(line.raw).trim();
    return t==='-'||t.startsWith('- ');
  };

  function value(min){
    skip();
    if(i>=lines.length) return null;
    const line=lines[i];
    if(line.indent<min) return null;
    return isItem(line)?seq(line.indent):map(line.indent);
  }
  function seq(indent){
    const arr=[];
    for(;;){
      skip();
      if(i>=lines.length) break;
      const line=lines[i];
      if(line.indent!==indent||!isItem(line)) break;
      const rest=cutComment(line.raw).trim().slice(1).trim();
      if(rest===''){i++;arr.push(value(indent+1));continue}
      if(/^[^\s#{}[\]"',]+\s*:(\s|$)/.test(rest)){
        // Der Eintrag beginnt eine Abbildung in derselben Zeile.
        lines[i]={raw:' '.repeat(indent+2)+rest,indent:indent+2,blank:false};
        arr.push(map(indent+2));
      }else{i++;arr.push(flowParse(rest))}
    }
    return arr;
  }
  function map(indent){
    const obj={};
    for(;;){
      skip();
      if(i>=lines.length) break;
      const line=lines[i];
      if(line.indent<indent) break;
      if(isItem(line)&&line.indent===indent) break;
      if(line.indent>indent) throw new Error(tr('Die Einrückung passt nicht: {0}',[line.raw.trim()]));
      const text=cutComment(line.raw).trim();
      const m=text.match(/^([^:\s]+)\s*:\s*(.*)$/);
      if(!m) throw new Error(tr('Kein Schlüssel: {0}',[text]));
      const key=m[1],rest=m[2].trim();
      i++;
      if(rest===''){
        skip();
        const next=lines[i];
        obj[key]=(next&&next.indent===indent&&isItem(next))?seq(indent):value(indent+1);
      }else if(/^[|>][-+]?$/.test(rest)){
        obj[key]=blockScalar(indent,rest);
      }else obj[key]=flowParse(rest);
    }
    return obj;
  }
  function blockScalar(parentIndent,style){
    const folded=style[0]==='>';
    const parts=[];
    let base=null;
    while(i<lines.length){
      const line=lines[i];
      if(line.raw.trim()===''){parts.push('');i++;continue}
      if(line.indent<=parentIndent) break;
      if(base===null) base=line.indent;
      parts.push(line.raw.slice(base).replace(/\s+$/,''));
      i++;
    }
    while(parts.length&&parts[parts.length-1]==='') parts.pop();
    if(!folded) return parts.join('\n');
    let out='';
    for(const part of parts){
      if(part==='') out+='\n';
      else out+=(out&&!out.endsWith('\n')?' ':'')+part;
    }
    return out;
  }
  return value(0);
}
/* Ein `#` beginnt einen Kommentar nur am Zeilenanfang oder nach einem
   Leerzeichen — und nie innerhalb von Anführungszeichen. */
function cutComment(text){
  let quote=null;
  for(let k=0;k<text.length;k++){
    const c=text[k];
    if(quote){if(c===quote) quote=null;continue}
    if(c==='"'||c==="'"){quote=c;continue}
    if(c==='#'&&(k===0||/\s/.test(text[k-1]))) return text.slice(0,k);
  }
  return text;
}
function flowParse(text){
  const source=cutComment(text).trim();
  return readValue(source,0)[0];
}
function readValue(s,p){
  p=skipSpace(s,p);
  const c=s[p];
  if(c==='{'){
    const obj={};
    p++;
    for(;;){
      p=skipSpace(s,p);
      if(p>=s.length) throw new Error(tr('Klammer nicht geschlossen: {0}',[s]));
      if(s[p]==='}'){p++;break}
      let key;
      [key,p]=readKey(s,p);
      p=skipSpace(s,p);
      if(s[p]!==':') throw new Error(tr('Doppelpunkt fehlt: {0}',[s]));
      p++;
      let v;
      [v,p]=readValue(s,p);
      obj[key]=v;
      p=skipSpace(s,p);
      if(s[p]===',') p++;
    }
    return [obj,p];
  }
  if(c==='['){
    const arr=[];
    p++;
    for(;;){
      p=skipSpace(s,p);
      if(p>=s.length) throw new Error(tr('Klammer nicht geschlossen: {0}',[s]));
      if(s[p]===']'){p++;break}
      let v;
      [v,p]=readValue(s,p);
      arr.push(v);
      p=skipSpace(s,p);
      if(s[p]===',') p++;
    }
    return [arr,p];
  }
  if(c==='"'||c==="'") return readQuoted(s,p);
  let end=p;
  while(end<s.length&&',}]'.indexOf(s[end])<0) end++;
  return [plainScalar(s.slice(p,end).trim()),end];
}
function readKey(s,p){
  if(s[p]==='"'||s[p]==="'") return readQuoted(s,p);
  let end=p;
  while(end<s.length&&s[end]!==':') end++;
  return [s.slice(p,end).trim(),end];
}
function readQuoted(s,p){
  const quote=s[p++];
  let out='';
  while(p<s.length){
    const c=s[p];
    if(c==='\\'&&quote==='"'){out+=s[p+1]==='n'?'\n':s[p+1];p+=2;continue}
    if(c===quote){p++;break}
    out+=c;p++;
  }
  return [out,p];
}
const skipSpace=(s,p)=>{while(p<s.length&&/\s/.test(s[p])) p++;return p};
function plainScalar(text){
  if(text===''||text==='null'||text==='~') return null;
  if(text==='true') return true;
  if(text==='false') return false;
  if(/^-?\d+(\.\d+)?$/.test(text)) return Number(text);
  return text;
}

/* Heißt bewusst nicht mehr „helpDialog": „Hilfe" ist seit dem Reiter
   daneben die Bedienungsanleitung. Zwei Dinge mit demselben Namen sind
   zwei Dinge, die man verwechselt. */
function keysDialog(){
  const keys=[['n',tr('Erfassen')],['c',tr('Check-in')],['f',tr('Fokus starten oder beenden')],
    ['a',tr('Neue Aufgabe')],['g',tr('Angefangenes erledigen')],['h',tr('Hilfe')],
    ['1 … '+TABS.length,tr('Reiter wechseln')],['r',tr('Neu laden')],['?',tr('Diese Übersicht')],['Esc',tr('Schließen')]];
  sheet(tr('Tastenkürzel'),el('div',{class:'keys'},
    ...keys.map(([k,t])=>el('div',{},el('span',{},t),el('kbd',{},k)))),[],tr('Schließen'));
}
$('#keys-btn').addEventListener('click',keysDialog);
function openHelpTab(){
  const b=document.querySelector('#tabs button[data-tab="help"]');
  if(b) b.click();
}

$('#stop-btn').addEventListener('click',async()=>{
  if(!confirm(tr('Server beenden? Danach ist diese Seite nicht mehr erreichbar.'))) return;
  try{await api('/api/stop',{method:'POST'})}catch(e){}
  // Kein Wiederverbinden auf etwas, das gerade absichtlich zugeht.
  wsStop();
  // Gebaut statt zusammengeschrieben: Der Satz ist ein Nutzertext und muss
  // durch tr() — als Markup-Zeichenkette war er in jeder Sprache deutsch.
  put(document.body,el('div',{style:'display:grid;place-items:center;min-height:100vh'},
    el('p',{style:'color:var(--dim)'},
      tr('Der Server ist aus. Die App auf dem Telefon startet ihn wieder.'))));
});

/* ── Tastatur ────────────────────────────────────────────────────────
   Das kann ein Schreibtisch und eine Hand nicht. Ohne Kürzel bleibt das
   hier eine Webseite; mit ihnen ist es ein Werkzeug. */
addEventListener('keydown',e=>{
  // Ohne Sitzung gilt kein Kürzel. Auf der Freigabeseite ist nichts
  // fokussiert, also griffen sie alle: „f" las den Zustand, den es noch
  // nicht gab, „n" zog den Cursor in ein verstecktes Feld, und die Ziffern
  // klickten Reiter in der unsichtbaren Anwendung an — jeder Klick eine
  // Anfrage, die der Server mit 401 abweist. Dieselbe Bedingung wie in
  // `sync()`, damit es nur eine Wahrheit gibt.
  if($('#app').classList.contains('hide')) return;
  if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey) return;
  if($('#dlg').open) return;
  // Die Zifferntasten kommen aus TABS, nicht aus einer zweiten Liste: Sonst
  // zeigt die Taste irgendwann woandershin als der Reiter daneben.
  if(e.key>='1'&&e.key<='9'){
    const name=TABS[Number(e.key)-1];
    const b=name&&document.querySelector('#tabs button[data-tab="'+name+'"]');
    if(b) b.click();
    return;
  }
  switch(e.key){
    case 'n': e.preventDefault(); $('#cap-text').focus(); break;
    case 'c': checkinDialog(); break;
    case 'f': S?.focus?endFocusDialog():focusDialog(); break;
    case 'a': taskDialog(); break;
    case 'h': openHelpTab(); break;
    case 'r': reload(); break;
    case '?': keysDialog(); break;
    case 'g': {const run=(S?.running||[])[0]; if(run) act(run.id,'complete'); break}
  }
});

/* ── Takt ────────────────────────────────────────────────────────────
   Zwei verschiedene Dinge: Die Fokusuhr läuft im Sekundentakt weiter,
   ohne den Server zu fragen. Der Zustand wird alle 20 Sekunden geholt —
   häufiger wäre Last ohne Erkenntnis, seltener fühlte es sich tot an. */
setInterval(()=>{
  if(!S?.focus) return;
  const chip=$('#focus-chip b');
  if(!chip) return;
  chip.textContent=Math.floor((Date.now()-new Date(S.focus.startedAt))/60000)+'/'+S.focus.plannedMinutes+' min';
},1000);

/* Der Bestand wird mitgeholt, nicht nur der Zustand: Wer die Seite acht
   Stunden offen hat, sähe sonst neben aktuellen Messwerten eine Liste von
   heute früh — und das ist die schlechtere Hälfte von beidem.

   Nicht nachgeladen wird, solange ein Blatt offen ist, im Regeleditor
   gearbeitet wird oder der Cursor in einem Feld steht. Ein Neuzeichnen
   unter den Händen kostet mehr als eine Zahl, die eine Minute alt ist. */
async function sync(){
  if($('#app').classList.contains('hide')||$('#dlg').open||editor) return;
  const focused=document.activeElement;
  if(focused&&focused.matches&&focused.matches('input,textarea,select')) return;
  try{
    await refresh();
    // Nicht unter dem Zeiger: Wer gerade auf eine Karte zielt, träfe sonst
    // die, die eine Sekunde später an ihre Stelle gerückt ist. Die Zahlen
    // oben bleiben trotzdem frisch.
    if((tab==='tasks'||tab==='board')&&!$('#surface').matches(':hover')){
      tasks=(await api('/api/tasks')).tasks;
      paintTaskCount();redrawTasks();
    }
    lastSync=Date.now();
  }catch(e){}
}

/* ── Die Verbindung ──────────────────────────────────────────────────
   Das Telefon liegt in der Tasche. Fällt es aus dem WLAN, geht es in den
   Ruhezustand oder schaltet sich der Server nach dreißig Minuten Leerlauf
   ab, zeigte diese Seite bisher weiter Zahlen — und man hielt sie für
   aktuell. Eine sichtbar getrennte Oberfläche ist besser als eine, die
   falsch ist und richtig aussieht.

   Über den Kanal kommt nur ein Wort. Die Daten holt die Seite wie zuvor
   über die geprüften Routen; ein zweiter Weg an dieselben Daten wäre eine
   zweite Stelle, an der eine Prüfung fehlen kann. */
let ws=null,wsTries=0,wsTimer=null,wsWanted=false,lastSync=Date.now();

function linkChip(text,warn){
  const c=$('#link-chip');
  if(!c) return;
  c.className=warn?'chip warn':'chip';
  c.textContent=text;
}

function wsOpen(){
  if(!wsWanted) return;
  clearTimeout(wsTimer);
  // Die Adresse ergibt sich aus der Seite selbst. Eine getippte wäre eine
  // zweite Stelle, an der eine Portnummer altert.
  const url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';
  let sock;
  try{sock=new WebSocket(url)}catch(e){wsRetry();return}
  ws=sock;
  sock.onopen=()=>{
    if(sock!==ws) return;
    wsTries=0;
    linkChip(tr('Verbunden'),false);
    // Während der Trennung kann sich etwas geändert haben.
    sync();
  };
  // Was ankommt, ist ein Signal und kein Inhalt: nachladen, nicht auswerten.
  sock.onmessage=()=>sync();
  sock.onclose=e=>{
    if(sock!==ws) return;
    ws=null;
    // 1001 heißt: Der Server geht aus. Das ist Absicht, kein Problem — und
    // ein Wiederverbinden hätte kein Ziel.
    // Der Grund kommt so vom Server (`expert_server.dart`) und ist ein
    // Protokollwert, kein Nutzertext — deshalb nicht durch tr().
    if(e.code===1001||e.reason==='Server beendet'){
      wsWanted=false;
      linkChip(tr('Server beendet'),false);
      return;
    }
    // Kurzes Hakeln bekommt keine Warnfarbe: Ein Wechsel des Zugangspunkts
    // dauert Sekunden, und eine Anzeige, die dabei jedes Mal aufleuchtet,
    // wird ab dem dritten Mal nicht mehr gelesen.
    linkChip(wsTries<3?tr('Verbindet …'):tr('Getrennt'),wsTries>=3);
    wsRetry();
  };
  // Der Grund steht im darauffolgenden onclose, nicht hier.
  sock.onerror=()=>{};
}

function wsRetry(){
  if(!wsWanted) return;
  // 1 s, 2 s, 4 s … gedeckelt bei 30 s. Ohne Wachstum wäre es eine Anfrage
  // je Sekunde an ein Telefon, das gerade schläft; ohne Deckel wartete man
  // nach einer Nacht stundenlang auf den nächsten Versuch.
  const wait=Math.min(30000,1000*Math.pow(2,wsTries));
  wsTries++;
  clearTimeout(wsTimer);
  wsTimer=setTimeout(wsOpen,wait);
}

function wsStart(){wsWanted=true;wsTries=0;linkChip(tr('Verbindet …'),false);wsOpen()}
function wsStop(){
  wsWanted=false;
  clearTimeout(wsTimer);
  const sock=ws;ws=null;
  if(sock) try{sock.close()}catch(e){}
}

/* Der häufigste Fall von allen: Der Reiter lag im Hintergrund, das Telefon
   schlief. Bis zum nächsten Abstand zu warten hieße, auf eine Seite zu
   sehen, die längst wieder erreichbar ist. */
addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!wsWanted) return;
  if(!ws||ws.readyState>1){wsTries=0;wsOpen()}
});

/* Der Takt bleibt — als Rückfall, nicht als Hauptweg.
   Steht die Verbindung, meldet der Server jede Änderung sofort, und der
   Takt läuft nur noch etwa minütlich weiter: Was am Telefon geändert wird,
   geht nicht durch den Server und meldet sich deshalb nicht von selbst.
   Steht sie nicht, ist er wieder das Einzige, was frische Zahlen bringt. */
setInterval(()=>{
  if(ws&&ws.readyState===1&&Date.now()-lastSync<55000) return;
  sync();
},20000);

/* Erst die Sprache auf das Markup anwenden: Der Anmeldebildschirm steht
   schon da, bevor die erste Antwort kommt, und soll nicht auf Deutsch
   aufblitzen. Was hier gilt, ist die Browsersprache — die des Telefons
   kommt mit dem ersten Zustand. */
document.documentElement.lang=LANG;
localise(document);

/* Schon angemeldet? Dann direkt hinein, sonst die Freigabe anbieten. */
api('/api/state').then(async data=>{
  S=data;
  setLanguage(data.language);
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  markTabs();
  paintHeader();paintAction();paintCapline();
  await loadSurface();render();
  wsStart();
}).catch(()=>showGate());
</script>
