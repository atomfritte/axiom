<!--
  Expertenmodus — AXIOM am großen Bildschirm.

  Kein zweites AXIOM mit eigenem Geschmack, sondern dasselbe Instrument auf
  einer Fläche, die mehr trägt: dieselben acht Paletten aus tokens.dart,
  dieselben zwei Schriften aus dem App-Bündel, dieselbe Kapazitätslinie.
  Wer beide nebeneinander offen hat, soll keinen Bruch sehen.

  Dieselbe Zusage gilt seit dieser Runde auch für die Typografie, und sie
  kostete hier am meisten: Mono trägt nur noch die Regel-ID und wörtlich
  Abzutippendes, Messwerte laufen in der Hausschrift mit Tabellenziffern,
  gesperrte Versalien sind weg, und jeder Messwert hat dieselbe Farbe.
  Alles vier stand vorher anders da als in der App.

  Was hinzukommt, ist das, was ein Schreibtisch hergibt und eine Hand nicht:
  Bestand NEBEN der Handlung statt an ihrer Stelle, Tastenkürzel, Rohdaten.

  Was nicht hinzukommt, ist eine zweite Art zu entscheiden. Oben links steht
  genau eine Handlung, so wie auf dem Telefon (G1). Die Liste daneben ist
  Bestand, nicht Auswahl.

  Vollständig eigenständig: kein CDN, kein nachgeladenes Skript, keine
  fremde Schriftart. Das ist die Bedingung aus ADR-0005 — AXIOM ruft nichts
  von sich aus auf, und eine Seite, die eine Schrift von fremden Servern
  holt, täte genau das.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>AXIOM · Expertenmodus</title>
<!-- Dieselbe Marke wie im Kopf, ausgeliefert vom Server (`/favicon.svg`).
     Ohne sie steht im Reiter ein leeres Blatt, und wer AXIOM neben acht
     anderen Reitern offen hat, findet es am Symbol, nicht am Titel. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
/* ── Schriften ─────────────────────────────────────────────────────────
   Aus dem App-Bündel, ausgeliefert vom Server selbst.

   Hier stand: „Mono trägt jeden Messwert — eine Systemschrift an dieser
   Stelle macht aus einem abgelesenen Wert einen gemeinten." Die Folge war
   eine Seite in Schreibmaschine: Chips, Reiterzahlen, Pillen, Skalen,
   Zeitanker, Abschnittsmarken. Das einzige sachliche Argument dafür war,
   dass 61 und 88 untereinander fluchten — und genau das leistet
   `tabular-nums` in der Hausschrift (siehe `kTabularFigures` in
   tokens.dart). Mono bleibt für zwei Fälle, die keine Messwerte sind: die
   **Regel-ID** (`.stamp`, damit G2 auf jedem Schirm sofort zu finden ist)
   und **wörtlichen Text**, den man abtippt, vergleicht oder kopiert —
   YAML, Fehlerausgaben des Servers, PIN, Freigabezahl.

   Der 600er ist der Grad, in dem Überschriften und Marken stehen. Der
   Server liefert ihn heute nicht aus (`expert_server.dart` kennt nur 400
   und 500); die zweite Quelle fängt das auf, und zwar besser als eine
   fehlende Angabe: Ohne eine 600er-Fläche synthetisiert der Browser ein
   Fettschreiben aus dem Medium, und das sieht auf großen Graden schmierig
   aus. Kommt `sans-600.ttf` dazu, greift ohne weitere Änderung der echte
   Schnitt. */
@font-face{font-family:Plex;src:url(/font/sans-400.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/font/sans-500.ttf);font-weight:500;font-display:swap}
@font-face{font-family:Plex;src:url(/font/sans-600.ttf),url(/font/sans-500.ttf);font-weight:600;font-display:swap}
@font-face{font-family:PlexMono;src:url(/font/mono-400.ttf);font-weight:400;font-display:swap}
@font-face{font-family:PlexMono;src:url(/font/mono-500.ttf);font-weight:500;font-display:swap}

/* ── Paletten ──────────────────────────────────────────────────────────
   Wortgleich aus lib/design/tokens.dart, nicht nachempfunden.

   Eine einzige Rolle steht dort nicht: die Schrift auf der Signalfläche.
   Sie ist deshalb keine eigene Farbe, sondern die Seitenfarbe — in den
   dunklen Fassungen der größtmögliche Abstand zum Bernstein, in den hellen
   das Weiß der Frontplatte. So bleibt jeder Wert in dieser Datei einer aus
   tokens.dart, und ein siebter Farbwert kann nicht daneben altern. */
[data-scheme=instrument][data-mode=dark]{
  --base:#0E1113;--panel:#171B1E;--raised:#1F2529;--rule:#2A3237;
  --ink:#ECEAE4;--dim:#9BA4AB;--faint:#838D93;
  --signal:#E8A33D;--deep:#B8761F;--calm:#7FA88A;--caution:#CB754E;--info:#6E90A4;
  --on-signal:var(--base)}
[data-scheme=instrument][data-mode=light]{
  --base:#F2F1ED;--panel:#FFFFFF;--raised:#FAF9F6;--rule:#CFCCC4;
  --ink:#15181B;--dim:#4A545B;--faint:#62686E;
  --signal:#8E5D0F;--deep:#7A4E08;--calm:#3F6B4F;--caution:#9C4522;--info:#3E6072;
  --on-signal:var(--panel)}
/* Werkbank — die Vorgabe dieser Oberflaeche.
   Auf dem Telefon bleibt Instrument die Vorgabe; dort ist das Geraet
   nachts in der Hand. Hier ist es ein Monitor in einem hellen Raum, und
   der Bernstein liegt darauf als Braunschleier. */
:root,[data-scheme=workbench][data-mode=light],
[data-scheme=workbench]{
  --base:#F5F6FA;--panel:#FFFFFF;--raised:#F0F2F8;--rule:#DDE1EC;
  --ink:#20232C;--dim:#565E72;--faint:#626A7F;
  --signal:#0F62D6;--deep:#0A48A0;--calm:#14794C;--caution:#A9500F;--info:#6A3FBF;
  --on-signal:var(--panel)}
[data-scheme=workbench][data-mode=dark]{
  --base:#12141B;--panel:#1A1D26;--raised:#232733;--rule:#313648;
  --ink:#ECEEF5;--dim:#A0A7BB;--faint:#878EA1;
  --signal:#5A9BFF;--deep:#3570D4;--calm:#3FC98D;--caution:#E08C4A;--info:#A98BFF;
  --on-signal:var(--base)}
[data-scheme=contrast][data-mode=dark]{
  --base:#0A0C0E;--panel:#15191C;--raised:#1E2428;--rule:#3D474D;
  --ink:#F5F3EE;--dim:#C2C9CE;--faint:#9BA5AC;
  --signal:#FFBB55;--deep:#D08A28;--calm:#9CC7A6;--caution:#E08356;--info:#8FB3C7;
  --on-signal:var(--base)}
[data-scheme=contrast][data-mode=light]{
  --base:#FAFAF8;--panel:#FFFFFF;--raised:#F2F1ED;--rule:#B4B0A7;
  --ink:#0D1012;--dim:#3B4248;--faint:#5C666D;
  --signal:#7A4E08;--deep:#5C3A05;--calm:#2E5239;--caution:#7C3316;--info:#2B4757;
  --on-signal:var(--panel)}
[data-scheme=muted][data-mode=dark]{
  --base:#12100D;--panel:#1A1714;--raised:#221E1A;--rule:#332C26;
  --ink:#AF9B7C;--dim:#958978;--faint:#928777;
  --signal:#BD7A2D;--deep:#92652C;--calm:#70916D;--caution:#BD7852;--info:#7A8C92;
  --on-signal:var(--base)}
[data-scheme=muted][data-mode=light]{
  --base:#D9D4C6;--panel:#E4DCCB;--raised:#EEE3C5;--rule:#B7B1A4;
  --ink:#221E19;--dim:#56503F;--faint:#575146;
  --signal:#714A12;--deep:#6B450F;--calm:#3C5842;--caution:#7D4222;--info:#3C5561;
  --on-signal:var(--panel)}

/* Vier Stufen wie in der App — kein stufenloser Regler. Ein Regler ist
   eine Entscheidung mit unendlich vielen Antworten (G1). */
[data-size=s]{--scale:.9}[data-size=m]{--scale:1}
[data-size=l]{--scale:1.18}[data-size=xl]{--scale:1.38}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--scale,1))}
body{background:var(--base);color:var(--ink);
  font:400 1rem/1.55 Plex,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem}

/* ── Tabellenziffern ───────────────────────────────────────────────────
   Der einzige sachliche Grund für Monospace war, dass 61 und 88
   untereinander fluchten. Genau das leistet `tabular-nums` — in der
   Hausschrift, ohne Schreibmaschinenton. Es steht auf allem, was eine Zahl
   trägt oder tragen kann, damit eine Spalte nicht davon abhängt, ob die
   Werte gerade zweistellig sind.

   Ehrlichkeitshalber dasselbe wie in tokens.dart: Das gebündelte IBM Plex
   Sans führt gar keine Proportionalziffern, alle zehn sind gleich breit —
   die Angabe ändert heute nichts und hält die Zusage, sobald jemand die
   Schrift austauscht. */
.chip,.count,.cell,.pill,.num,.term,.kin,.meta span,.brk .num,.tog,
.capline text,.dial .val,.dial .ends span,.cond .now,.ev,.value .num,
.toc .num,#budget-txt,.mono{font-variant-numeric:tabular-nums}

/* Wörtlicher Text: YAML, Fehlerausgaben, Freigabezahl, PIN. Nichts davon
   ist ein Messwert — es sind Zeichen, auf die es einzeln ankommt. */
.mono{font-family:PlexMono,ui-monospace,monospace}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;
  padding:.7rem 1.25rem;background:color-mix(in srgb,var(--base) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:.5rem;font-weight:500;letter-spacing:.14em;font-size:.78rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
/* Kein `text-transform` und keine Sperrung mehr: KAPAZITÄT 62 · LAST 31 ·
   UNGEEICHT war eine Zeile Beipackzettel über der Oberfläche. Gesperrte
   Versalien sind langsamer zu lesen, weil die Wortform wegfällt — und
   gelesen wird die Zeile nur im Vorbeigehen. */
.chip{font-size:.74rem;padding:.28rem .55rem;
  border:1px solid var(--rule);border-radius:4px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.on{border-color:var(--signal);color:var(--signal)}
.chip.warn{border-color:var(--caution);color:var(--caution)}
.spacer{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{font-size:.74rem;padding:.3rem .55rem;
  color:var(--faint);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--signal)}
.seg button:hover{color:var(--ink)}
.budget{display:flex;align-items:center;gap:.45rem;min-width:8rem}
.budget .track{position:relative;flex:1;height:2px;background:var(--rule)}
.budget .fill{position:absolute;inset:0 auto 0 0;background:var(--signal)}
.budget.over .fill{background:var(--caution)}

main{max-width:1560px;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
@media(min-width:1080px){main{grid-template-columns:minmax(340px,26rem) 1fr;align-items:start}
  .rail{position:sticky;top:4.6rem}}
/* Ohne min-width:0 bemisst ein Grid-Feld sich am breitesten Inhalt statt am
   Platz. Eine waagerecht scrollende Spalte darin schöbe sonst die ganze
   Seite auseinander, statt selbst zu scrollen. */
.stack{min-width:0}
.rail{display:grid;gap:1rem;align-content:start}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:1.1rem}
.panel.accent{border-color:color-mix(in srgb,var(--signal) 55%,var(--rule))}
.panel.calm{border-color:color-mix(in srgb,var(--calm) 55%,var(--rule))}
/* Die Abschnittsmarke — dieselbe Rolle wie `textTheme.labelSmall` in der
   App: 13,5 px, w600, Sperrung 0,5 px, normale Schreibweise. Hier stand
   Monospace in gesperrten Versalien; sichtbar wurde daraus
   AKTIVIERUNGSENERGIE, ERFASSEN, GEWÄHLTE KLAMMER. Wer eine Marke setzt,
   schreibt jetzt „Nicht in Reichweite" und nicht „NICHT IN REICHWEITE". */
.eyebrow{font-size:.845rem;font-weight:600;line-height:1.3;letter-spacing:.037em;color:var(--faint)}
.sec{display:flex;align-items:center;gap:.75rem;margin:0 0 .7rem}
.sec .line{flex:1;height:1px;background:var(--rule)}
/* w600 statt w400 und optisch nachgezogen (≈ −0,028 × Größe): Große Grade
   in leichtem Schnitt wirken nicht ruhig, sondern blass, und die
   Vorbreiten der Schrift sind für Fließtext ausgelegt, nicht für 27 px. */
h1{font-size:1.7rem;font-weight:600;line-height:1.18;letter-spacing:-.028em}
h2{font-size:1.16rem;font-weight:600;line-height:1.3;letter-spacing:-.016em}
p{color:var(--dim);font-size:.9rem}
.faint{color:var(--faint);font-size:.8rem}
/* Die Regel-ID und sonst nichts. Sie ist damit das einzige technisch
   aussehende Stück eines Schirms und deshalb sofort zu finden — G2 wird
   dadurch lauter, nicht leiser. Was hier vorher noch stand („Start 4/10",
   eine Frist), sind Messwerte und tragen jetzt eine Pille. */
.stamp{display:inline-flex;align-items:center;gap:.35rem;font-family:PlexMono,monospace;font-size:.68rem;
  letter-spacing:.06em;font-weight:500;border:1px solid color-mix(in srgb,var(--info) 60%,transparent);
  color:var(--info);padding:.2rem .45rem;border-radius:4px}
/* Der Defizitschlüssel neben der Regel-ID (D3, D9). Derselbe Fall wie sie:
   ein Verweis, kein Wert — und in der App (`now_screen.dart`) steht er
   ebenso in Mono neben der Plakette. */
/* `align-self`, weil die Zeile eine Flexbox ist: Ohne die Angabe wird das
   Kästchen auf die Höhe der Plakette gedehnt und die zwei Zeichen kleben
   an ihrer Oberkante. */
.dcode{font-family:PlexMono,monospace;font-size:.68rem;letter-spacing:.06em;
  color:var(--faint);align-self:center}
.why{color:var(--dim);font-size:.85rem;border-left:2px solid var(--rule);padding-left:.75rem;margin:.85rem 0 0}
.row{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1.05rem}
.btn{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--rule);color:var(--ink);font-size:.88rem;
  transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--signal);color:var(--on-signal);border-color:var(--signal);font-weight:500}
.btn.primary:hover{background:var(--deep);border-color:var(--deep)}
.btn.quiet{border-color:transparent;color:var(--faint)}
.btn.quiet:hover{color:var(--ink)}
.btn.grow{flex:1 1 8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.capline{width:100%;height:76px;display:block;overflow:visible}
.capline .axis{stroke:var(--rule);stroke-width:1}
.capline .din{fill:var(--calm)}
.capline .dout{fill:none;stroke:var(--faint)}
.capline .dnow{fill:var(--signal)}
.capline .m{stroke:var(--signal);stroke-width:2}
/* LEICHT · HIER · SCHWER bleiben in Versalien, wo alles andere sie
   verloren hat — vier bis sechs Zeichen, und unter sieben liest man Formen
   statt Wörter. Hier soll ohnehin nichts gelesen, sondern verortet werden.
   Dieselbe Entscheidung wie in `capacity_line.dart`. */
.capline text{font-family:Plex,system-ui,sans-serif;font-size:9.5px;font-weight:500;
  fill:var(--faint);letter-spacing:.1em}

#cap-text{width:100%;min-height:4.2rem;resize:vertical;background:var(--raised);
  border:1px solid var(--rule);border-radius:4px;padding:.7rem .8rem;line-height:1.5}
#cap-text:focus{outline:none;border-color:var(--signal)}

.tabs{display:flex;gap:.15rem;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.tabs button{padding:.55rem .8rem;font-size:.85rem;color:var(--faint);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--signal)}
.tabs button:hover{color:var(--ink)}
.tabs .count{font-size:.78rem;color:var(--faint);margin-left:.35rem}

/* Bestandszeile für Eingang und Regelwerk. Dort steht Fließtext, und
   Fließtext braucht kein Raster. Die Aufgabenliste hat deshalb ihre eigene
   Form (`.rows` weiter unten): Dort fluchten Spalten. */
.item{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:.85rem;align-items:start;
  padding:.8rem 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--rule);min-height:2.1rem}
.item .title{font-size:.94rem;overflow-wrap:anywhere}
.meta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.2rem}
.meta span{font-size:.76rem;color:var(--faint)}
.meta .rid{font-family:PlexMono,monospace;letter-spacing:.06em}
.acts{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.acts .btn{padding:.32rem .58rem;font-size:.77rem}

/* ── Gruppen ───────────────────────────────────────────────────────────
   Ein Band, kein Strich. Der Bestand zerfällt in wenige Gruppen, und welche
   das ist, soll man im Vorbeigehen sehen statt lesen müssen — dafür ist die
   Fläche eines Bandes da und die eines Hairlines nicht.

   Farbe trägt genau zwei Messungen und sonst nichts: das Band die Gruppe,
   die Fristpille den Abstand zum Zeitpunkt. Keine Ampel. Grün gut und rot
   schlecht wäre ein Urteil über eine Aufgabe, und ein Urteil, das man beim
   Draufsehen mitliest, erzeugt Vermeidung statt Handlung (R7). „Nicht in
   Reichweite" bekommt deshalb die leiseste Farbe der Palette, nicht die
   lauteste — die Aufgabe ist nicht schlecht, sie ist heute zu schwer. */
.groups{display:grid;gap:1rem;overflow-x:auto}
.group{min-width:0;border-radius:0 5px 5px 0;
  border-left:3px solid color-mix(in srgb,var(--group,var(--rule)) 70%,var(--rule));
  background:color-mix(in srgb,var(--group,var(--rule)) 5%,transparent)}
.gband{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;
  padding:.55rem .75rem;border-radius:0 5px 0 0;
  background:color-mix(in srgb,var(--group,var(--rule)) 20%,var(--panel))}
.gband:hover{background:color-mix(in srgb,var(--group,var(--rule)) 30%,var(--panel))}
.gband .gname{font-size:.85rem;font-weight:500;overflow-wrap:anywhere}
.gband .gcount{margin-left:auto;flex:none;font-size:.7rem;color:var(--ink);border-radius:999px;
  padding:.05rem .5rem;background:color-mix(in srgb,var(--group,var(--rule)) 38%,var(--panel))}
/* Dreieck aus Rändern statt Schriftzeichen: Es dreht sich, wächst in rem
   mit der Textgröße mit und setzt keine Schrift voraus, die es enthält. */
.caret{flex:none;width:0;height:0;border:.3rem solid transparent;
  border-left-color:currentColor;transition:transform .12s}
.gband[aria-expanded=true] .caret{transform:rotate(90deg)}
.gadd{display:block;width:100%;text-align:left;padding:.5rem .75rem;font-size:.8rem;
  color:color-mix(in srgb,var(--group,var(--ink)) 70%,var(--ink))}
.gadd:hover{background:color-mix(in srgb,var(--group,var(--rule)) 14%,transparent)}
.empty{color:var(--faint);font-size:.78rem;padding:.5rem .75rem;grid-column:1/-1}

/* ── Aufgabenliste ─────────────────────────────────────────────────────
   Alle Zeilen einer Gruppe teilen sich ein Raster, damit die Werte
   senkrecht fluchten: Man scannt dann eine Spalte, statt jede Zeile einzeln
   zu lesen. Keine festen Spaltenbreiten — feste Breiten sind das, was bei
   2,4-facher Schrift überläuft. Reicht der Platz nicht, scrollt die Gruppe
   waagerecht in ihrem eigenen Kasten, so wie eine breite Tabelle in der
   Hilfe. */
.rows{display:grid;grid-template-columns:minmax(7rem,1fr) auto auto;padding:0 .75rem}
.trow{display:grid;grid-column:1/-1;grid-template-columns:subgrid;gap:.85rem;
  align-items:start;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.trow:hover{background:color-mix(in srgb,var(--raised) 70%,transparent)}
.trow .title{font-size:.94rem;overflow-wrap:anywhere}
.trow.run .title{color:var(--calm)}
.trow.done .title{color:var(--faint);text-decoration:line-through}
/* Der Titel führt in die Detailansicht — der Ort, an dem eine Aufgabe
   vollständig existiert. Deshalb ist er ein Knopf und sieht auch so aus. */
.tlink{display:block;width:100%;text-align:left;padding:0;overflow-wrap:anywhere}
.tlink:hover{color:var(--signal)}
.kin{display:block;font-size:.76rem;color:var(--faint);
  overflow-wrap:anywhere;margin-top:.15rem}
.cells{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;min-width:0}
.cell{font-size:.76rem;color:var(--faint);white-space:nowrap}
.pill{font-size:.74rem;white-space:nowrap;
  padding:.2rem .5rem;border-radius:999px;color:var(--dim);
  background:color-mix(in srgb,var(--rule) 55%,transparent)}
/* Der Anlauf ist ein Messwert und trägt deshalb die Messfarbe. Hier stand
   `--info` — daneben die Frist in Bernstein und die Kapazität oben in
   einem dritten Ton. Drei Farben für drei Messungen an derselben Aufgabe
   lesen sich als drei verschiedene Urteile über sie, und genau das
   verbietet R7. Unterschieden wird über Beschriftung und Ort. */
.pill.ae{background:color-mix(in srgb,var(--signal) 12%,transparent);color:var(--signal)}
/* Dieselbe Rampe wie früher am Strich, jetzt in der Pille: der Abstand zu
   decayAt, sonst nichts. Ohne Frist und jenseits von drei Tagen bleibt sie
   neutral, und an etwas Erledigtem steht sie gar nicht — „überfällig" an
   etwas, das getan ist, wäre ein Vorwurf für nichts. */
.pill.due[data-due=days]{background:color-mix(in srgb,var(--signal) 14%,transparent)}
.pill.due[data-due=day]{background:color-mix(in srgb,var(--signal) 26%,transparent);color:var(--signal)}
.pill.due[data-due=over]{background:color-mix(in srgb,var(--caution) 24%,transparent);color:var(--caution)}
@media(max-width:760px){.rows{grid-template-columns:minmax(0,1fr)}.trow{gap:.4rem}}

/* ── Klammern als Leiste über dem Bestand ──────────────────────────────
   Eine zerlegte Aufgabe ist keine Spalte. „In Reichweite" misst die
   Kapazität von heute; „zerlegt" ist eine bauliche Tatsache. Zwei Achsen in
   einer Reihe zu stapeln hieße, dieselbe Aufgabe zweimal zu zeigen oder
   einmal falsch einzuordnen. Die Klammern stehen deshalb über dem Bestand
   und filtern ihn, statt in ihm zu stehen.

   Die Wahl hängt bewusst nicht am Browser-Speicher: Ein Filter, der nach
   dem Schließen des Fensters noch greift, versteckt Aufgaben, ohne dass zu
   sehen ist, warum. */
.brackets{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:0 0 .9rem}
.crumb{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;width:100%}
.crumb .sep{color:var(--faint);font-size:.8rem}
.brk{display:inline-flex;align-items:center;gap:.4rem;max-width:100%;text-align:left;
  padding:.34rem .62rem;border-radius:999px;font-size:.8rem;overflow-wrap:anywhere;
  border:1px solid var(--rule);background:var(--raised);color:var(--dim)}
.brk:hover{color:var(--ink);border-color:var(--dim)}
.brk[aria-pressed=true]{border-color:var(--signal);color:var(--signal);
  background:color-mix(in srgb,var(--signal) 12%,var(--raised))}
.brk .num{font-size:.76rem;color:var(--faint)}
.brk[aria-pressed=true] .num{color:var(--signal)}
/* Die gewählte Klammer selbst — mit ihren eigenen Handlungen. An sie kam
   man vorher nicht heran: Sie stand als Karte zwischen ihren Schritten
   oder gar nicht. */
.bhead{border:1px solid var(--rule);border-left:3px solid var(--signal);border-radius:5px;
  background:var(--raised);padding:.75rem .9rem;margin:0 0 1rem;display:grid;gap:.5rem}
.bhead .title{font-size:1rem;font-weight:500}
.bhead .acts{justify-content:flex-start}

/* ── Board ─────────────────────────────────────────────────────────────
   Dieselben Gruppen, nebeneinander statt untereinander. Die Liste
   beantwortet „was zuerst", das Board „wie viel wovon" — die Bestandsfrage,
   für die man sonst scrollt.

   Kein Ziehen zwischen den Spalten: Eine Spalte ist hier eine Messung und
   kein Ablagefach. Etwas hineinzuziehen hieße, die Kapazität von heute von
   Hand zu übergehen — also genau die Zahl, wegen der das Board überhaupt
   sortiert.

   Schmal untereinander, breit nebeneinander und waagerecht scrollbar. Die
   Spaltenbreite steht in rem und wächst mit der Schrift mit: Bei 2,4-facher
   Größe wird die Spalte breiter, statt den Text abzuschneiden. */
.board{display:flex;flex-direction:column;gap:.9rem}
@media(min-width:720px){
  .board{flex-direction:row;align-items:flex-start;overflow-x:auto;
    padding-bottom:.7rem;scroll-snap-type:x proximity}
  .board .group{flex:0 0 17rem;scroll-snap-align:start}
  .board .group.shut{flex:0 0 auto}
}
.board.flat{display:block}
.cards{display:flex;flex-direction:column;gap:.5rem;padding:.5rem}

/* Dieselbe Rampe wie in der Liste, nur an der Kante statt in der Pille. */
.card{background:var(--raised);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:5px;padding:.55rem .65rem}
.card[data-due=over]{border-left-color:var(--caution)}
.card[data-due=day]{border-left-color:var(--signal)}
.card[data-due=days]{border-left-color:color-mix(in srgb,var(--signal) 45%,var(--rule))}
.card .title{font-size:.86rem;line-height:1.35}
.card.run .title{color:var(--calm)}
.card.done .title{color:var(--faint);text-decoration:line-through}
.card .cells{margin-top:.35rem}
.card .acts{justify-content:flex-start;margin-top:.45rem}
.card .acts .btn{padding:.26rem .5rem;font-size:.72rem}

/* ── Filterzeile und Umschalter ───────────────────────────────────────
   Drei Filter, kein Baukasten. Jeder weitere wäre eine Entscheidung mehr
   vor der Arbeit statt in ihr (G1, D3). */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.filters input[type=search]{flex:1 1 12rem;min-width:7rem;width:auto}
.tog{font-size:.8rem;padding:.4rem .65rem;
  border:1px solid var(--rule);border-radius:4px;color:var(--faint);white-space:nowrap}
.tog[aria-pressed=true]{border-color:var(--signal);color:var(--signal)}
.tog:hover{color:var(--ink)}

/* ── Regeleditor ───────────────────────────────────────────────────── */
.ed{display:grid;gap:1.35rem}
.step{display:grid;gap:.5rem}
.pick{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.pick .btn{padding:.32rem .6rem;font-size:.78rem}
.cond{border:1px solid var(--rule);border-radius:5px;padding:.6rem .7rem;
  background:var(--raised);margin-bottom:.5rem}
.cond.grp{background:transparent;border-style:dashed}
.cond .top{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.cond .fields{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.cond .now{font-size:.78rem;color:var(--faint);margin-top:.45rem}
.slim{width:auto;max-width:100%;min-width:5rem}
.hint{color:var(--faint);font-size:.78rem}

.dial{margin:0 0 1.05rem}
.dial .head{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.dial .val{color:var(--signal);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:.5rem 0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;
  border-radius:50%;background:var(--signal);border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--signal);
  border:2px solid var(--panel)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],
input[type=search],input[type=time],textarea,select{
  background:var(--raised);border:1px solid var(--rule);border-radius:4px;padding:.5rem .65rem;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--signal)}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:.3rem}
.field{margin-bottom:.9rem}

.value{padding:.85rem 0;border-bottom:1px solid var(--rule)}
.value:last-child{border-bottom:0}
.value.can{cursor:pointer}
.value .head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
/* **Eine Messfarbe für alle Messwerte.** Kapazität, Kompensationslast und
   Reizbedarf stehen hier untereinander; in drei Farben gelesen wären das
   drei verschiedene Urteile über denselben Menschen (R7). Sie tragen
   deshalb ausnahmslos `--signal`, so wie `InstrumentBar` in der App.
   Farbe unterscheidet nur noch Messung von Zustand. */
.value .num{font-size:1.32rem;font-weight:600;color:var(--signal);letter-spacing:-.02em}
.value .track{height:2px;background:var(--rule);margin:.45rem 0 .1rem;position:relative}
.value .fill{position:absolute;inset:0 auto 0 0;background:var(--signal)}
/* Die beiden Enden einer Skala — hier und an jedem Regler des Check-ins,
   deshalb eine Regel und nicht zwei (vorher stand dasselbe noch einmal
   unter `.dial`).

   An der Kapazität stehen sie nicht für „niedrig/hoch", sondern für das,
   was AXIOM mit der Zahl **tut**: dieselbe Zahl, aber eine Aussage über das
   System statt über den Nutzer (R7). */
.ends{display:flex;justify-content:space-between;gap:1rem;margin-top:.25rem}
.ends span{font-size:.78rem;color:var(--faint)}
.terms{margin-top:.5rem;display:none}
.value.open .terms{display:block}
.term{display:flex;justify-content:space-between;gap:1rem;font-size:.8rem;
  color:var(--faint);padding:.15rem 0}
.term b{color:var(--dim);font-weight:400}

textarea.code{font-family:PlexMono,monospace;font-size:.8rem;min-height:19rem;line-height:1.55;tab-size:2}
/* Der Ereignisstrom. Der Zeitanker ist ein Messwert und läuft in der
   Hausschrift mit Tabellenziffern; der Typ (`capture`, `checkin`) und die
   Nutzlast sind Maschinentext, den man liest wie er dasteht — dort bleibt
   Mono, weil dort das einzelne Zeichen zählt. Derselbe Streifen trägt im
   Review Regel-ID, Urteil und Begründung: die ID ist `.k` und damit
   ebenfalls Mono, der begründende Satz nicht. */
.ev{display:grid;grid-template-columns:auto auto 1fr;gap:.7rem;font-size:.8rem;
  padding:.32rem 0;border-bottom:1px solid color-mix(in srgb,var(--rule) 45%,transparent)}
.ev .t{color:var(--faint)}
.ev .k{color:var(--info);font-family:PlexMono,monospace;font-size:.74rem}
.ev .p{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Hilfe ─────────────────────────────────────────────────────────────
   Kapitelliste und Kapitel nebeneinander — das ist der eine Vorteil dieser
   Fläche gegenüber dem Telefon, wo man für jeden Sprung zurück muss.

   Umbruch über flex-wrap statt über eine Breitenabfrage: Bei 2,4-facher
   Schrift sind 13rem keine 208 Pixel mehr, sondern 500. Eine Abfrage in
   Pixeln ließe dann zwei Spalten stehen, die nicht mehr hineinpassen; der
   Umbruch rechnet mit dem, was der Inhalt tatsächlich braucht. */
.help{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:flex-start}
.help .toc{flex:0 1 13rem;min-width:0;display:grid;gap:.3rem;align-content:start}
.help .chapter{flex:1 1 22rem;min-width:0}
.toc .seg{margin-bottom:.2rem}
.toc button.ch{display:block;width:100%;text-align:left;font-size:.86rem;color:var(--dim);
  padding:.35rem .5rem;border-left:2px solid transparent;border-radius:3px;overflow-wrap:anywhere}
.toc button.ch:hover{color:var(--ink)}
.toc button.ch[aria-current=true]{color:var(--ink);background:var(--raised);border-left-color:var(--signal)}
.toc .num{font-size:.78rem;color:var(--faint);margin-right:.45rem}
.toc .hit{display:block;font-size:.72rem;color:var(--faint);margin-top:.15rem;overflow-wrap:anywhere}

/* Lesebreite in rem: Sie wächst mit der Schrift mit, statt bei großer
   Schrift zwei Wörter je Zeile stehen zu lassen. */
/* Ein Pfad oder ein Bezeichner ohne Leerzeichen ist länger als jede
   Spalte. Ohne diese Zeile schöbe er die Seite auf, statt umzubrechen. */
.md{max-width:46rem;overflow-wrap:break-word}
.md h1{margin:.1rem 0 .8rem}
.md h2{margin:1.7rem 0 .5rem}
.md h3{font-size:.95rem;font-weight:500;color:var(--dim);margin:1.2rem 0 .4rem}
.md p{margin:0 0 .8rem;font-size:.92rem}
.md ul,.md ol{margin:0 0 .9rem;padding-left:1.3rem;color:var(--dim);font-size:.92rem}
.md li{margin-bottom:.3rem}
.md blockquote{border-left:2px solid var(--signal);padding-left:.85rem;margin:0 0 .9rem;
  color:var(--ink);font-size:.92rem}
.md code{font-family:PlexMono,monospace;font-size:.85em;background:var(--raised);
  border:1px solid var(--rule);border-radius:3px;padding:.05rem .3rem;overflow-wrap:anywhere}
/* Eine breite Tabelle scrollt in ihrem eigenen Kasten. Ohne das schöbe sie
   die ganze Seite auseinander — derselbe Grund wie bei .stack. */
.md .scroll{overflow-x:auto;margin:0 0 .9rem}
.md table{border-collapse:collapse;font-size:.86rem}
.md th,.md td{border:1px solid var(--rule);padding:.35rem .6rem;text-align:left;vertical-align:top}
.md th{background:var(--raised);color:var(--ink);font-weight:500}
.md td{color:var(--dim)}
.md figure{margin:0 0 1.1rem;max-width:30rem;background:var(--raised);
  border:1px solid var(--rule);border-radius:5px;padding:.5rem}
.md figure img{display:block;width:100%;height:auto;border-radius:3px}
.md figcaption{color:var(--faint);font-size:.76rem;margin-top:.45rem}
.md img{max-width:100%;height:auto}
.md .lnk{color:var(--signal);font-size:inherit;padding:0;
  text-decoration:underline;text-underline-offset:2px}
.md .lnk:hover{color:var(--deep)}

/* `margin:auto` steht hier, weil es der Reset genommen hat.
   Ein <dialog> mit showModal() zentriert der Browser ueber genau dieses
   margin aus seinem eigenen Stylesheet — und `*{margin:0}` weiter oben
   setzt es zurueck. Folge: Jedes Blatt klebte links oben in der Ecke. */
dialog{margin:auto;border:1px solid var(--rule);border-radius:10px;
  background:var(--panel);color:var(--ink);box-shadow:0 18px 48px rgba(0,0,0,.28);
  padding:1.4rem;width:min(34rem,calc(100vw - 2rem));max-height:86vh;overflow:auto}
/* Die Detailansicht trägt mehr als ein Regler-Blatt: Baum, Blocker,
   Ereignisstrom. Sie bekommt deshalb Breite, aber keine eigene Fläche —
   eine zweite Seite wäre ein zweiter Ort mit eigenem Zustand. */
dialog.wide{width:min(46rem,calc(100vw - 2rem))}
dialog::backdrop{background:color-mix(in srgb,var(--base) 72%,transparent);backdrop-filter:blur(3px)}
dialog h2{margin-bottom:.9rem}

/* ── Detailansicht ──────────────────────────────────────────────────── */
.sheet{display:grid;gap:1.15rem}
.sheet .sec{margin:0 0 .45rem}
.tree{display:grid;gap:.22rem}
.tree .node{display:flex;gap:.5rem;align-items:baseline;width:100%;text-align:left;
  font-size:.85rem;color:var(--dim);padding:.32rem .5rem;border-radius:3px;
  border-left:2px solid var(--rule);overflow-wrap:anywhere}
.tree .node:hover{color:var(--ink);background:var(--raised)}
.tree .node.done{color:var(--faint);text-decoration:line-through}
.tree .node .cell{margin-left:auto;flex:none}
.tree .node .tlink{width:auto;font-size:.85rem}
.tree .drop{margin-left:auto;flex:none;padding:.32rem .5rem;font-size:.72rem;color:var(--faint)}
.tree .drop:hover{color:var(--caution)}
.picks{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}
.picks .btn{padding:.3rem .55rem;font-size:.78rem}
/* Der Kreis wird gezeigt, nicht bloß abgelehnt: „Geht nicht" ohne Grund
   ist in diesem System der teuerste Fehlermodus. */
.cycle{margin-top:.6rem;border:1px solid color-mix(in srgb,var(--caution) 55%,var(--rule));
  border-radius:5px;padding:.6rem .7rem}
/* Der Kreis steht als Kette von Aufgabentiteln da, nicht als Ausdruck —
   also Hausschrift. Mono hätte hier so getan, als wäre die Kette etwas zum
   Abtippen. */
.cycle .path{font-size:.82rem;color:var(--caution);
  margin-top:.35rem;overflow-wrap:anywhere}
/* Die Taste bleibt in Mono: Sie ist kein Messwert, sondern ein Zeichen, das
   gedrückt wird — dasselbe wie ein Befehl, den man abtippt. */
kbd{font-family:PlexMono,monospace;font-size:.7rem;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:.05rem .32rem;color:var(--dim)}
.keys{display:grid;gap:.4rem}
.keys div{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem}

#toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1rem);
  background:var(--raised);border:1px solid var(--rule);border-radius:5px;padding:.6rem 1rem;
  font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

#gate{display:grid;place-items:center;min-height:100vh;padding:1.5rem}
#gate .panel{width:min(24rem,100%)}
/* Beide bleiben in Mono, obwohl sie Zahlen sind: Sie werden nicht
   abgelesen, sondern abgetippt und Ziffer für Ziffer mit dem Telefon
   verglichen. Genau da trägt Monospace Information statt Stimmung — und
   die App zeigt PIN und Fingerabdruck aus demselben Grund so
   (`expert_screen.dart`). */
#pin{font-family:PlexMono,monospace;font-size:1.5rem;letter-spacing:.45rem;text-align:center}
#match{font-family:PlexMono,monospace;font-size:3.4rem;font-weight:500;letter-spacing:.2em;
  color:var(--signal);text-align:center;padding:1rem 0}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<!-- ── Anmeldung ────────────────────────────────────────────────────── -->
<div id="gate">
  <div class="panel">
    <div class="mark" style="margin-bottom:1.1rem">
      <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true">
        <path d="M3 13h7M12 13h7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 4v15" stroke="var(--signal)" stroke-width="3"/></svg>AXIOM
    </div>

    <div id="gate-push">
      <p class="faint" data-t="Auf dem Telefon erscheint gleich eine Zahl. Stimmt sie mit der hier überein, gibst du dort frei — sonst nicht.">Auf dem Telefon erscheint gleich eine Zahl. Stimmt sie mit der hier überein, gibst du dort frei — sonst nicht.</p>
      <div id="match">··</div>
      <p id="push-msg" class="faint" style="min-height:1.2rem;text-align:center"></p>
      <button class="btn quiet" id="use-pin" style="width:100%" data-t="Stattdessen PIN eingeben">Stattdessen PIN eingeben</button>
    </div>

    <div id="gate-pin" class="hide">
      <p class="faint" style="margin-bottom:.8rem" data-t="Die PIN steht in der App. Sie gilt nur für diesen Start.">Die PIN steht in der App. Sie gilt nur für diesen Start.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6"
             placeholder="······" aria-label="PIN">
      <p id="gate-msg" class="faint" style="margin-top:.6rem;min-height:1.2rem"></p>
      <button class="btn primary" id="gate-go" style="width:100%;margin-top:.4rem" data-t="Anmelden">Anmelden</button>
      <button class="btn quiet" id="use-push" style="width:100%;margin-top:.3rem" data-t="Zurück zur Freigabe">Zurück zur Freigabe</button>
    </div>
  </div>
</div>

<!-- ── Anwendung ────────────────────────────────────────────────────── -->
<div id="app" class="hide">
  <header>
    <div class="mark">
      <svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true">
        <path d="M3 13h7M12 13h7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 4v15" stroke="var(--signal)" stroke-width="3"/></svg>AXIOM
    </div>
    <div class="chips" id="hchips"></div>
    <!-- Verbunden oder nicht. Ohne diese Anzeige sieht eine Seite mit
         Zahlen von vorhin genauso aus wie eine mit aktuellen — und das ist
         die schlimmste Variante. -->
    <span class="chip" id="link-chip" role="status"
          data-t-title="Verbindung zum Telefon" title="Verbindung zum Telefon">Verbindet …</span>
    <div class="spacer"></div>
    <div class="budget" id="budget"
         data-t-title="Zeit im System heute (G4). Gezählt wird, solange dieser Reiter sichtbar und im Vordergrund ist."
         title="Zeit im System heute (G4). Gezählt wird, solange dieser Reiter sichtbar und im Vordergrund ist.">
      <!-- „Meta" lautet in beiden Sprachen gleich und braucht deshalb keine
           Fassung — ein Eintrag, der sich selbst übersetzt, wäre einer, den
           die Übersetzungsprüfung eigens ausnehmen müsste. -->
      <span class="eyebrow">Meta</span>
      <span class="track"><span class="fill" id="budget-fill"></span></span>
      <span style="font-size:.76rem" id="budget-txt">–</span>
    </div>
    <!-- Die Schalter tragen dieselben Namen wie `AxiomScheme` und
         `TextSize` in tokens.dart — dort steht „Instrument", „Kontrast",
         „Gedämpft", „Werkbank", und nicht INSTRUMENT. -->
    <div class="seg" role="group" data-t-label="Helligkeit" aria-label="Helligkeit">
      <button data-mode="auto" data-t="Auto">Auto</button><button data-mode="dark" data-t="Dunkel">Dunkel</button><button data-mode="light" data-t="Hell">Hell</button>
    </div>
    <div class="seg" role="group" data-t-label="Farbschema" aria-label="Farbschema">
      <button data-scheme="workbench" data-t="Werkbank">Werkbank</button><button data-scheme="instrument" data-t="Instrument">Instrument</button><button data-scheme="contrast" data-t="Kontrast">Kontrast</button><button data-scheme="muted" data-t="Gedämpft">Gedämpft</button>
    </div>
    <div class="seg" role="group" data-t-label="Textgröße" aria-label="Textgröße">
      <button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button><button data-size="xl">XL</button>
    </div>
    <button class="btn quiet" id="keys-btn" data-t-title="Tastenkürzel (?)" title="Tastenkürzel (?)">?</button>
    <button class="btn quiet" id="stop-btn" data-t-title="Server beenden" title="Server beenden" data-t="Beenden">Beenden</button>
  </header>

  <main>
    <div class="rail">
      <section class="panel accent" id="act" aria-live="polite"></section>

      <section class="panel">
        <div class="sec"><span class="eyebrow" data-t="Erfassen">Erfassen</span><span class="line"></span><kbd>n</kbd></div>
        <textarea id="cap-text" data-t-ph="Was ist dir eingefallen?" placeholder="Was ist dir eingefallen?"
                  data-t-label="Erfassen" aria-label="Erfassen"></textarea>
        <div class="row">
          <button class="btn primary grow" id="cap-save" data-t="Speichern">Speichern</button>
          <button class="btn" id="checkin-btn" data-t-title="Check-in (c)" title="Check-in (c)" data-t="Check-in">Check-in</button>
        </div>
        <p class="faint" style="margin-top:.5rem" data-t="Ohne Rückfrage, ohne Kategorie. Sortiert wird später.">Ohne Rückfrage, ohne Kategorie. Sortiert wird später.</p>
      </section>

      <section class="panel">
        <div class="sec"><span class="eyebrow" data-t="Aktivierungsenergie">Aktivierungsenergie</span><span class="line"></span>
          <span class="cell" style="color:var(--signal)" id="cap-label">–</span></div>
        <svg class="capline" id="capline" viewBox="0 0 320 76" preserveAspectRatio="none"
             role="img" data-t-label="Kapazitätslinie" aria-label="Kapazitätslinie"></svg>
        <p class="faint" id="cap-note" style="margin-top:.4rem"></p>
      </section>
    </div>

    <div class="stack">

/* ── Sprache ─────────────────────────────────────────────────────────
   Dieselbe Regel wie in der App: Der deutsche Satz IST der Schlüssel.
   `tr('Anfangen')` steht im Quelltext, die englische Fassung
   in EN weiter unten. Sie heißt `tr` und nicht `t` wie in Dart, weil `t`
   in dieser Datei durchgängig eine Aufgabe ist (`t.title`, `t.state`) —
   eine gleichnamige Funktion wäre in genau den Bausteinen verdeckt, die
   am meisten Text erzeugen. Der Grund ist derselbe — der Ton entscheidet über
   die Wirkung, und diese Entscheidung muss dort lesbar sein, wo sie
   getroffen wird, nicht hinter einem Bezeichner wie `now.emptyTitle`.

   Werte kommen als `{0}`, nicht als Bruchstücke: `tr('{0} startbar', [n])`
   statt `n+' startbar'`. Ein zusammengeklebter Satz lässt sich nicht
   übersetzen, ohne die Wortstellung der einen Sprache zu erzwingen.

   Welche Sprache gilt, sagt das Telefon (`/api/state`) — nicht der
   Browser. Die Wahl in der App ist eine Entscheidung des Nutzers; die
   Browsersprache ist die Voreinstellung eines Arbeitsrechners und sagt
   darüber nichts. Bis die erste Antwort da ist — also auf dem
   Anmeldebildschirm — gilt der Browser als beste verfügbare Vermutung. */
let LANG=(navigator.language||'en').toLowerCase().startsWith('de')?'de':'en';

function tr(de,args){
  const s=LANG==='de'?de:(EN[de]!==undefined?EN[de]:de);
  return args?s.replace(/\{(\d+)\}/g,(m,i)=>args[i]!==undefined?args[i]:m):s;
}

/* Setzt die Sprache und zeichnet neu, wenn sie sich geändert hat. */
function setLanguage(code){
  const next=code==='de'?'de':'en';
  if(next===LANG) return false;
  LANG=next;
  document.documentElement.lang=next;
  // Die Hilfe folgt der Oberfläche, solange dort niemand ausdrücklich
  // gewählt hat. Vorher stand sie fest auf Deutsch: englische Reiter,
  // englisches Suchfeld — und ein deutsches Kapitel dazwischen, obwohl
  // beide Fassungen im Bündel liegen.
  if(!localStorage.getItem('axiom.help.lang')) helpLang=next;
  localise(document);
  return true;
}

/* Übersetzt festen Text im Markup.

   Trägt ein Element `data-t`, wird sein Textinhalt ersetzt; `data-t-title`,
   `data-t-ph` und `data-t-label` tun dasselbe für title, placeholder und
   aria-label. Der deutsche Satz steht dabei im Attribut und ist damit auch
   im Markup der Schlüssel — dieselbe Regel wie im Skript. */
function localise(root){
  root.querySelectorAll('[data-t]').forEach(n=>{n.textContent=tr(n.dataset.t)});
  for(const [sel,prop,attr] of [['[data-t-title]','tTitle','title'],
                                ['[data-t-ph]','tPh','placeholder'],
                                ['[data-t-label]','tLabel','aria-label']])
    root.querySelectorAll(sel).forEach(n=>n.setAttribute(attr,tr(n.dataset[prop])));
}

let toastTimer;
function toast(m){const box=$('#toast');box.textContent=m;box.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('on'),3200)}

/* ── Was als Zeit im System zählt ────────────────────────────────────
   Der Server bucht den Abstand zwischen zwei angemeldeten Anfragen auf
   das Meta-Budget (G4). Die Seite fragt aber von selbst weiter, auch aus
   einem Reiter, den seit Stunden niemand ansieht — gemessen wurde damit
   Laufzeit, nicht Nutzung. 115 von 12 Minuten an einem Tag, an dem hier
   niemand war, und ein Deckel, der falsch misst, ist schlimmer als
   keiner: Er gewöhnt einen daran, die eine Zahl zu übergehen, die G4
   durchsetzen soll.

   Den Expertenmodus dafür auszunehmen wäre die falsche Abhilfe. Er ist
   die Fläche, auf der sich am leichtesten Stunden am System statt an der
   Arbeit verbringen lassen (D3, R1) — nähme man ihn heraus, ließe sich
   das ganze Meta-Work hierher verlagern, und das Telefon meldete
   ungerührt 3/12. Gezählt wird deshalb Aufmerksamkeit statt Laufzeit:
   sichtbar, im Vordergrund, und seit weniger als fünf Minuten eine
   Regung.

   Jede Bedingung ist so geschrieben, dass ein fehlender Browserdienst zum
   Zählen führt, nicht zum Schweigen. Ein Fehler hier darf zu viel buchen;
   er darf den Deckel nicht stillegen. */
const kIdle=5*60*1000;
let lastInput=Date.now();
for(const type of ['pointermove','pointerdown','keydown','wheel','touchstart'])
  addEventListener(type,()=>{lastInput=Date.now()},{passive:true});
function attended(){
  return document.visibilityState!=='hidden'
    &&(document.hasFocus?document.hasFocus():true)
    &&Date.now()-lastInput<kIdle;
}

async function api(path,opts={}){
  const res=await fetch(path,{credentials:'same-origin',...opts,
    headers:{'X-Axiom-Attended':attended()?'1':'0',
      ...(opts.body?{'Content-Type':'application/json'}:{}),
      ...(opts.headers||{})}});
  if(res.status===401){
    // Als Anmeldung gekennzeichnet, nicht als Fehler: `report()` schweigt
    // dazu, weil die Freigabe schon dasteht und ein Toast „401" daneben nur
    // Rauschen wäre.
    showGate();
    const gate=new Error('401');gate.gate=true;throw gate;
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    // Die Einzelmeldungen mitschleppen: Bei einer abgelehnten Regel steht in
    // `issues`, WAS nicht stimmt — „Regel ungültig" allein hilft niemandem.
    const err=new Error(data.error||('HTTP '+res.status));
    err.data=data;
    throw err;
  }
  return data;
}

/* ── Fehlerpfad ──────────────────────────────────────────────────────
   Vorher gab es für weite Teile dieser Seite gar keinen. Ein `onclick`, der
   `await api(…)` ruft und nichts fängt, endet bei einer Ablehnung als
   unbehandelte Zusage: Der Server schrieb „Feld breadcrumb ist leer",
   die Oberfläche schwieg, der Fokus lief weiter und der Knopf war von
   kaputt nicht zu unterscheiden. Dasselbe traf das Übernehmen einer langen
   Notiz und jede Zerlegung über zwanzig Schritte.

   Der Fensterhandler ist die Untergrenze: Was niemand fängt, wird
   wenigstens gesagt. Wo mehr nötig ist als eine Meldung — einen Reiter
   zurücknehmen, ein Feld wieder füllen — steht weiterhin ein eigenes
   `catch` daneben. `preventDefault` bleibt aus, damit die Meldung zusätzlich
   in der Konsole des Browsers steht. */
function report(e){
  if(!e||e.gate) return;
  toast(e.message||String(e));
}
addEventListener('unhandledrejection',e=>report(e.reason));

/* Ein Knopf, der während seiner eigenen Anfrage nicht noch einmal auslöst.
   Zwei Klicks auf „Als Aufgabe" legten sonst zwei Aufgaben aus einer Notiz
   an: Die Zeile bleibt stehen, bis die Antwort da ist, und der zweite Klick
   schickt dieselbe Anfrage ein zweites Mal. Zwei identische Einträge sind
   genau die Auswahlentscheidung, die AXIOM abnehmen soll (G1). */
function busy(handler){
  return async e=>{
    const b=e.currentTarget;
    if(b.disabled) return;
    b.disabled=true;
    try{await handler(e)}finally{b.disabled=false}
  };
}

/* ── Darstellung ─────────────────────────────────────────────────────
   Im Browser gespeichert, nicht auf dem Gerät: Es ist eine Eigenschaft
   dieses Bildschirms, nicht des Nutzers. Der Monitor im Büro verlangt
   etwas anderes als das Telefon in der Hand. */
const prefs={mode:localStorage.getItem('axiom.mode')||'auto',
  scheme:localStorage.getItem('axiom.scheme')||'workbench',
  size:localStorage.getItem('axiom.size')||'m'};
const darkQ=matchMedia('(prefers-color-scheme: dark)');
function applyPrefs(){
  const r=document.documentElement;
  r.dataset.scheme=prefs.scheme;
  r.dataset.mode=prefs.mode==='auto'?(darkQ.matches?'dark':'light'):prefs.mode;
  r.dataset.size=prefs.size;
  // Nur die Schalter in der Kopfzeile: `[data-mode]` träfe sonst auch das
  // Wurzelelement, das dieselben Namen als Zustand trägt.
  document.querySelectorAll('header .seg button').forEach(b=>{
    for(const key of ['mode','scheme','size'])
      if(b.dataset[key]!==undefined)
        b.setAttribute('aria-pressed',b.dataset[key]===prefs[key]?'true':'false');
  });
}
darkQ.addEventListener('change',()=>{if(prefs.mode==='auto')applyPrefs()});
document.querySelectorAll('header .seg button').forEach(b=>b.addEventListener('click',()=>{
  for(const key of ['mode','scheme','size'])
    if(b.dataset[key]){prefs[key]=b.dataset[key];localStorage.setItem('axiom.'+key,b.dataset[key])}
  applyPrefs();
}));
applyPrefs();

/* ── Freigabe per Zahlenabgleich ──────────────────────────────────────
   Statt eine PIN abzutippen: Der Browser fragt eine Freigabe an und
   bekommt eine Zahl. Dieselbe Zahl erscheint auf dem Telefon, zusammen
   mit einem Knopf.

   Der Schutz liegt im Abgleich, nicht in der Zahl. Fragt jemand anders im
   selben Moment eine Freigabe an, zeigt das Telefon dessen Zahl — und die
   steht dann nicht auf diesem Bildschirm. Wer nur bestätigt, was
   übereinstimmt, gibt niemand anderen herein. Eine Freigabe ohne
   Vergleich wäre bloß ein Knopf, den man wegdrückt. */
let pushPoll=null;
async function startPush(){
  clearInterval(pushPoll);
  $('#match').textContent='··';
  $('#push-msg').textContent=tr('Frage an …');
  try{
    const c=await fetch('/api/auth/request',{method:'POST',credentials:'same-origin'})
      .then(r=>r.json());
    if(c.error){$('#push-msg').textContent=c.error;return}
    $('#match').textContent=c.number;
    $('#push-msg').textContent=tr('Auf dem Telefon freigeben, wenn die Zahl stimmt.');
    let waited=0;
    pushPoll=setInterval(async()=>{
      waited+=2;
      const r=await fetch('/api/auth/poll?id='+encodeURIComponent(c.id),{credentials:'same-origin'});
      if(r.status===200){clearInterval(pushPoll);await enter();return}
      if(r.status!==202||waited>120){
        clearInterval(pushPoll);
        $('#push-msg').textContent=r.status===403
          ? tr('Abgelehnt. Wenn du das nicht warst, hat jemand anders angefragt.')
          : tr('Abgelaufen. Erneut versuchen.');
        $('#match').textContent='··';
      }
    },2000);
  }catch(e){$('#push-msg').textContent=tr('Der Server antwortet nicht.')}
}
function showGate(){
  clearInterval(pushPoll);
  // Ohne Sitzung gibt es auch keinen Kanal — sonst liefe im Hintergrund ein
  // Verbindungsversuch, den der Server ohnehin abweist.
  wsStop();
  // Ein offenes Blatt liegt über allem, auch über der Anmeldung. Es
  // stehenzulassen hieße, die Freigabe hinter einem Dialog zu verstecken.
  if($('#dlg').open) $('#dlg').close();
  $('#gate').classList.remove('hide');$('#app').classList.add('hide');
  $('#pin').value='';
  startPush();
}
$('#use-pin').addEventListener('click',()=>{
  clearInterval(pushPoll);
  $('#gate-push').classList.add('hide');$('#gate-pin').classList.remove('hide');$('#pin').focus();
});
$('#use-push').addEventListener('click',()=>{
  $('#gate-pin').classList.add('hide');$('#gate-push').classList.remove('hide');startPush();
});
async function login(){
  const pin=$('#pin').value.trim();
  if(pin.length<4){$('#gate-msg').textContent=tr('Sechs Ziffern.');return}
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({pin})});
    await enter();
  }catch(e){
    $('#gate-msg').textContent=tr('Stimmt nicht. Nach fünf Versuchen schaltet sich der Server ab.');
    $('#pin').value='';$('#pin').focus();
  }
}
$('#gate-go').addEventListener('click',login);
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function enter(){
  clearInterval(pushPoll);
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  markTabs();
  await reload();
  wsStart();
}

/* ── Zustand ───────────────────────────────────────────────────────
   Die Reihenfolge ist zugleich die der Zifferntasten 1 … 7 — eine Liste,
   nicht zwei, sonst zeigt die Taste irgendwann woandershin als der Reiter.
   Welcher Reiter offen war, hängt am Browser: Wer die Seite acht Stunden
   offen hat, lädt sie irgendwann neu und will dort weitermachen, wo er war,
   nicht wieder bei den Aufgaben anfangen. */
const TABS=['board','tasks','inbox','state','rules','review','events','help'];
let S=null,tasks=[],rules=[],events=[],inbox={notes:[],tasks:[]},review=null;
/* Voreingestellt das Board: Es beantwortet „wie viel wovon", und das ist
   die Frage, mit der man an einen Bildschirm mit Platz geht. Die Liste
   beantwortet „was zuerst" — dafür steht links schon die eine Handlung.
   Eine getroffene Wahl gewinnt weiterhin; nur die Voreinstellung dreht. */
let tab=TABS.includes(localStorage.getItem('axiom.tab'))
  ?localStorage.getItem('axiom.tab'):'board';
let ruleIssues=[];

async function refresh(){
  S=await api('/api/state');
  // Die Sprache kommt vom Telefon. Ändert sie sich dort, zieht die Seite
  // beim nächsten Zustand nach — festen Text übersetzt `localise` sofort,
  // gezeichneter Inhalt entsteht gleich darunter ohnehin neu.
  setLanguage(S.language);
  paintHeader();paintAction();paintCapline();
}
async function loadSurface(){
  // Der Eingang wird immer geholt, nicht nur wenn sein Reiter offen ist:
  // Die Zahl am Reiter misst dieselbe Menge wie der Reiter selbst — die
  // unsortierten Notizen. Vorher kam sie aus `S.inboxCount`, und das sind
  // Aufgaben im Zustand `inbox`; die entstehen auf keinem Weg dieser App.
  // Die Zahl stand deshalb dauerhaft auf nichts, während Notizen lagen.
  inbox=await api('/api/inbox');
  // Board und Liste zeigen denselben Bestand und holen ihn deshalb gleich.
  if(tab==='tasks'||tab==='board') tasks=(await api('/api/tasks')).tasks;
  else if(tab==='rules'){
    const data=await api('/api/rules');
    rules=data.rules;
    // Abgelehnte Einträge sichtbar machen: Eine stumm übersprungene Regel
    // ist schlimmer als eine, die laut fehlschlägt.
    ruleIssues=data.issues||[];
  }
  else if(tab==='events') events=(await api('/api/events?limit=250')).events;
  else if(tab==='review') review=await api('/api/review?scope='+(review?.scope||'day'));
  else if(tab==='help') await loadHelp();
}
async function reload(){await refresh();await loadSurface();render()}

function paintHeader(){
  const v=S.values||{};
  put($('#hchips'),
    el('span',{class:'chip'},tr('Kapazität'),' ',el('b',{},fmt(v.capacity?.value))),
    el('span',{class:'chip'},tr('Last'),' ',el('b',{},fmt(v.load_index?.value))),
    // Die Laststufe bleibt in Versalien: L0 ist keine Abkürzung eines
    // Wortes, sondern der Name eines Regimes — und zwei Zeichen tragen
    // ohnehin keine Wortform, die verlorengehen könnte.
    el('span',{class:S.loadLevel==='L0'?'chip':'chip warn'},S.loadLevel||'–'),
    S.focus?el('span',{class:'chip on',id:'focus-chip'},tr('Fokus'),' ',
      el('b',{},S.focus.elapsedMinutes+'/'+S.focus.plannedMinutes+' min')):null,
    S.configLocked?el('span',{class:'chip warn',title:'R-010'},tr('Regelwerk zu')):null,
    S.weightsCalibrated?null:el('span',{class:'chip',title:tr('Gewichte noch geschätzt')},tr('Ungeeicht')));
  const used=S.metaMinutesToday||0,cap=S.metaBudgetMinutes||12;
  $('#budget-fill').style.width=Math.min(100,(used/cap)*100)+'%';
  $('#budget').classList.toggle('over',used>=cap);
  $('#budget-txt').textContent=used+'/'+cap;
}

/* ── Die eine Handlung ───────────────────────────────────────────────
   Dieselbe Rangfolge wie auf dem Telefon: Eine feuernde Regel schlägt
   alles, dann das Laufende, dann der Vorschlag, dann das Zerlegen. */
function paintAction(){
  const box=$('#act');box.className='panel accent';
  const kids=[];
  const running=(S.running||[])[0],d=S.decision,next=(S.startable||[])[0],split=(S.atomize||[])[0];

  if(d){
    kids.push(el('div',{class:'eyebrow'},tr('Jetzt')),el('h1',{},d.title),
      el('div',{class:'row',style:'margin:.6rem 0 0'},
        el('span',{class:'stamp'},d.ruleId),
        // Der Defizitschlüssel stand hier in derselben Plakette wie die
        // Regel-ID. Zwei gerahmte Kästchen nebeneinander sahen aus wie zwei
        // Regeln; er steht jetzt daneben, wie in der App.
        d.deficit?el('span',{class:'dcode'},d.deficit):null));
    if(d.rationale) kids.push(el('p',{class:'why'},d.rationale));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>respond(d.id,'accepted')},tr('Verstanden')),
      el('button',{class:'btn',onclick:()=>respond(d.id,'deferred')},tr('Später')),
      el('button',{class:'btn quiet',onclick:()=>respond(d.id,'rejected')},tr('Passt nicht'))));
    if(running) kids.push(el('p',{class:'faint',style:'margin-top:.9rem'},tr('Läuft daneben: {0}',[running.title])));
  }else if(running){
    box.className='panel calm';
    kids.push(el('div',{class:'eyebrow'},tr('Läuft')),el('h1',{},running.title));
    if(S.focus) kids.push(el('p',{style:'color:var(--calm);margin-top:.4rem'},
      tr('{0} von {1} min',[S.focus.elapsedMinutes,S.focus.plannedMinutes])));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>act(running.id,'complete')},tr('Erledigt')),
      el('button',{class:'btn',onclick:()=>act(running.id,'release')},tr('Zurücklegen'))));
  }else if(next){
    // Anlauf und Frist sind Messwerte und tragen deshalb die Pille aus der
    // Liste, nicht die Plakette der Regel-ID: Die gehört ausschließlich der
    // Regel, sonst ist sie auf einem Schirm nicht mehr die eine Stelle, an
    // der die Begründung hängt (G2).
    kids.push(el('div',{class:'eyebrow'},tr('Jetzt')),el('h1',{},next.title),
      el('div',{class:'row',style:'margin:.6rem 0 0'},
        el('span',{class:'pill ae'},tr('Start {0}/10',[next.activationEnergy])),
        next.decayAt?el('span',{class:'pill due','data-due':dueRamp(next)},
          dueLabel(next.decayAt)):null));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>act(next.id,'start')},tr('Anfangen')),
      el('button',{class:'btn',onclick:()=>act(next.id,'complete')},tr('Erledigt'))));
  }else if(split){
    kids.push(el('div',{class:'eyebrow'},tr('Zerlegen')),el('h1',{},split.title),
      el('p',{class:'why'},split.reason),
      el('div',{class:'row'},
        el('button',{class:'btn primary',onclick:()=>atomizeDialog(split)},tr('In Schritte zerlegen'))));
  }else{
    box.className='panel';
    kids.push(el('div',{class:'eyebrow'},tr('Nichts anliegend')),el('h1',{},tr('Ruhig gerade.')),
      el('p',{style:'margin-top:.6rem'},tr('Kein Vorschlag heißt: gerade ist nichts nötig. Was dir einfällt, kannst du links erfassen.')));
  }
  if(S.nextStep) kids.push(el('p',{class:'faint',style:'margin-top:1rem'},
    S.nextStep.label+' · '+new Date(S.nextStep.at).toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'})+' — '+S.nextStep.anchor));
  put(box,kids);
}

function dueLabel(iso){
  const diff=new Date(iso)-new Date();
  if(diff<0) return tr('Überfällig');
  const h=Math.round(diff/36e5);
  return h<24?tr('in {0} h',[h]):tr('in {0} Tagen',[Math.round(h/24)]);
}
async function respond(id,response){
  try{await api('/api/decisions/'+id,{method:'POST',body:JSON.stringify({response})})}catch(e){}
  await reload();
}
async function act(id,verb){
  try{await api('/api/tasks/'+id+'/'+verb,{method:'POST'});await reload()}catch(e){report(e)}
}

/* ── Kapazitätslinie ─────────────────────────────────────────────────
   Dasselbe Instrument wie auf dem Telefon: eine Achse von leicht nach
   schwer, jede offene Aufgabe ein Punkt, die Kapazität als Marke. Was
   links davon liegt, ist heute erreichbar. Eine Messung, kein Urteil. */
function paintCapline(){
  const cap=S.values?.capacity?.value??50, W=320, pad=10;
  const x=ae=>pad+((ae-1)/9)*(W-2*pad);
  const mark=x(cap/10);
  const open=[...(S.startable||[]),...(S.running||[])];
  const parts=['<line class="axis" x1="'+pad+'" y1="48" x2="'+(W-pad)+'" y2="48"/>',
    '<line class="m" x1="'+mark+'" y1="32" x2="'+mark+'" y2="54"/>',
    // Beschriftung durch tr(): Dieselbe Stelle war in der App schon einmal
    // fest auf Deutsch, mitten in einer englischen Oberflaeche — sie steckte
    // in einem CustomPainter, der keinen BuildContext hat. Hier ist es ein
    // String im SVG, und der faellt genauso durch jede Zaehlung von
    // Uebersetzungsaufrufen.
    '<text x="'+pad+'" y="66">'+tr('LEICHT')+'</text>',
    '<text x="'+mark+'" y="66" text-anchor="middle" style="fill:var(--signal)">'+tr('HIER')+'</text>',
    '<text x="'+(W-pad)+'" y="66" text-anchor="end">'+tr('SCHWER')+'</text>'];
  const seen={};
  for(const t of open){
    const cx=x(t.activationEnergy), k=Math.round(cx);
    const dy=(seen[k]=(seen[k]||0)+1)-1;
    const cls=t.state==='active'?'dnow':(cx<=mark?'din':'dout');
    parts.push('<circle class="'+cls+'" cx="'+cx+'" cy="'+(36-dy*9)+'" r="4"><title>'+
      String(t.title).replace(/[<&>]/g,'')+tr(' — Start {0}/10',[t.activationEnergy])+'</title></circle>');
  }
  $('#capline').innerHTML=parts.join('');
  $('#cap-label').textContent=tr('Kapazität {0}',[cap]);
  const n=(S.startable||[]).length;
  $('#cap-note').textContent=n
    ? tr('{0} startbar. Was rechts der Marke liegt, braucht heute mehr Anlauf, als da ist.',[n])
    : tr('Heute liegt nichts unter der Linie. Zerlegen hilft mehr als Anlauf nehmen.');
}

/* ── Erfassen ────────────────────────────────────────────────────── */
async function saveCapture(){
  const box=$('#cap-text'), text=box.value.trim();
  if(!text) return;
  box.value='';
  try{await api('/api/capture',{method:'POST',body:JSON.stringify({text})});toast(tr('Erfasst.'))}
  catch(e){box.value=text;report(e)}
