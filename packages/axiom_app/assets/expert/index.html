<!--
  Expertenmodus — AXIOM am großen Bildschirm.

  Kein zweites AXIOM mit eigenem Geschmack, sondern dasselbe Instrument auf
  einer Fläche, die mehr trägt: dieselben sechs Paletten aus tokens.dart,
  dieselben zwei Schriften aus dem App-Bündel, dieselbe Kapazitätslinie.
  Wer beide nebeneinander offen hat, soll keinen Bruch sehen.

  Was hinzukommt, ist das, was ein Schreibtisch hergibt und eine Hand nicht:
  Listen NEBEN der Handlung statt statt ihrer, Tastenkürzel, Rohdaten.

  Was nicht hinzukommt, ist eine zweite Art zu entscheiden. Oben links steht
  genau eine Handlung, so wie auf dem Telefon (G1). Die Liste daneben ist
  Bestand, nicht Auswahl.

  Vollständig eigenständig: kein CDN, kein nachgeladenes Skript, keine
  fremde Schriftart. Das ist die Bedingung aus ADR-0005 — AXIOM ruft nichts
  von sich aus auf, und eine Seite, die eine Schrift von fremden Servern
  holt, täte genau das.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>AXIOM · Expertenmodus</title>

<style>
/* ── Schriften ─────────────────────────────────────────────────────────
   Aus dem App-Bündel, ausgeliefert vom Server selbst. Mono trägt jeden
   Messwert — eine Systemschrift an dieser Stelle macht aus einem
   abgelesenen Wert einen gemeinten. */
@font-face{font-family:Plex;src:url(/font/sans-400.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/font/sans-500.ttf);font-weight:500;font-display:swap}
@font-face{font-family:PlexMono;src:url(/font/mono-400.ttf);font-weight:400;font-display:swap}
@font-face{font-family:PlexMono;src:url(/font/mono-500.ttf);font-weight:500;font-display:swap}

/* ── Paletten ──────────────────────────────────────────────────────────
   Wortgleich aus lib/design/tokens.dart, nicht nachempfunden. */
:root,[data-scheme=instrument][data-mode=dark]{
  --base:#0E1113;--panel:#171B1E;--raised:#1F2529;--rule:#2A3237;
  --ink:#ECEAE4;--dim:#9BA4AB;--faint:#7A848B;
  --signal:#E8A33D;--deep:#B8761F;--calm:#7FA88A;--caution:#C4653A;--info:#6E90A4;
  --on-signal:#1A1206}
[data-scheme=instrument][data-mode=light]{
  --base:#F2F1ED;--panel:#FFFFFF;--raised:#FAF9F6;--rule:#CFCCC4;
  --ink:#15181B;--dim:#4A545B;--faint:#6E767C;
  --signal:#9A6510;--deep:#7A4E08;--calm:#3F6B4F;--caution:#9C4522;--info:#3E6072;
  --on-signal:#FFFFFF}
[data-scheme=contrast][data-mode=dark]{
  --base:#0A0C0E;--panel:#15191C;--raised:#1E2428;--rule:#3D474D;
  --ink:#F5F3EE;--dim:#C2C9CE;--faint:#9BA5AC;
  --signal:#FFBB55;--deep:#D08A28;--calm:#9CC7A6;--caution:#E08356;--info:#8FB3C7;
  --on-signal:#140E04}
[data-scheme=contrast][data-mode=light]{
  --base:#FAFAF8;--panel:#FFFFFF;--raised:#F2F1ED;--rule:#B4B0A7;
  --ink:#0D1012;--dim:#3B4248;--faint:#5C666D;
  --signal:#7A4E08;--deep:#5C3A05;--calm:#2E5239;--caution:#7C3316;--info:#2B4757;
  --on-signal:#FFFFFF}
[data-scheme=muted][data-mode=dark]{
  --base:#12100D;--panel:#1A1714;--raised:#221E1A;--rule:#332C26;
  --ink:#E0D8CC;--dim:#A3988A;--faint:#7D7264;
  --signal:#D79A55;--deep:#A87433;--calm:#8FA98C;--caution:#BE7A55;--info:#8B9AA0;
  --on-signal:#17110A}
[data-scheme=muted][data-mode=light]{
  --base:#F4F0E7;--panel:#FBF8F1;--raised:#FFFDF8;--rule:#D5CDBE;
  --ink:#221E19;--dim:#57503F;--faint:#7A7263;
  --signal:#8A5A16;--deep:#6B450F;--calm:#44634A;--caution:#8C4A26;--info:#3F5A66;
  --on-signal:#FFFFFF}

/* Vier Stufen wie in der App — kein stufenloser Regler. Ein Regler ist
   eine Entscheidung mit unendlich vielen Antworten (G1). */
[data-size=s]{--scale:.9}[data-size=m]{--scale:1}
[data-size=l]{--scale:1.18}[data-size=xl]{--scale:1.38}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--scale,1))}
body{background:var(--base);color:var(--ink);
  font:400 1rem/1.55 Plex,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:3rem}
.mono{font-family:PlexMono,ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;
  padding:.7rem 1.25rem;background:color-mix(in srgb,var(--base) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:.5rem;font-weight:500;letter-spacing:.14em;font-size:.78rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.chip{font-family:PlexMono,monospace;font-size:.66rem;letter-spacing:.09em;padding:.28rem .5rem;
  border:1px solid var(--rule);border-radius:3px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.chip.on{border-color:var(--signal);color:var(--signal)}
.chip.warn{border-color:var(--caution);color:var(--caution)}
.spacer{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{font-family:PlexMono,monospace;font-size:.64rem;letter-spacing:.08em;padding:.3rem .48rem;
  color:var(--faint);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--signal)}
.seg button:hover{color:var(--ink)}
.budget{display:flex;align-items:center;gap:.45rem;min-width:8rem}
.budget .track{position:relative;flex:1;height:2px;background:var(--rule)}
.budget .fill{position:absolute;inset:0 auto 0 0;background:var(--signal)}
.budget.over .fill{background:var(--caution)}

main{max-width:1560px;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
@media(min-width:1080px){main{grid-template-columns:minmax(340px,26rem) 1fr;align-items:start}
  .rail{position:sticky;top:4.6rem}}
.rail{display:grid;gap:1rem;align-content:start}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:1.1rem}
.panel.accent{border-color:color-mix(in srgb,var(--signal) 55%,var(--rule))}
.panel.calm{border-color:color-mix(in srgb,var(--calm) 55%,var(--rule))}
.eyebrow{font-family:PlexMono,monospace;font-size:.65rem;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.sec{display:flex;align-items:center;gap:.75rem;margin:0 0 .7rem}
.sec .line{flex:1;height:1px;background:var(--rule)}
h1{font-size:1.65rem;font-weight:400;line-height:1.2;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:500}
p{color:var(--dim);font-size:.9rem}
.faint{color:var(--faint);font-size:.8rem}
.stamp{display:inline-flex;align-items:center;gap:.35rem;font-family:PlexMono,monospace;font-size:.68rem;
  letter-spacing:.08em;border:1px solid color-mix(in srgb,var(--info) 60%,transparent);
  color:var(--info);padding:.2rem .45rem;border-radius:3px}
.why{color:var(--dim);font-size:.85rem;border-left:2px solid var(--rule);padding-left:.75rem;margin:.85rem 0 0}
.row{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1.05rem}
.btn{padding:.6rem 1rem;border-radius:4px;border:1px solid var(--rule);color:var(--ink);font-size:.88rem;
  transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--signal);color:var(--on-signal);border-color:var(--signal);font-weight:500}
.btn.primary:hover{background:var(--deep);border-color:var(--deep)}
.btn.quiet{border-color:transparent;color:var(--faint)}
.btn.quiet:hover{color:var(--ink)}
.btn.grow{flex:1 1 8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.capline{width:100%;height:76px;display:block;overflow:visible}
.capline .axis{stroke:var(--rule);stroke-width:1}
.capline .din{fill:var(--calm)}
.capline .dout{fill:none;stroke:var(--faint)}
.capline .dnow{fill:var(--signal)}
.capline .m{stroke:var(--signal);stroke-width:2}
.capline text{font-family:PlexMono,monospace;font-size:9px;fill:var(--faint);letter-spacing:.1em}

#cap-text{width:100%;min-height:4.2rem;resize:vertical;background:var(--raised);
  border:1px solid var(--rule);border-radius:4px;padding:.7rem .8rem;line-height:1.5}
#cap-text:focus{outline:none;border-color:var(--signal)}

.tabs{display:flex;gap:.15rem;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.tabs button{padding:.55rem .8rem;font-size:.85rem;color:var(--faint);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--signal)}
.tabs button:hover{color:var(--ink)}
.tabs .count{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint);margin-left:.3rem}

/* Die Einrückung ist die Eltern-Kind-Kette. Sie wächst in rem und damit mit
   der Textgröße mit; die Tiefe wird beim Zeichnen gedeckelt, sonst bliebe bei
   2,4-facher Schrift für den Titel nichts mehr übrig. */
.item{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:.85rem;align-items:start;
  padding:.8rem 0;padding-left:calc(var(--depth,0) * 1.1rem);border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--rule);min-height:2.1rem}
/* Dringlichkeit als Rampe — der Abstand zu decayAt, sonst nichts. Keine
   Ampel: Es gibt hier kein Gut und kein Schlecht, nur nah und fern (R7).
   Ohne Frist und jenseits von drei Tagen bleibt der Strich neutral. */
.item[data-due=over] .bar{background:var(--caution)}
.item[data-due=day] .bar{background:var(--signal)}
.item[data-due=days] .bar{background:color-mix(in srgb,var(--signal) 45%,var(--rule))}
.item .title{font-size:.94rem;overflow-wrap:anywhere}
.item.run .title{color:var(--calm)}
.item.done .title{color:var(--faint);text-decoration:line-through}
.meta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.2rem}
.meta span{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint)}
.meta .due{color:var(--dim)}
.item[data-due=over] .meta .due{color:var(--caution)}
.acts{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.acts .btn{padding:.32rem .58rem;font-size:.77rem}

/* ── Filterzeile und Umschalter ───────────────────────────────────────
   Drei Filter, kein Baukasten. Jeder weitere wäre eine Entscheidung mehr
   vor der Arbeit statt in ihr (G1, D3). */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.filters input[type=search]{flex:1 1 12rem;min-width:7rem;width:auto}
.tog{font-family:PlexMono,monospace;font-size:.66rem;letter-spacing:.09em;padding:.42rem .6rem;
  border:1px solid var(--rule);border-radius:3px;color:var(--faint);white-space:nowrap}
.tog[aria-pressed=true]{border-color:var(--signal);color:var(--signal)}
.tog:hover{color:var(--ink)}

/* ── Regeleditor ───────────────────────────────────────────────────── */
.ed{display:grid;gap:1.35rem}
.step{display:grid;gap:.5rem}
.pick{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.pick .btn{padding:.32rem .6rem;font-size:.78rem}
.cond{border:1px solid var(--rule);border-radius:5px;padding:.6rem .7rem;
  background:var(--raised);margin-bottom:.5rem}
.cond.grp{background:transparent;border-style:dashed}
.cond .top{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.cond .fields{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.cond .now{font-family:PlexMono,monospace;font-size:.68rem;color:var(--faint);margin-top:.45rem}
.slim{width:auto;max-width:100%;min-width:5rem}
.hint{color:var(--faint);font-size:.78rem}

.dial{margin:0 0 1.05rem}
.dial .head{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.dial .val{font-family:PlexMono,monospace;color:var(--signal);font-weight:500}
.dial .ends{display:flex;justify-content:space-between;margin-top:.15rem}
.dial .ends span{font-family:PlexMono,monospace;font-size:.66rem;color:var(--faint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:.5rem 0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;
  border-radius:50%;background:var(--signal);border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--signal);
  border:2px solid var(--panel)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],
input[type=search],input[type=time],textarea,select{
  background:var(--raised);border:1px solid var(--rule);border-radius:4px;padding:.5rem .65rem;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--signal)}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:.3rem}
.field{margin-bottom:.9rem}

.value{padding:.85rem 0;border-bottom:1px solid var(--rule)}
.value:last-child{border-bottom:0}
.value.can{cursor:pointer}
.value .head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.value .num{font-family:PlexMono,monospace;font-size:1.3rem;font-weight:500}
.value .track{height:2px;background:var(--rule);margin:.45rem 0 .1rem;position:relative}
.value .fill{position:absolute;inset:0 auto 0 0;background:var(--signal)}
.terms{margin-top:.5rem;display:none}
.value.open .terms{display:block}
.term{display:flex;justify-content:space-between;font-family:PlexMono,monospace;font-size:.7rem;
  color:var(--faint);padding:.15rem 0}
.term b{color:var(--dim);font-weight:400}

textarea.code{font-family:PlexMono,monospace;font-size:.8rem;min-height:19rem;line-height:1.55;tab-size:2}
.ev{display:grid;grid-template-columns:auto auto 1fr;gap:.7rem;font-family:PlexMono,monospace;font-size:.72rem;
  padding:.32rem 0;border-bottom:1px solid color-mix(in srgb,var(--rule) 45%,transparent)}
.ev .t{color:var(--faint)}.ev .k{color:var(--info)}
.ev .p{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

dialog{border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);
  padding:1.4rem;width:min(34rem,calc(100vw - 2rem));max-height:86vh;overflow:auto}
dialog::backdrop{background:color-mix(in srgb,var(--base) 72%,transparent);backdrop-filter:blur(3px)}
dialog h2{margin-bottom:.9rem}
kbd{font-family:PlexMono,monospace;font-size:.7rem;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:.05rem .32rem;color:var(--dim)}
.keys{display:grid;gap:.4rem}
.keys div{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem}

#toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1rem);
  background:var(--raised);border:1px solid var(--rule);border-radius:5px;padding:.6rem 1rem;
  font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

#gate{display:grid;place-items:center;min-height:100vh;padding:1.5rem}
#gate .panel{width:min(24rem,100%)}
#pin{font-family:PlexMono,monospace;font-size:1.5rem;letter-spacing:.45rem;text-align:center}
#match{font-family:PlexMono,monospace;font-size:3.4rem;font-weight:500;letter-spacing:.2em;
  color:var(--signal);text-align:center;padding:1rem 0}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<!-- ── Anmeldung ────────────────────────────────────────────────────── -->
<div id="gate">
  <div class="panel">
    <div class="mark" style="margin-bottom:1.1rem">
      <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true">
        <path d="M3 13h7M12 13h7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 4v15" stroke="var(--signal)" stroke-width="3"/></svg>AXIOM
    </div>

    <div id="gate-push">
      <p class="faint">Auf dem Telefon erscheint gleich eine Zahl. Stimmt sie mit der hier überein, gibst du dort frei — sonst nicht.</p>
      <div id="match">··</div>
      <p id="push-msg" class="faint" style="min-height:1.2rem;text-align:center"></p>
      <button class="btn quiet" id="use-pin" style="width:100%">Stattdessen PIN eingeben</button>
    </div>

    <div id="gate-pin" class="hide">
      <p class="faint" style="margin-bottom:.8rem">Die PIN steht in der App. Sie gilt nur für diesen Start.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6"
             placeholder="······" aria-label="PIN">
      <p id="gate-msg" class="faint" style="margin-top:.6rem;min-height:1.2rem"></p>
      <button class="btn primary" id="gate-go" style="width:100%;margin-top:.4rem">Anmelden</button>
      <button class="btn quiet" id="use-push" style="width:100%;margin-top:.3rem">Zurück zur Freigabe</button>
    </div>
  </div>
</div>

<!-- ── Anwendung ────────────────────────────────────────────────────── -->
<div id="app" class="hide">
  <header>
    <div class="mark">
      <svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true">
        <path d="M3 13h7M12 13h7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 4v15" stroke="var(--signal)" stroke-width="3"/></svg>AXIOM
    </div>
    <div class="chips" id="hchips"></div>
    <div class="spacer"></div>
    <div class="budget" id="budget" title="Zeit im System heute (G4)">
      <span class="eyebrow">META</span>
      <span class="track"><span class="fill" id="budget-fill"></span></span>
      <span class="mono" style="font-size:.68rem" id="budget-txt">–</span>
    </div>
    <div class="seg" role="group" aria-label="Helligkeit">
      <button data-mode="auto">AUTO</button><button data-mode="dark">DUNKEL</button><button data-mode="light">HELL</button>
    </div>
    <div class="seg" role="group" aria-label="Farbschema">
      <button data-scheme="instrument">INSTRUMENT</button><button data-scheme="contrast">KONTRAST</button><button data-scheme="muted">GEDÄMPFT</button>
    </div>
    <div class="seg" role="group" aria-label="Textgröße">
      <button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button><button data-size="xl">XL</button>
    </div>
    <button class="btn quiet" id="help-btn" title="Tastenkürzel (?)">?</button>
    <button class="btn quiet" id="stop-btn" title="Server beenden">Beenden</button>
  </header>

  <main>
    <div class="rail">
      <section class="panel accent" id="act" aria-live="polite"></section>

      <section class="panel">
        <div class="sec"><span class="eyebrow">Erfassen</span><span class="line"></span><kbd>n</kbd></div>
        <textarea id="cap-text" placeholder="Was ist dir eingefallen?" aria-label="Erfassen"></textarea>
        <div class="row">
          <button class="btn primary grow" id="cap-save">Speichern</button>
          <button class="btn" id="checkin-btn" title="Check-in (c)">Check-in</button>
        </div>
        <p class="faint" style="margin-top:.5rem">Ohne Rückfrage, ohne Kategorie. Sortiert wird später.</p>
      </section>

      <section class="panel">
        <div class="sec"><span class="eyebrow">Aktivierungsenergie</span><span class="line"></span>
          <span class="mono" style="font-size:.7rem;color:var(--signal)" id="cap-label">–</span></div>
        <svg class="capline" id="capline" viewBox="0 0 320 76" preserveAspectRatio="none"
             role="img" aria-label="Kapazitätslinie"></svg>
        <p class="faint" id="cap-note" style="margin-top:.4rem"></p>
      </section>
    </div>

    <div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="tasks" aria-selected="true">Aufgaben<span class="count" id="c-tasks"></span></button>
        <button role="tab" data-tab="inbox" aria-selected="false">Eingang<span class="count" id="c-inbox"></span></button>
        <button role="tab" data-tab="state" aria-selected="false">Zustand</button>
        <button role="tab" data-tab="rules" aria-selected="false">Regelwerk<span class="count" id="c-rules"></span></button>
        <button role="tab" data-tab="review" aria-selected="false">Review</button>
        <button role="tab" data-tab="events" aria-selected="false">Ereignisse</button>
      </div>
      <section class="panel" id="surface"></section>
    </div>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{
  const n=document.createElement(t);
  for(const [k,v] of Object.entries(a)){
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') n.className=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);
  }
  // Tief flach klopfen: Ein Baustein, der eine Liste zurückgibt, soll sich
  // wie ein einzelnes Kind einsetzen lassen — sonst steht irgendwann
  // "[object Object]" in der Oberfläche.
  for(const k of kids.flat(Infinity)) if(k!==null&&k!==undefined&&k!==false)
    n.append(k.nodeType?k:document.createTextNode(String(k)));
  return n;
};
const fmt=n=>(n===null||n===undefined)?'–':String(n);

/* `replaceChildren` filtert null NICHT — es macht daraus einen Textknoten
   mit dem Wort "null". Zwei weggelassene Chips standen deshalb als
   "nullnull" in der Kopfzeile. Der el()-Helfer filtert; diese Funktion
   zieht dieselbe Regel fuer alles nach, was direkt ersetzt wird. */
const put=(node,...kids)=>node.replaceChildren(
  ...kids.flat(Infinity).filter(k=>k!==null&&k!==undefined&&k!==false));
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),3200)}

async function api(path,opts={}){
  const res=await fetch(path,{credentials:'same-origin',
    headers:opts.body?{'Content-Type':'application/json'}:{},...opts});
  if(res.status===401){showGate();throw new Error('401')}
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    // Die Einzelmeldungen mitschleppen: Bei einer abgelehnten Regel steht in
    // `issues`, WAS nicht stimmt — „Regel ungültig" allein hilft niemandem.
    const err=new Error(data.error||('HTTP '+res.status));
    err.data=data;
    throw err;
  }
  return data;
}

/* ── Freigabe per Zahlenabgleich ──────────────────────────────────────
   Statt eine PIN abzutippen: Der Browser fragt eine Freigabe an und
   bekommt eine Zahl. Dieselbe Zahl erscheint auf dem Telefon, zusammen
   mit einem Knopf.

   Der Schutz liegt im Abgleich, nicht in der Zahl. Fragt jemand anders im
   selben Moment eine Freigabe an, zeigt das Telefon dessen Zahl — und die
   steht dann nicht auf diesem Bildschirm. Wer nur bestätigt, was
   übereinstimmt, gibt niemand anderen herein. Eine Freigabe ohne
   Vergleich wäre bloß ein Knopf, den man wegdrückt. */
let pushPoll=null;
async function startPush(){
  clearInterval(pushPoll);
  $('#match').textContent='··';
  $('#push-msg').textContent='Frage an …';
  try{
    const c=await fetch('/api/auth/request',{method:'POST',credentials:'same-origin'})
      .then(r=>r.json());
    if(c.error){$('#push-msg').textContent=c.error;return}
    $('#match').textContent=c.number;
    $('#push-msg').textContent='Auf dem Telefon freigeben, wenn die Zahl stimmt.';
    let waited=0;
    pushPoll=setInterval(async()=>{
      waited+=2;
      const r=await fetch('/api/auth/poll?id='+encodeURIComponent(c.id),{credentials:'same-origin'});
      if(r.status===200){clearInterval(pushPoll);await enter();return}
      if(r.status!==202||waited>120){
        clearInterval(pushPoll);
        $('#push-msg').textContent=r.status===403
          ? 'Abgelehnt. Wenn du das nicht warst, hat jemand anders angefragt.'
          : 'Abgelaufen. Erneut versuchen.';
        $('#match').textContent='··';
      }
    },2000);
  }catch(e){$('#push-msg').textContent='Der Server antwortet nicht.'}
}
function showGate(){
  clearInterval(pushPoll);
  $('#gate').classList.remove('hide');$('#app').classList.add('hide');
  $('#pin').value='';
  startPush();
}
$('#use-pin').addEventListener('click',()=>{
  clearInterval(pushPoll);
  $('#gate-push').classList.add('hide');$('#gate-pin').classList.remove('hide');$('#pin').focus();
});
$('#use-push').addEventListener('click',()=>{
  $('#gate-pin').classList.add('hide');$('#gate-push').classList.remove('hide');startPush();
});

    $('#pin').value='';$('#pin').focus();

}

function paintAction(){
  const box=$('#act');box.className='panel accent';
  const kids=[];

        d.deficit?el('span',{class:'stamp'},d.deficit):null));
    if(d.rationale) kids.push(el('p',{class:'why'},d.rationale));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>respond(d.id,'accepted')},'Verstanden'),
      el('button',{class:'btn',onclick:()=>respond(d.id,'deferred')},'Später'),
      el('button',{class:'btn quiet',onclick:()=>respond(d.id,'rejected')},'Passt nicht')));
    if(running) kids.push(el('p',{class:'faint',style:'margin-top:.9rem'},'Läuft daneben: '+running.title));
  }else if(running){
    box.className='panel calm';
    kids.push(el('div',{class:'eyebrow'},'LÄUFT'),el('h1',{},running.title));
    if(S.focus) kids.push(el('p',{class:'mono',style:'color:var(--calm);margin-top:.4rem'},
      S.focus.elapsedMinutes+' von '+S.focus.plannedMinutes+' min'));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>act(running.id,'complete')},'Erledigt'),
      el('button',{class:'btn',onclick:()=>act(running.id,'release')},'Zurücklegen')));
  }else if(next){
    kids.push(el('div',{class:'eyebrow'},'JETZT'),el('h1',{},next.title),
      el('div',{class:'row',style:'margin:.6rem 0 0'},
        el('span',{class:'stamp'},'START '+next.activationEnergy+'/10'),
        next.decayAt?el('span',{class:'stamp'},dueLabel(next.decayAt)):null));
    kids.push(el('div',{class:'row'},
      el('button',{class:'btn primary grow',onclick:()=>act(next.id,'start')},'Anfangen'),
      el('button',{class:'btn',onclick:()=>act(next.id,'complete')},'Erledigt')));
  }else if(split){
    kids.push(el('div',{class:'eyebrow'},'ZERLEGEN'),el('h1',{},split.title),
      el('p',{class:'why'},split.reason),
      el('div',{class:'row'},
        el('button',{class:'btn primary',onclick:()=>atomizeDialog(split)},'In Schritte zerlegen')));
  }else{
    box.className='panel';
    kids.push(el('div',{class:'eyebrow'},'NICHTS ANLIEGEND'),el('h1',{},'Ruhig gerade.'),
      el('p',{style:'margin-top:.6rem'},'Kein Vorschlag heißt: gerade ist nichts nötig. Was dir einfällt, kannst du links erfassen.'));
  }
  if(S.nextStep) kids.push(el('p',{class:'faint',style:'margin-top:1rem'},
    S.nextStep.label+' · '+new Date(S.nextStep.at).toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'})+' — '+S.nextStep.anchor));
  put(box,kids);
}

function dueLabel(iso){

  if(diff<0) return 'ÜBERFÄLLIG';
  const h=Math.round(diff/36e5);
  return h<24?('IN '+h+' H'):('IN '+Math.round(h/24)+' T');
}

/* ── Kapazitätslinie ─────────────────────────────────────────────────
   Dasselbe Instrument wie auf dem Telefon: eine Achse von leicht nach
   schwer, jede offene Aufgabe ein Punkt, die Kapazität als Marke. Was
   links davon liegt, ist heute erreichbar. Eine Messung, kein Urteil. */
function paintCapline(){
  const cap=S.values?.capacity?.value??50, W=320, pad=10;
  const x=ae=>pad+((ae-1)/9)*(W-2*pad);
  const mark=x(cap/10);
  const open=[...(S.startable||[]),...(S.running||[])];
  const parts=['<line class="axis" x1="'+pad+'" y1="48" x2="'+(W-pad)+'" y2="48"/>',
    '<line class="m" x1="'+mark+'" y1="32" x2="'+mark+'" y2="54"/>',
    '<text x="'+pad+'" y="66">LEICHT</text>',
    '<text x="'+mark+'" y="66" text-anchor="middle" style="fill:var(--signal)">HIER</text>',
    '<text x="'+(W-pad)+'" y="66" text-anchor="end">SCHWER</text>'];
  const seen={};
  for(const t of open){
    const cx=x(t.activationEnergy), k=Math.round(cx);
    const dy=(seen[k]=(seen[k]||0)+1)-1;
    const cls=t.state==='active'?'dnow':(cx<=mark?'din':'dout');
    parts.push('<circle class="'+cls+'" cx="'+cx+'" cy="'+(36-dy*9)+'" r="4"><title>'+
      String(t.title).replace(/[<&>]/g,'')+' — Start '+t.activationEnergy+'/10</title></circle>');
  }
  $('#capline').innerHTML=parts.join('');
  $('#cap-label').textContent='KAPAZITÄT '+cap;
  const n=(S.startable||[]).length;
  $('#cap-note').textContent=n
    ? n+' startbar. Was rechts der Marke liegt, braucht heute mehr Anlauf, als da ist.'
    : 'Heute liegt nichts unter der Linie. Zerlegen hilft mehr als Anlauf nehmen.';
}

/* ── Aufgaben ────────────────────────────────────────────────────────
   Ein Baum, keine Liste. `parentId` legt der Atomizer beim Zerlegen an —
   damit ist die Kette Eltern → Kind schon da, sie war nur nie zu sehen.
   Das IST die Projektfunktion: Ein eigener Projekt-Typ wäre eine zweite
   Ordnungsachse und damit Meta-Work-Treibstoff (D3).

   Die Reihenfolge ist die der Auswahl und nicht verstellbar. Drei Filter,
   sonst keine — jeder weitere ist eine Entscheidung vor der Arbeit statt
   in ihr (G1). Sie hängen am Browser, nicht am Gerät: Es ist eine
   Eigenschaft dieses Bildschirms, nicht des Nutzers. */
const tprefs={
  q:localStorage.getItem('axiom.tasks.q')||'',
  reach:localStorage.getItem('axiom.tasks.reach')==='1',
  overdue:localStorage.getItem('axiom.tasks.overdue')==='1',
  done:localStorage.getItem('axiom.tasks.done')==='1'};
function setTPref(key,value){
  tprefs[key]=value;
  localStorage.setItem('axiom.tasks.'+key,
    value===true?'1':value===false?'0':String(value));
}

function viewTasks(){
  const frag=document.createDocumentFragment();
  const list=el('div',{id:'tasklist'});
  frag.append(taskFilters(),list);
  fillTasks(list);
  return frag;
}
/* Nur die Liste neu zeichnen, nicht die Zeile darüber: Sonst verliert das
   Suchfeld beim zweiten Buchstaben den Fokus. */
function renderTaskList(){const box=$('#tasklist');if(box) fillTasks(box)}

function taskFilters(){
  const tog=(key,label,title)=>el('button',{class:'tog',title,
    'aria-pressed':tprefs[key]?'true':'false',
    onclick:e=>{
      setTPref(key,!tprefs[key]);
      e.currentTarget.setAttribute('aria-pressed',tprefs[key]?'true':'false');
      renderTaskList();
    }},label);
  return el('div',{class:'filters'},
    el('button',{class:'btn primary',onclick:()=>taskDialog()},'Neue Aufgabe'),
    el('input',{type:'search',value:tprefs.q,placeholder:'Suchen','aria-label':'Aufgaben durchsuchen',
      oninput:e=>{setTPref('q',e.target.value);renderTaskList()}}),
    tog('reach','IN REICHWEITE','Nur was unter der Kapazität von heute liegt'),
    tog('overdue','ÜBERFÄLLIG','Nur was seinen Zeitpunkt überschritten hat'),
    tog('done','ERLEDIGTE','Erledigtes mit anzeigen'));
}

function fillTasks(box){
  const cap=S.values?.capacity?.value??50;
  const inReach=t=>t.activationEnergy<=cap/10;
  const overdue=t=>!!t.decayAt&&new Date(t.decayAt).getTime()<Date.now();

  const byId=new Map(tasks.map(t=>[t.id,t]));
  const kids=new Map(),roots=[];
  for(const t of tasks){
    const parent=t.parentId&&t.parentId!==t.id&&byId.has(t.parentId)?t.parentId:null;
    if(parent){
      if(!kids.has(parent)) kids.set(parent,[]);
      kids.get(parent).push(t);
    }else roots.push(t);
  }
  $('#c-tasks').textContent=' '+tasks.filter(t=>t.state==='ready'||t.state==='active').length;

  const q=tprefs.q.trim().toLowerCase();
  const hits=t=>{
    if(t.state==='dropped') return false;
    if(t.state==='done'&&!tprefs.done) return false;
    if(q&&!String(t.title||'').toLowerCase().includes(q)) return false;
    if(tprefs.reach&&!(inReach(t)&&t.state!=='done')) return false;
    if(tprefs.overdue&&!overdue(t)) return false;
    return true;
  };
  /* Ein Treffer zieht seine Eltern mit. Ohne die Kette stünde ein Schritt
     ohne das, wozu er gehört — und genau das soll der Baum zeigen. */
  const keep=new Set(),seen=new Set();
  const mark=t=>{
    if(seen.has(t.id)) return false;
    seen.add(t.id);
    let below=false;
    for(const c of kids.get(t.id)||[]) if(mark(c)) below=true;
    const ok=hits(t)||below;
    if(ok) keep.add(t.id);
    return ok;
  };
  roots.forEach(mark);

  /* Ein Elternteil rückt dorthin, wo sein bester Schritt steht: Sonst
     rutschte die zerlegte Aufgabe ans Ende und ihr startbarer erster
     Schritt mit ihr. */
  const rank=t=>t.state==='active'?0:t.state==='ready'?(inReach(t)?1:2)
    :t.state==='blocked'?3:4;
  const best=new Map();
  const bestOf=t=>{
    if(best.has(t.id)) return best.get(t.id);
    best.set(t.id,rank(t));
    let r=rank(t);
    for(const c of kids.get(t.id)||[]) r=Math.min(r,bestOf(c));
    best.set(t.id,r);
    return r;
  };
  const order=(a,b)=>bestOf(a)-bestOf(b)||a.activationEnergy-b.activationEnergy
    ||String(a.title).localeCompare(String(b.title),'de');

  const out=document.createDocumentFragment();
  const drawn=new Set();
  const emit=(t,depth)=>{
    if(!keep.has(t.id)||drawn.has(t.id)) return;
    drawn.add(t.id);
    const children=(kids.get(t.id)||[]).slice().sort(order);
    out.append(taskRow(t,cap,depth,children));
    for(const c of children) emit(c,depth+1);
  };
  for(const t of roots.slice().sort(order)) emit(t,0);

  if(!tasks.length){
    out.append(el('p',{},'Nichts eingetragen. Was du links erfasst, landet zuerst im Eingang.'));
  }else if(!keep.size){
    out.append(el('p',{},'Nichts passt zu dieser Auswahl.'),
      el('div',{class:'row'},el('button',{class:'btn quiet',onclick:()=>{
        setTPref('q','');setTPref('reach',false);setTPref('overdue',false);setTPref('done',false);
        render();
      }},'Filter zurücksetzen')));
  }
  put(box,out);
}

/* Vier Stufen, abgeleitet aus einem Abstand — nicht aus einer Meinung über
   die Aufgabe. Erledigtes bleibt neutral: Eine Frist, die nicht mehr läuft,
   misst nichts mehr. */
function dueRamp(t){
  if(!t.decayAt||t.state==='done'||t.state==='dropped') return null;
  const hours=(new Date(t.decayAt).getTime()-Date.now())/36e5;
  return hours<0?'over':hours<24?'day':hours<72?'days':null;
}

function taskRow(t,cap,depth,children){
  const cls=['item'];
  if(t.state==='active') cls.push('run');
  if(t.state==='done') cls.push('done');
  const acts=[];
  if(t.state==='active'){
    acts.push(el('button',{class:'btn primary',onclick:()=>act(t.id,'complete')},'Erledigt'),
      el('button',{class:'btn',onclick:()=>act(t.id,'release')},'Zurücklegen'));
  }else if(t.state==='ready'){
    acts.push(el('button',{class:'btn primary',onclick:()=>act(t.id,'start')},'Anfangen'),
      el('button',{class:'btn',onclick:()=>act(t.id,'complete')},'Erledigt'),
      el('button',{class:'btn quiet',onclick:()=>atomizeDialog({taskId:t.id,title:t.title})},'Zerlegen'));
  }
  // Gezählt wird auf dem Gerät: Zweimal dieselbe Zählung wäre zweimal die
  // Gelegenheit, sie unterschiedlich zu machen. Die Liste hier zählt nur,
  // solange der Server die Zahlen nicht mitliefert.
  const total=t.childCount===undefined?children.length:t.childCount;
  const doneKids=t.doneCount===undefined
    ?children.filter(c=>c.state==='done').length:t.doneCount;
  return el('div',{class:cls.join(' '),'data-due':dueRamp(t),
    style:'--depth:'+Math.min(depth,6)},
    el('span',{class:'bar'}),
    el('div',{},el('div',{class:'title'},t.title),
      el('div',{class:'meta'},
        el('span',{},'START '+t.activationEnergy+'/10'),
        el('span',{},'SOG '+t.salience),
        el('span',{},'FOLGEN '+t.stakes),
        t.decayAt?el('span',{class:'due'},dueLabel(t.decayAt)):null,
        total?el('span',{},'TEILSCHRITTE '+doneKids+' VON '+total):null,
        t.state==='ready'&&!(t.activationEnergy<=cap/10)
          ?el('span',{},'NICHT IN REICHWEITE'):null)),
    el('div',{class:'acts'},acts));
}

function rationaleOf(rule){
  if(rule._rationale===undefined){
    try{rule._rationale=String(parseRuleDraft(rule.yaml||'').rationale||'')}
    catch(e){rule._rationale=String(rule.condition||'')}
  }
  return rule._rationale;
}

    oninput:e=>{out.textContent=e.target.value}});

    el('div',{class:'ends'},el('span',{},low),el('span',{},high)));

  return box;

/* ── Regeleditor ─────────────────────────────────────────────────────
   Dasselbe wie am Telefon, nur mit Platz. Der Wortschatz kommt aus der
   Engine (/api/vocabulary) — der Editor bietet deshalb nur an, was sie
   versteht, statt eine Regel bauen zu lassen, die beim Laden abgelehnt
   wird. Jede Änderung wird gegen den Zustand von JETZT ausgewertet: Wer
   nachrechnen kann, muss nicht glauben (G2).

   Was er nicht tut: Er schreibt nicht nach rules/. Die Änderung liegt als
   Overlay in der Datenbank und lässt sich als YAML zurückkopieren. Und er
   lässt keine Regel sofort sprechen — sieben Tage stumm, ohne Ausnahme. */
let editor=null,vocab=null,vocabError=false,previewTimer=null;
let refPreview=null,refProblems=null,refSave=null;

async function openEditor(rule){
  if(S.configLocked) return;
  if(!vocab&&!vocabError){
    try{vocab=await api('/api/vocabulary')}catch(e){vocabError=true}
  }
  const draft=rule?draftOf(rule):newDraft();
  if(vocabError&&draft.mode!=='yaml'){draft.mode='yaml';draft.raw=yamlOrRaw(draft)}
  editor=draft;
  render();previewSoon();
}
function closeEditor(){clearTimeout(previewTimer);editor=null;render()}

function draftOf(rule){
  try{
    const d=parseRuleDraft(rule.yaml||'');
    d.edited=!!(rule.edited||rule.overridden);
    return d;
  }catch(e){
    // Lieber roh als gar nicht: Eine Regel, die dieser Editor nicht
    // darstellen kann, bleibt trotzdem bearbeitbar.
    const d=newDraft();
    d.id=rule.id;d.isNew=false;d.edited=!!(rule.edited||rule.overridden);
    d.mode='yaml';d.raw=rule.yaml||'';d.parseError=e.message;
    return d;
  }
}
function yamlOrRaw(d){try{return ruleYaml(d)}catch(e){return d.raw||''}}

/* Neue Regeln bekommen Nummern ab R-200. Darunter liegt das mitgelieferte
   Regelwerk; würde der Editor dort hineinvergeben, kollidierte die nächste
   ausgelieferte Regel mit einer selbst geschriebenen. */
function newDraft(){
  const used=rules.map(r=>parseInt(String(r.id).replace('R-',''),10))
    .filter(n=>Number.isFinite(n)&&n>=200);
  const next=used.length?Math.max(...used)+1:200;
  return {id:'R-'+String(next).padStart(3,'0'),isNew:true,edited:false,mode:'guided',
    title:'',rationale:'',deficit:null,severity:'nudge',priority:50,
    cooldownMinutes:120,maxPerDay:0,backoff:false,
    action:'notify',params:{},enabled:true,
    extra:{titles:{},rationales:{}},
    root:{t:'group',any:false,negated:false,children:[newLeaf()]},
    raw:null,preview:null,parseError:null};
}
function newLeaf(){
  const leaf={t:'leaf',kind:'number',negated:false,variable:'capacity',
    event:'checkin',op:'lt',number:40,symbol:'',from:'22:00',to:'05:00'};
  switchKind(leaf,'number');
  return leaf;
}
/* Beim Wechsel der Art gleich passende Voreinstellungen setzen: Sonst
   stünde dort ein Operator, den die neue Art nicht kennt — und die Regel
   liesse sich erst nach einem weiteren, unerklärten Schritt speichern. */
function switchKind(f,kind){
  const numerics=(vocab&&vocab.numerics)||[],symbolics=(vocab&&vocab.symbolics)||[],
    evts=(vocab&&vocab.events)||[];
  f.kind=kind;
  if(kind==='number'){f.variable=(numerics[0]||{id:'capacity'}).id;f.op='lt';f.number=40}
  else if(kind==='choice'){
    const first=symbolics[0];
    f.variable=first?first.id:'load_level';
    f.symbol=first?(Object.keys(first.values||{})[0]||''):'L2';
    f.op='eq';
  }else if(kind==='since'){f.event=(evts[0]||{id:'checkin'}).id;f.op='gte';f.number=120}
  else if(kind==='count'){f.event=(evts[0]||{id:'checkin'}).id;f.op='lt';f.number=1}
}

      el('div',{class:'eyebrow',style:'margin-top:.5rem'},'WORAUF SIE EINZAHLT'),

        v=>{d.priority=v},
        'Feuern zwei Regeln gleichzeitig, gewinnt die mit dem höheren Rang. Bei Gleichstand entscheidet die Nummer — nie der Zufall.'),
      el('div',{class:'pick',style:'margin-top:.6rem'},
        el('button',{class:'tog','aria-pressed':d.enabled?'true':'false',
          onclick:()=>{d.enabled=!d.enabled;redraw()}},'REGEL AKTIV'),
        el('button',{class:'tog','aria-pressed':d.backoff?'true':'false',

function rationaleField(d){
  const box=el('textarea',{style:'min-height:6.5rem',

  return box;

function numberField(value,min,max,set){
  return el('input',{type:'number',min,max,value,style:'width:6.5rem',
    oninput:e=>{set(Number(e.target.value));previewSoon();refreshVerdict()}});

function timeField(value,set){
  return el('input',{type:'time',value:value||'00:00',style:'width:8.5rem',
    oninput:e=>{set(e.target.value);previewSoon();refreshVerdict()}});
}
function sel(items,value,onChange,label){
  const box=el('select',{class:'slim','aria-label':label||'',
    onchange:e=>onChange(e.target.value)});
  for(const it of items){
    const option=el('option',{value:String(it.v)},it.l||String(it.v));
    if(String(it.v)===String(value)) option.selected=true;
    box.append(option);
  }
  return box;
}
function stepper(label,steps,value,unit,set,meaning,zeroLabel){
  return el('div',{style:'margin-top:.3rem'},
    el('label',{},label),
    el('div',{class:'pick'},steps.map(s=>el('button',
      {class:'btn'+(s===value?' primary':''),onclick:()=>{set(s);redraw()}},
      s===0&&zeroLabel?zeroLabel:(unit?s+' '+unit:String(s))))),
    meaning?el('p',{class:'hint',style:'margin-top:.35rem'},meaning):null);
}

function deficitPicker(d){
  const list=(vocab&&vocab.deficits)||[];
  if(!list.length) return el('p',{class:'hint'},'Keine Liste abrufbar. Ohne Zuordnung ist eine Regel verdächtig.');
  return el('div',{class:'pick'},list.map(x=>el('button',
    {class:'btn'+(d.deficit===x.id?' primary':''),
     onclick:()=>{d.deficit=d.deficit===x.id?null:x.id;redraw()}},
    x.id+' · '+x.label)));
}
function severityPicker(d){
  const list=((vocab&&vocab.severities)||[]);
  const shown=list.length?list:[{id:d.severity,label:d.severity}];
  const current=list.find(s=>s.id===d.severity);
  return [el('div',{class:'pick'},shown.map(s=>el('button',
    {class:'btn'+(d.severity===s.id?' primary':''),
     onclick:()=>{d.severity=s.id;redraw()}},String(s.label||s.id).toUpperCase()))),
    current&&current.meaning?el('p',{class:'hint'},current.meaning):null];
}
function actionPicker(d){
  const list=(vocab&&vocab.actions)||[];
  const spec=list.find(a=>a.type===d.action);
  const kids=[sel(list.length?list.map(a=>({v:a.type,l:a.label})):[{v:d.action,l:d.action}],
    d.action,v=>{d.action=v;redraw()},'Was die Regel auslöst')];
  if(spec&&spec.meaning) kids.push(el('p',{class:'hint'},spec.meaning));
  // Welche Angaben eine Aktion braucht, sagt die Engine — sonst wäre die
  // Liste hier eine zweite Wahrheit, die still veraltet.
  const declared=(spec&&spec.params)||(d.action==='notify'?{text:'Was dort stehen soll'}:{});
  for(const [name,label] of Object.entries(declared)){
    kids.push(el('label',{style:'margin-top:.5rem'},label+' (optional)'),
      textField(d.params[name]===undefined?'':String(d.params[name]),name,v=>{
        const text=v.trim();
        if(!text) delete d.params[name];
        // Zahlen als Zahlen: `max_seconds: "15"` läse die Engine als Text.
        else d.params[name]=/^-?\d+$/.test(text)?Number(text):text;
      }));
  }
  const rest=Object.keys(d.params).filter(k=>!(k in declared));
  if(rest.length) kids.push(el('p',{class:'hint'},
    'Unverändert übernommen: '+rest.map(k=>k+': '+scalarYaml(d.params[k])).join(', ')));
  return kids;
}

/* ── Bedingungsbaum ──────────────────────────────────────────────────
   „nicht" ist ein Schalter an der Bedingung, keine dritte Sorte Knoten:
   Eine Ebene weniger im Baum ist eine Entscheidung weniger beim Lesen. */
function groupCard(g,depth,onRemove){
  const box=el('div',{class:'cond grp'});
  box.append(el('div',{class:'top'},
    el('button',{class:'tog','aria-pressed':g.any?'false':'true',
      onclick:()=>{g.any=false;redraw()}},'ALLE'),
    el('button',{class:'tog','aria-pressed':g.any?'true':'false',
      onclick:()=>{g.any=true;redraw()}},'EINE VON'),
    notToggle(g),
    onRemove?el('button',{class:'btn quiet',onclick:onRemove},'Gruppe entfernen'):null));
  g.children.forEach((child,i)=>{
    const remove=()=>{g.children.splice(i,1);redraw()};
    box.append(child.t==='group'
      ?groupCard(child,depth+1,remove)
      :leafCard(child,(depth===0&&g.children.length===1)?null:remove));
  });
  box.append(el('div',{class:'pick'},
    el('button',{class:'btn quiet',onclick:()=>{g.children.push(newLeaf());redraw()}},'+ Bedingung'),
    // Verschachtelung bis zur dritten Ebene: Drei sind lesbar, vier sind
    // ein Programm.
    depth<2?el('button',{class:'btn quiet',onclick:()=>{
      g.children.push({t:'group',any:!g.any,negated:false,children:[newLeaf()]});redraw();
    }},'+ Gruppe'):null));
  return box;
}
function notToggle(node){
  return el('button',{class:'tog','aria-pressed':node.negated?'true':'false',
    onclick:()=>{node.negated=!node.negated;redraw()}},'NICHT');
}
function leafCard(f,onRemove){
  const kinds=[{v:'number',l:'Zahl'},{v:'choice',l:'Auswahl'},{v:'time',l:'Uhrzeit'},
    {v:'since',l:'Seit einem Ereignis'},{v:'count',l:'Anzahl heute'}];
  const box=el('div',{class:'cond'});
  box.append(el('div',{class:'top'},
    sel(kinds,f.kind,v=>{switchKind(f,v);redraw()},'Art der Bedingung'),
    notToggle(f),
    onRemove?el('button',{class:'btn quiet',onclick:onRemove},'Entfernen'):null));
  box.append(el('div',{class:'fields'},leafFields(f)));
  const meaning=leafMeaning(f);
  if(meaning) box.append(el('p',{class:'now'},meaning));
  const actual=leafActual(f);
  if(actual!==null) box.append(el('p',{class:'now'},'jetzt: '+actual));
  return box;
}
function leafFields(f){
  const numerics=(vocab&&vocab.numerics)||[],symbolics=(vocab&&vocab.symbolics)||[],
    evts=(vocab&&vocab.events)||[];
  if(f.kind==='number'){
    // Grenzen kommen aus dem Wortschatz: geraten läge jede andere Skala daneben.
    const spec=numerics.find(v=>v.id===f.variable)||{};
    return [
      sel(numerics.map(v=>({v:v.id,l:v.label})),f.variable,v=>{f.variable=v;redraw()},'Größe'),
      sel(opItems(false),f.op,v=>{f.op=v;redraw()},'Vergleich'),
      numberField(f.number,spec.min===undefined?0:spec.min,
        spec.max===undefined?100:spec.max,v=>{f.number=v})];
  }
  if(f.kind==='choice'){
    const spec=symbolics.find(s=>s.id===f.variable);
    const values=spec?Object.entries(spec.values||{}):[];
    return [
      sel(symbolics.map(v=>({v:v.id,l:v.label})),f.variable,v=>{
        f.variable=v;
        const next=symbolics.find(s=>s.id===v);
        f.symbol=next?(Object.keys(next.values||{})[0]||''):'';
        redraw();
      },'Größe'),
      sel(opItems(true),f.op,v=>{f.op=v;redraw()},'Vergleich'),
      values.map(([key,label])=>el('button',
        {class:'btn'+(f.symbol===key?' primary':''),
         onclick:()=>{f.symbol=key;redraw()}},label))];
  }
  if(f.kind==='time') return [
    el('span',{class:'hint'},'von'),timeField(f.from,v=>{f.from=v}),
    el('span',{class:'hint'},'bis'),timeField(f.to,v=>{f.to=v})];
  return [
    sel(evts.map(v=>({v:v.id,l:v.label})),f.event,v=>{f.event=v;redraw()},'Ereignis'),
    sel(opItems(false),f.op,v=>{f.op=v;redraw()},'Vergleich'),
    numberField(f.number,0,f.kind==='since'?1440:50,v=>{f.number=v}),
    el('span',{class:'hint'},f.kind==='since'?'Minuten':'mal heute')];
}
/* Welche Operatoren es gibt und wie sie heißen, sagt die Engine. Die Liste
   hier ist nur die Rückfallebene, solange der Wortschatz nicht da ist —
   und zugleich die Menge der Schlüssel, an denen der Leser einen Vergleich
   im YAML erkennt. */
const OPS={lt:'kleiner als',lte:'höchstens',gte:'mindestens',gt:'größer als',
  eq:'genau',ne:'nicht'};
function opItems(symbolic){
  const source=(vocab&&vocab.operators)||{};
  const labels=(vocab&&vocab.operatorLabels)||{};
  const raw=(symbolic?source.symbolic:source.numeric)||
    (symbolic?['eq','ne']:Object.keys(OPS));
  return raw.map(o=>typeof o==='string'
    ?{v:o,l:labels[o]||OPS[o]||o}
    :{v:o.id||o.op||o.token,l:o.label||labels[o.id]||OPS[o.id]||o.id});
}
function leafMeaning(f){
  const find=(list,id)=>((vocab&&vocab[list])||[]).find(x=>x.id===id);
  if(f.kind==='number') return (find('numerics',f.variable)||{}).meaning||'';
  if(f.kind==='choice') return (find('symbolics',f.variable)||{}).meaning||'';
  if(f.kind==='time') return 'Über Mitternacht hinweg erlaubt — 22:00 bis 05:00 meint die Nacht.';
  if(f.kind==='since') return 'Ein Ereignis, das nie eintrat, gilt als unendlich lange her.';
  return '';
}
/* Was gerade tatsächlich anliegt — die halbe Miete beim Regelschreiben.
   Zahlen kommen aus dem Zustand, den die Kopfzeile ohnehin zeigt. */
function leafActual(f){
  if(f.kind==='number'){
    const v=(S.values||{})[f.variable];
    return v&&v.value!==null&&v.value!==undefined?String(v.value):null;
  }
  if(f.kind==='choice') return f.variable==='load_level'?(S.loadLevel||null):null;
  if(f.kind==='time') return new Date().toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'});
  return null;
}

/* ── Vorschau, Probleme, Speichern ───────────────────────────────── */
function previewSoon(){
  clearTimeout(previewTimer);
  const d=editor;
  if(!d) return;
  previewTimer=setTimeout(async()=>{
    const yaml=currentYaml();
    if(yaml===null){d.preview=null;d.previewError=null;refreshVerdict();return}
    try{
      const result=await api('/api/rules/preview',{method:'POST',body:JSON.stringify({yaml})});
      if(editor!==d) return;
      d.preview=result;d.previewError=null;
    }catch(e){
      // Eine Vorschau, die den Server nicht erreicht, ist kein Urteil über
      // die Regel — sie darf das Speichern deshalb nicht sperren. Geprüft
      // wird beim Speichern ohnehin, und Abgelehntes wird nicht gespeichert.
      if(editor!==d) return;
      d.preview=null;d.previewError=e.message;
    }
    refreshVerdict();
  },400);
}
function refreshVerdict(){
  if(!editor) return;
  if(refPreview) put(refPreview,previewKids());
  if(refProblems) put(refProblems,problemKids());
  if(refSave) refSave.disabled=!canSave();
}
function previewKids(){
  const p=editor.preview;
  const head=el('span',{class:'eyebrow'},'MIT DEM ZUSTAND VON JETZT');
  if(editor.previewError) return [head,el('p',{class:'faint',style:'margin-top:.4rem'},
    'Die Vorschau ist gerade nicht erreichbar ('+editor.previewError+'). Beim Speichern wird trotzdem geprüft.')];
  if(!p) return [head,el('p',{class:'faint',style:'margin-top:.4rem'},'Wird geprüft …')];
  const kids=[head];
  if(p.ok===false){
    kids.push(el('p',{style:'margin-top:.4rem;color:var(--caution)'},
      'So lässt sich die Regel nicht laden. Was fehlt, steht darunter.'));
  }else{
    kids.push(el('h2',{style:'margin:.4rem 0'},
      p.firesNow?'Sie würde jetzt feuern.':'Sie würde jetzt nicht feuern.'));
    if(p.explanation) kids.push(el('p',{class:'why'},p.explanation));
    // Der erklärende Satz nennt die scheiternde Stelle bereits. Nur wenn er
    // fehlt, steht sie hier für sich.
    else if(!p.firesNow&&p.failedAt) kids.push(el('p',{class:'mono',style:'font-size:.8rem'},
      'Es scheitert an: '+p.failedAt));
  }
  for(const w of p.warnings||[]) kids.push(el('p',{class:'faint',style:'margin-top:.4rem'},w));
  return kids;
}
function problemKids(){
  const list=clientProblems();
  const p=editor.preview;
  if(p&&p.ok===false) for(const e of p.errors||[]) if(list.indexOf(e)<0) list.push(e);
  if(!list.length) return [];
  return [el('div',{class:'panel',style:'margin-top:1rem;border-color:color-mix(in srgb,var(--caution) 55%,var(--rule))'},
    el('span',{class:'eyebrow'},'FEHLT NOCH'),
    list.map(x=>el('p',{style:'margin-top:.4rem'},'· '+x)))];
}
/* Dieselben Pflichten wie im Validator, nur früher. `rationale` und
   `cooldown` sind keine Formalien: ohne Begründung ist eine Ausgabe nicht
   nachvollziehbar (G2), ohne Abstand entsteht Meldungsflut (R2). */
function clientProblems(){
  const d=editor,out=[];
  if(d.mode==='yaml'){
    if(!String(d.raw||'').trim()) out.push('Der Text ist leer.');
    return out;
  }
  if(String(d.title||'').trim().length<3)
    out.push('Der Titel fehlt. Er steht später in der Meldung.');
  if(String(d.rationale||'').trim().length<40)
    out.push('Die Begründung ist zu kurz. Sie erscheint im Systeminspektor und muss in einem halben Jahr noch erklären, warum es diese Regel gibt.');
  if(!(d.cooldownMinutes>=1))
    out.push('Ohne Abstand meldet sich die Regel beliebig oft.');
  try{condMap(d.root)}catch(e){out.push(e.message)}
  return out;
}
function canSave(){
  if(!editor) return false;
  if(currentYaml()===null) return false;
  if(clientProblems().length) return false;
  const p=editor.preview;
  return !(p&&p.ok===false);
}
function currentYaml(){
  const d=editor;
  if(!d) return null;
  if(d.mode==='yaml') return d.raw||'';
  try{return ruleYaml(d)}catch(e){return null}
}
function setMode(mode){
  const d=editor;
  if(!d||mode===d.mode) return;
  if(mode==='yaml'){
    const yaml=currentYaml();
    if(yaml===null){toast('Erst vervollständigen — der Entwurf ergibt noch kein YAML.');return}
    d.raw=yaml;d.mode='yaml';
  }else{
    if(vocabError){toast('Ohne den Wortschatz der Engine geht geführt nicht.');return}
    let parsed;
    try{parsed=parseRuleDraft(d.raw||'')}
    catch(e){toast('Der Text lässt sich nicht lesen: '+e.message);return}
    // Die Nummer bleibt, was sie war: IDs werden nicht umgebogen.
    parsed.id=d.id;parsed.isNew=d.isNew;parsed.edited=d.edited;
    parsed.preview=d.preview;parsed.mode='guided';
    editor=parsed;
  }
  redraw();
}
function shadowPanel(){
  return el('div',{class:'panel',style:'margin-top:1rem;border-color:color-mix(in srgb,var(--info) 50%,var(--rule))'},
    el('span',{class:'eyebrow'},'SIEBEN TAGE STUMM'),
    el('p',{style:'margin-top:.5rem'},
      'Die Regel läuft ab dem Speichern mit und wird protokolliert, sagt aber nichts. Im Systeminspektor siehst du, wie oft sie gefeuert hätte — danach entscheidest du, ob sie das wirklich soll.'));
}
async function saveRule(){
  const d=editor,yaml=currentYaml();
  if(yaml===null||!canSave()) return;
  try{
    await api('/api/rules/'+encodeURIComponent(d.id),
      {method:'PUT',body:JSON.stringify({yaml})});
    editor=null;
    toast('Gespeichert — läuft sieben Tage stumm mit.');
    await reload();
  }catch(e){
    const issues=(e.data&&e.data.issues)||[];
    if(issues.length){d.preview={ok:false,errors:issues};refreshVerdict()}
    toast(issues.length?issues[0]:e.message);
  }
}
async function resetRule(){
  const d=editor;
  if(!confirm('Die eigene Fassung von '+d.id+' entfernen? Danach gilt wieder die mitgelieferte Regel; eine selbst geschriebene verschwindet. Die Nummer wird nicht wiederverwendet.')) return;
  try{
    await api('/api/rules/'+encodeURIComponent(d.id),{method:'DELETE'});
    editor=null;toast('Zurückgenommen.');await reload();
  }catch(e){toast(e.message)}
}

/* ── YAML, so viel wie das Regelwerk braucht ─────────────────────────
   Kein allgemeiner Parser: Blockabbildungen, Blocklisten, Fließformen und
   gefaltete Textblöcke — genau die Formen, die in rules/ vorkommen. Mehr
   wäre eine zweite Baustelle; weniger reichte nicht, um eine geladene
   Regel wieder geführt darzustellen.

   Geschrieben wird in derselben Form wie ruleToYaml in axiom_data: Ein
   Export soll sich nicht daran erkennen lassen, dass er aus dem Browser
   kommt — er muss nach rules/ zurückkopiert werden können. */
function ruleYaml(d){
  let out='- id: '+d.id+'\n  title: '+quoteYaml(d.title)+'\n';
  for(const [lang,text] of Object.entries(d.extra.titles||{}))
    out+='  title_'+lang+': '+quoteYaml(text)+'\n';
  if(d.deficit) out+='  deficit: '+d.deficit+'\n';
  out+=foldedYaml('rationale',d.rationale);
  for(const [lang,text] of Object.entries(d.extra.rationales||{}))
    out+=foldedYaml('rationale_'+lang,text);
  out+='  when:\n'+condYaml(condMap(d.root),4);
  out+='  then:\n    action: '+d.action+'\n';
  if(Object.keys(d.params||{}).length) out+='    params: '+flowYaml(d.params)+'\n';
  out+='  priority: '+d.priority+'\n  severity: '+d.severity+'\n';
  const cooldown={minutes:d.cooldownMinutes};
  if(d.maxPerDay) cooldown.max_per_day=d.maxPerDay;
  if(d.backoff) cooldown.backoff='exponential';
  out+='  cooldown: '+flowYaml(cooldown)+'\n  enabled: '+(d.enabled?'true':'false')+'\n';
  return out;
}
function condMap(n){
  if(n.t==='group'){
    if(!n.children.length) throw new Error('Eine Gruppe braucht mindestens eine Bedingung.');
    const built=n.children.map(condMap);
    // Eine Gruppe mit einem Kind ist im YAML unnötig — im Editor bleibt sie
    // trotzdem, damit „eine zweite hinzufügen" ein Klick bleibt.
    const inner=built.length===1?built[0]:(n.any?{any:built}:{all:built});
    return n.negated?{not:inner}:inner;
  }
  const number=Number(n.number);
  let inner;
  if(n.kind==='number'||n.kind==='since'||n.kind==='count'){
    if(!Number.isFinite(number)) throw new Error('Eine Zahl fehlt.');
  }
  if(n.kind==='number') inner={[n.variable]:{[n.op]:number}};
  else if(n.kind==='choice'){
    if(!n.symbol) throw new Error('Ein Wert fehlt.');
    inner={[n.variable]:{[n.op]:n.symbol}};
  }else if(n.kind==='time'){
    if(!/^\d{2}:\d{2}$/.test(String(n.from))||!/^\d{2}:\d{2}$/.test(String(n.to)))
      throw new Error('Uhrzeit im Format 22:00 angeben.');
    inner={time_between:[n.from,n.to]};
  }else if(n.kind==='since') inner={minutes_since:{event:n.event,[n.op]:Math.round(number)}};
  else inner={count_today:{event:n.event,[n.op]:Math.round(number)}};
  return n.negated?{not:inner}:inner;
}
function condYaml(node,indent){
  const pad=' '.repeat(indent);
  const key=Object.keys(node)[0],value=node[key];
  if(key==='all'||key==='any'){
    let out=pad+key+':\n';
    for(const child of value) out+=pad+'  - '+condYaml(child,indent+4).replace(/^\s+/,'');
    return out;
  }
  if(key==='not') return pad+'not:\n'+condYaml(value,indent+2);
  if(key==='time_between') return pad+'time_between: ['+value.map(scalarYaml).join(', ')+']\n';
  return pad+key+': '+flowYaml(value)+'\n';
}
function flowYaml(map){
  return '{ '+Object.entries(map).map(([k,v])=>k+': '+scalarYaml(v)).join(', ')+' }';
}
function scalarYaml(value){
  if(typeof value==='number'||typeof value==='boolean') return String(value);
  if(Array.isArray(value)) return '['+value.map(scalarYaml).join(', ')+']';
  const text=String(value);
  // Unquotiert nur, wo YAML es garantiert wieder als Text liest.
  return /^[A-Za-z][A-Za-z0-9_.-]*$/.test(text)?text:quoteYaml(text);
}
const quoteYaml=text=>'"'+String(text).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
/* Gefalteter Block, Umbruch bei 72 Zeichen — `>-` statt `>`, sonst käme
   der Text mit einem Zeilenumbruch zurück, den niemand geschrieben hat. */
function foldedYaml(key,text){
  const words=String(text||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  let out='  '+key+': >-\n',line='   ';
  for(const word of words){
    if(line.length+word.length+1>72){out+=line+'\n';line='   '}
    line+=' '+word;
  }
  if(line.trim()) out+=line+'\n';
  return out;
}

function parseRuleDraft(text){
  const doc=yamlParse(text);
  const node=Array.isArray(doc)?doc[0]:doc;
  if(!node||typeof node!=='object') throw new Error('Keine Regel gefunden.');
  const extra={titles:{},rationales:{}};
  for(const key of Object.keys(node)){
    if(key.startsWith('title_')) extra.titles[key.slice(6)]=String(node[key]);
    if(key.startsWith('rationale_')) extra.rationales[key.slice(10)]=String(node[key]);
  }
  const cooldown=node.cooldown||{},then=node.then||{};
  return {
    id:String(node.id||''),isNew:false,edited:false,mode:'guided',
    title:String(node.title||''),rationale:String(node.rationale||''),
    deficit:node.deficit?String(node.deficit):null,
    severity:String(node.severity||'nudge'),
    priority:typeof node.priority==='number'?node.priority:50,
    cooldownMinutes:typeof cooldown.minutes==='number'?cooldown.minutes:120,
    maxPerDay:typeof cooldown.max_per_day==='number'?cooldown.max_per_day:0,
    backoff:String(cooldown.backoff||'')==='exponential',
    action:String(then.action||'notify'),
    params:Object.assign({},then.params||{}),
    enabled:node.enabled!==false,
    extra,root:rootNode(node.when),raw:null,preview:null,parseError:null};
}
/* Der Wurzelknoten ist immer eine Gruppe — auch bei einer einzelnen
   Bedingung. So ist „eine zweite hinzufügen" ein Klick und kein Umbau. */
function rootNode(when){
  if(!when||typeof when!=='object') throw new Error('Der Wenn-Teil fehlt.');
  const node=condNode(when,false);
  return node.t==='group'?node:{t:'group',any:false,negated:false,children:[node]};
}
function condNode(map,negated){
  if(!map||typeof map!=='object') throw new Error('Eine Bedingung ist leer.');
  const key=Object.keys(map)[0];
  const value=map[key];
  if(key==='not') return condNode(value,!negated);
  if(key==='all'||key==='any') return {t:'group',any:key==='any',negated,
    children:(value||[]).map(child=>condNode(child,false))};
  const leaf=newLeaf();
  leaf.negated=negated;
  if(key==='time_between'){
    leaf.kind='time';
    leaf.from=String((value||[])[0]||'00:00');
    leaf.to=String((value||[])[1]||'00:00');
    return leaf;
  }
  if(key==='minutes_since'||key==='count_today'){
    const op=opOf(value);
    leaf.kind=key==='minutes_since'?'since':'count';
    leaf.event=String(value.event||'checkin');
    leaf.op=op;leaf.number=Number(value[op]);
    return leaf;
  }
  const op=opOf(value);
  const raw=value[op];
  const symbolic=((vocab&&vocab.symbolics)||[]).some(s=>s.id===key);
  if(symbolic||typeof raw!=='number'){
    leaf.kind='choice';leaf.variable=key;leaf.op=op;leaf.symbol=String(raw);
  }else{
    leaf.kind='number';leaf.variable=key;leaf.op=op;leaf.number=raw;
  }
  return leaf;
}
function opOf(value){
  if(!value||typeof value!=='object') throw new Error('Ein Vergleich fehlt.');
  const op=Object.keys(value).find(k=>OPS[k]!==undefined);
  if(!op) throw new Error('Unbekannter Vergleich in: '+Object.keys(value).join(', '));
  return op;
}

function yamlParse(src){
  const lines=String(src).replace(/\t/g,'  ').split('\n').map(raw=>{
    const trimmed=raw.trim();
    return {raw,indent:raw.search(/\S/),blank:trimmed===''||trimmed[0]==='#'};
  });
  let i=0;
  const skip=()=>{while(i<lines.length&&lines[i].blank) i++};
  const isItem=line=>{
    const t=cutComment(line.raw).trim();
    return t==='-'||t.startsWith('- ');
  };

  function value(min){
    skip();
    if(i>=lines.length) return null;
    const line=lines[i];
    if(line.indent<min) return null;
    return isItem(line)?seq(line.indent):map(line.indent);
  }
  function seq(indent){
    const arr=[];
    for(;;){
      skip();
      if(i>=lines.length) break;
      const line=lines[i];
      if(line.indent!==indent||!isItem(line)) break;
      const rest=cutComment(line.raw).trim().slice(1).trim();
      if(rest===''){i++;arr.push(value(indent+1));continue}
      if(/^[^\s#{}[\]"',]+\s*:(\s|$)/.test(rest)){
        // Der Eintrag beginnt eine Abbildung in derselben Zeile.
        lines[i]={raw:' '.repeat(indent+2)+rest,indent:indent+2,blank:false};
        arr.push(map(indent+2));
      }else{i++;arr.push(flowParse(rest))}
    }
    return arr;
  }
  function map(indent){
    const obj={};
    for(;;){
      skip();
      if(i>=lines.length) break;
      const line=lines[i];
      if(line.indent<indent) break;
      if(isItem(line)&&line.indent===indent) break;
      if(line.indent>indent) throw new Error('Die Einrückung passt nicht: '+line.raw.trim());
      const text=cutComment(line.raw).trim();
      const m=text.match(/^([^:\s]+)\s*:\s*(.*)$/);
      if(!m) throw new Error('Kein Schlüssel: '+text);
      const key=m[1],rest=m[2].trim();
      i++;
      if(rest===''){
        skip();
        const next=lines[i];
        obj[key]=(next&&next.indent===indent&&isItem(next))?seq(indent):value(indent+1);
      }else if(/^[|>][-+]?$/.test(rest)){
        obj[key]=blockScalar(indent,rest);
      }else obj[key]=flowParse(rest);
    }
    return obj;
  }
  function blockScalar(parentIndent,style){
    const folded=style[0]==='>';
    const parts=[];
    let base=null;
    while(i<lines.length){
      const line=lines[i];
      if(line.raw.trim()===''){parts.push('');i++;continue}
      if(line.indent<=parentIndent) break;
      if(base===null) base=line.indent;
      parts.push(line.raw.slice(base).replace(/\s+$/,''));
      i++;
    }
    while(parts.length&&parts[parts.length-1]==='') parts.pop();
    if(!folded) return parts.join('\n');
    let out='';
    for(const part of parts){
      if(part==='') out+='\n';
      else out+=(out&&!out.endsWith('\n')?' ':'')+part;
    }
    return out;
  }
  return value(0);
}
/* Ein `#` beginnt einen Kommentar nur am Zeilenanfang oder nach einem
   Leerzeichen — und nie innerhalb von Anführungszeichen. */
function cutComment(text){
  let quote=null;
  for(let k=0;k<text.length;k++){
    const c=text[k];
    if(quote){if(c===quote) quote=null;continue}
    if(c==='"'||c==="'"){quote=c;continue}
    if(c==='#'&&(k===0||/\s/.test(text[k-1]))) return text.slice(0,k);
  }
  return text;
}
function flowParse(text){
  const source=cutComment(text).trim();
  return readValue(source,0)[0];
}
function readValue(s,p){
  p=skipSpace(s,p);
  const c=s[p];
  if(c==='{'){
    const obj={};
    p++;
    for(;;){
      p=skipSpace(s,p);
      if(p>=s.length) throw new Error('Klammer nicht geschlossen: '+s);
      if(s[p]==='}'){p++;break}
      let key;
      [key,p]=readKey(s,p);
      p=skipSpace(s,p);
      if(s[p]!==':') throw new Error('Doppelpunkt fehlt: '+s);
      p++;
      let v;
      [v,p]=readValue(s,p);
      obj[key]=v;
      p=skipSpace(s,p);
      if(s[p]===',') p++;
    }
    return [obj,p];
  }
  if(c==='['){
    const arr=[];
    p++;
    for(;;){
      p=skipSpace(s,p);
      if(p>=s.length) throw new Error('Klammer nicht geschlossen: '+s);
      if(s[p]===']'){p++;break}
      let v;
      [v,p]=readValue(s,p);
      arr.push(v);
      p=skipSpace(s,p);
      if(s[p]===',') p++;
    }
    return [arr,p];
  }
  if(c==='"'||c==="'") return readQuoted(s,p);
  let end=p;
  while(end<s.length&&',}]'.indexOf(s[end])<0) end++;
  return [plainScalar(s.slice(p,end).trim()),end];
}
function readKey(s,p){
  if(s[p]==='"'||s[p]==="'") return readQuoted(s,p);
  let end=p;
  while(end<s.length&&s[end]!==':') end++;
  return [s.slice(p,end).trim(),end];
}
function readQuoted(s,p){
  const quote=s[p++];
  let out='';
  while(p<s.length){
    const c=s[p];
    if(c==='\\'&&quote==='"'){out+=s[p+1]==='n'?'\n':s[p+1];p+=2;continue}
    if(c===quote){p++;break}
    out+=c;p++;
  }
  return [out,p];
}
const skipSpace=(s,p)=>{while(p<s.length&&/\s/.test(s[p])) p++;return p};
function plainScalar(text){
  if(text===''||text==='null'||text==='~') return null;
  if(text==='true') return true;
  if(text==='false') return false;
  if(/^-?\d+(\.\d+)?$/.test(text)) return Number(text);
  return text;
}

function helpDialog(){
  const keys=[['n','Erfassen'],['c','Check-in'],['f','Fokus starten oder beenden'],
    ['a','Neue Aufgabe'],['g','Angefangenes erledigen'],['1 … 6','Reiter wechseln'],
    ['r','Neu laden'],['?','Diese Übersicht'],['Esc','Schließen']];
  sheet('Tastenkürzel',el('div',{class:'keys'},
    ...keys.map(([k,t])=>el('div',{},el('span',{},t),el('kbd',{},k)))),[]);
}
$('#help-btn').addEventListener('click',helpDialog);

$('#stop-btn').addEventListener('click',async()=>{
  if(!confirm('Server beenden? Danach ist diese Seite nicht mehr erreichbar.')) return;
  try{await api('/api/stop',{method:'POST'})}catch(e){}
  document.body.innerHTML='<div style="display:grid;place-items:center;min-height:100vh">'+
    '<p style="color:var(--dim)">Der Server ist aus. Die App auf dem Telefon startet ihn wieder.</p></div>';
});

/* ── Tastatur ────────────────────────────────────────────────────────
   Das kann ein Schreibtisch und eine Hand nicht. Ohne Kürzel bleibt das
   hier eine Webseite; mit ihnen ist es ein Werkzeug. */
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey) return;
  if($('#dlg').open) return;
  const tabs=['tasks','inbox','state','rules','review','events'];
  if(e.key>='1'&&e.key<='6'){
    const b=document.querySelector('#tabs button[data-tab="'+tabs[Number(e.key)-1]+'"]');
    if(b) b.click();
    return;
  }
  switch(e.key){
    case 'n': e.preventDefault(); $('#cap-text').focus(); break;
    case 'c': checkinDialog(); break;
    case 'f': S?.focus?endFocusDialog():focusDialog(); break;
    case 'a': taskDialog(); break;
    case 'r': reload(); break;
    case '?': helpDialog(); break;
    case 'g': {const run=(S?.running||[])[0]; if(run) act(run.id,'complete'); break}
  }
});

/* ── Takt ────────────────────────────────────────────────────────────
   Zwei verschiedene Dinge: Die Fokusuhr läuft im Sekundentakt weiter,
   ohne den Server zu fragen. Der Zustand wird alle 20 Sekunden geholt —
   häufiger wäre Last ohne Erkenntnis, seltener fühlte es sich tot an. */
setInterval(()=>{
  if(!S?.focus) return;
  const chip=$('#focus-chip b');
  if(!chip) return;
  chip.textContent=Math.floor((Date.now()-new Date(S.focus.startedAt))/60000)+'/'+S.focus.plannedMinutes+' min';
},1000);
setInterval(()=>{
  if(!$('#app').classList.contains('hide')&&!$('#dlg').open) refresh().catch(()=>{});
},20000);

/* Schon angemeldet? Dann direkt hinein, sonst die Freigabe anbieten. */
api('/api/state').then(async data=>{
  S=data;
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  paintHeader();paintAction();paintCapline();
  await loadSurface();render();
}).catch(()=>showGate());
</script>
