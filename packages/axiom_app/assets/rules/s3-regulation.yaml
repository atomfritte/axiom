# Regeln der Stufen S2/S3, die an Schwellenwerten des Zustandsvektors hängen.
#
# Hier stand, alle Regeln dieser Datei stünden auf `log_only` und erzeugten
# KEINE Ausgabe. Das war seit dem ersten Commit falsch. Wer die Datei
# aufschlug, um zu sehen, was am Gerät sprechen kann, las diese Zusage und
# schloss sie wieder — deshalb konnte ein Zwilling von R-110 hier unbemerkt
# liegen. Der Ist-Stand:
#
#   LIVE    R-020, R-050, R-051, R-070 — sie sprechen
#           R-052, R-090 — severity: enforce, verändern das Systemverhalten
#   SHADOW  R-140 — läuft stumm mit, wird nur protokolliert
#
# Die Schwellen stammen aus weights.yaml und sind noch ungeeicht; der
# Systeminspektor markiert die betroffenen Regeln deshalb.
#
# Für neue Regeln gilt unverändert: Sie starten als `log_only`, laufen
# mindestens sieben Tage stumm mit und werden erst danach im Wochenreview
# umgestellt. Bewertet wird dabei:
#   - Wie oft hätte die Regel gefeuert?  (zu oft = Bedingung zu weit)
#   - Wäre der Rat in der Situation richtig gewesen?
#   - Kollidiert sie mit bestehenden Regeln?
# Siehe docs/04-REGELWERK.md §6 (Regel-Lebenszyklus).
#
# R-080 („Wind-Down-Grenze") stand hier bis zum 06.08.2026 und war dieselbe
# Regel wie R-110 („Abendgrenze") in s2-live.yaml: gleiche Aktion, gleiche
# Parameter, gleiche Severity, überlappendes Zeitfenster. Sie konnte den
# Konflikt nie verlieren und hat R-110 damit zu einer reinen Wiederholung
# gemacht — dieselbe Aufforderung ein zweites Mal, unter anderem Namen und
# mit anderer rule_id (G2). Gestrichen. Die ID bleibt verbrannt und wird nie
# wieder vergeben; `rule_overlap_test.dart` hält den Fall fest.

# ── M5 Sensation Budget ─────────────────────────────────────────────────

- id: R-050
  title: "Reizbedarf proaktiv decken"
  title_en: "Cover stimulation need before it covers itself"
  deficit: D5
  rationale: >
    Ungedeckter Reizbedarf sucht sich den schnellsten Kanal — und der ist
    meist der teuerste (Impulskauf, Substanz, Risikoverhalten im Verkehr).
    Ein geplanter Hochreiz-Slot deckt denselben physiologischen Bedarf zu
    kalkulierbaren Kosten. Reizhunger wird kanalisiert, nicht unterdrückt (G3).
  rationale_en: >
    Uncovered stimulation need finds the fastest channel — and that is
    usually the most expensive one (impulse purchase, substance, risk-taking
    in traffic). A planned high-stimulation slot covers the same
    physiological need at a predictable cost. Stimulation hunger is
    channelled, not suppressed (G3).
  when:
    all:
      - sensation_need: { gte: 70 }
      - capacity: { gte: 30 }          # bei leerem Tank kein Sport-Vorschlag
      - not: { active_slot: { eq: sensation } }
      - time_between: ["07:00", "21:00"]
  then:
    action: suggest_slot
    params:
      pool: [sport, kaelte, musik_laut, wettkampf]
      duration_min: 30
  priority: 60
  severity: nudge
  cooldown: { minutes: 240, max_per_day: 2, backoff: exponential }
  enabled: true

- id: R-051
  title: "Impulsdurchbruch wahrscheinlich — Risikokanäle sichern"
  title_en: "Impulse breakthrough likely — secure the risky channels"
  deficit: D5
  rationale: >
    Bei sehr hohem Reizbedarf und gleichzeitig niedriger Regulationsreserve
    steigt die Wahrscheinlichkeit eines Impulsdurchbruchs deutlich. Der
    Interceptor wird vorsorglich scharf gestellt — kein Verbot, nur Latenz.
  rationale_en: >
    With very high stimulation need and low regulation reserve at the
    same time, the probability of an impulse breakthrough rises sharply. The
    interceptor is armed as a precaution — no ban, only latency.
  when:
    all:
      - sensation_need: { gte: 85 }
      - regulation: { lt: 50 }
  then:
    action: start_cooldown
    params: { arm_channels: [purchase, order, message] }
  priority: 85
  severity: intervene
  cooldown: { minutes: 180, max_per_day: 2, backoff: exponential }
  enabled: true

# Hier stand `severity: intervene`. Damit war die Regel sechs von sieben
# Stunden tot: Ihr Fenster reicht von 22:00 bis 05:00, die Ruhezeit aus
# limits.yaml von 23:00 bis 06:30, und die Ruhezeit lässt nur `enforce`
# durch. Von 23:00 bis 05:00 traf die Bedingung jedes Mal zu und wurde jedes
# Mal mit SkipReason.quietHours verworfen — genau der Fall, den die
# Begründung als Zweck nennt („eine Bestellung um 01:00"), konnte nie
# eintreten. Übrig blieb die Stunde 22:00–22:59.
#
# Von den drei möglichen Auflösungen ist das Heben der Severity die einzige,
# die die Regel behält: Ein auf 22:00–22:59 gekürztes Fenster wäre ehrlich,
# aber es hätte den Namen „Nachtbestellung" ohne die Nacht behalten. Und die
# Ruhezeit selbst gilt für alle Regeln — sie wegen einer zu öffnen, wäre der
# teuerste Weg.
- id: R-052
  title: "Nachtbestellung abfangen"
  title_en: "Intercept night-time orders"
  deficit: D5
  rationale: >
    Nachts sind Regulationsreserve und Impulskontrolle am niedrigsten,
    während Verfügbarkeit und Novelty am höchsten sind. Eine Bestellung
    um 01:00 wird um 09:00 fast nie noch gewollt. Der Cooldown bis zum
    Morgen kostet nichts und fängt den Großteil ab. Verbindlich, nicht
    laut: Die Regel ruft nicht, sie legt eine Wartezeit vor Kanäle, die im
    ruhigen Zustand selbst dafür freigegeben wurden — kein Verbot, nur
    Latenz. Ohne diese Verbindlichkeit läge ihr Fenster fast vollständig in
    der Ruhezeit, und sie bliebe genau in den Stunden stumm, für die sie
    geschrieben ist.
  rationale_en: >
    At night, regulation reserve and impulse control are at their lowest
    while availability and novelty are at their highest. An order placed at
    01:00 is almost never still wanted at 09:00. A cooldown until morning
    costs nothing and catches most of it. Binding, not loud: the rule does
    not call out, it puts a waiting period in front of channels you
    authorised for it yourself while calm — no ban, only latency. Without
    that binding force its window would sit almost entirely inside quiet
    hours, and it would stay silent in exactly the hours it was written for.
  when:
    all:
      - time_between: ["22:00", "05:00"]
      - regulation: { lt: 50 }
  then:
    action: start_cooldown
    params: { cooldown_until: "09:00", checklist: personal_purchase }
  priority: 90
  severity: enforce
  # Vom Nutzer im ruhigen Zustand autorisiert (siehe CLAUDE.md): Sie darf
  # nachts unterbrechen, weil sie sonst genau in den Stunden stumm bliebe,
  # für die sie gebaut ist. Höchstens zweimal pro Nacht, Cooldown bis 09:00.
  authorised_on: 2026-08-06
  cooldown: { minutes: 240, max_per_day: 2 }
  enabled: true

# ── M7 Body Loop ────────────────────────────────────────────────────────

- id: R-070
  title: "Hyperfokus ohne Körperkontakt"
  title_en: "Hyperfocus without body contact"
  deficit: D7
  rationale: >
    Im Hyperfokus werden Durst, Hunger und Bewegungsbedarf systematisch
    übersehen. Der körperliche Zustand ist gleichzeitig der größte
    einzelne Modulator der Exekutivfunktion — ein dehydrierter Nachmittag
    hat objektiv weniger Kapazität.
  rationale_en: >
    In hyperfocus, thirst, hunger and the need to move are systematically
    overlooked. Physical state is at the same time the single largest
    modulator of executive function — a dehydrated afternoon has objectively
    less capacity.
  when:
    all:
      # Ohne diese Zeile feuert die Regel auch dann, wenn gar kein Fokus
      # läuft: `minutes_since` gilt bei nie eingetretenem Ereignis als
      # "unendlich lange her" — richtig für "seit X nichts getrunken",
      # falsch für "läuft seit X".
      - active_slot: { eq: focus }
      - minutes_since: { event: focus_start, gte: 90 }
      - minutes_since: { event: body_prompt, gte: 90 }
      - time_between: ["07:00", "22:00"]
  then:
    action: notify
    params: { kind: water_move, escalation: soft }
  priority: 55
  severity: nudge
  cooldown: { minutes: 120, max_per_day: 3 }
  enabled: true

# ── M8 Sleep Gate ───────────────────────────────────────────────────────
# Die Abendgrenze steht als R-110 in s2-live.yaml. Sie braucht keine
# Kalibrierung — sie feuert auf eine Uhrzeit — und gehört deshalb dorthin.
# Was hier stand (R-080), war dieselbe Regel; siehe Dateikopf.

# ── M9 Load Monitor ─────────────────────────────────────────────────────

- id: R-090
  title: "Erhaltungsmodus (L3)"
  title_en: "Maintenance mode (L3)"
  deficit: D1
  rationale: >
    Ein hochkompensiertes System bemerkt seinen eigenen Absturz zuletzt,
    weil es nach außen bis kurz vor dem Bruch fehlerfrei läuft. L3 ist
    der externe Notaus, den der Nutzer im ruhigen Zustand selbst autorisiert
    hat. Bewusst unbequem: 72 Stunden nur Pflicht und Erholung.
    L3 ist ein Erfolg des Systems, kein Scheitern des Nutzers.
  rationale_en: >
    A highly compensated system is the last to notice its own collapse,
    because from outside it runs without error until shortly before the
    break. L3 is the external stop that you authorised yourself while calm.
    Deliberately uncomfortable: 72 hours of obligations and recovery only.
    L3 is a success of the system, not a failure of the person.
  when:
    any:
      - load_level: { eq: L3 }
      - all:
          - sleep_debt: { gte: 70 }
          - capacity: { lt: 25 }
  then:
    action: restrict_mode
    params: { duration_hours: 72, hide_optional: true }
  priority: 100
  severity: enforce
  cooldown: { minutes: 1440, max_per_day: 1 }
  enabled: true

# ── M2 Task Kernel ──────────────────────────────────────────────────────
#
# OFFEN an R-020: Die Bedingung fragt nicht, ob es überhaupt etwas zu
# zerlegen gibt. Sie liest `capacity` und `active_slot`; der Aufgabenbestand
# kommt darin nicht vor. Auf einem leeren Gerät trifft sie zu und fordert
# zum Zerlegen auf, wo nichts liegt — eine Ausgabe, die man nicht ausführen
# kann, ist keine (G1). Sichtbar wird das erst in der Oberfläche: Ohne
# Kandidaten fällt now_screen.dart auf die allgemeine Entscheidungskarte
# zurück.
#
# Reparabel ist das hier nicht, sondern nur im Regelwortschatz: Es fehlt
# eine Zahl der Art `atomize_candidates` — offene Aufgaben im Zustand
# `ready`, die bei der aktuellen Kapazität nicht startbar sind (die Menge,
# die `Atomizer.candidates` ohnehin schon berechnet). Sie müsste in
# `RuleVocabulary.numerics`, in `RuntimeContext` und in
# `StateEvalContext.numeric` stehen; dann bekäme R-020 die Zeile
# `- atomize_candidates: { gte: 1 }`. Solange die Zahl fehlt, hält
# r020_atomize_test.dart die Lücke fest.

- id: R-020
  title: "Wichtig, aber nicht startbar — zerlegen statt anmahnen"
  title_en: "Important but not startable — split instead of nag"
  deficit: D2
  rationale: >
    Der übliche Fehlermodus: Eine wichtige Aufgabe steht seit Wochen oben
    auf der Liste und erzeugt bei jedem Blick Schuld, ohne je gestartet zu
    werden. Schuld senkt die Regulationsreserve und macht den Start noch
    unwahrscheinlicher. Statt anzumahnen wird zerlegt, bis ein Teilschritt
    unter die aktuelle Kapazität fällt.
  rationale_en: >
    The usual failure mode: an important task sits at the top of the list
    for weeks, producing guilt at every glance without ever being started.
    Guilt lowers regulation reserve and makes starting even less likely.
    Instead of nagging it gets split until one step falls below current
    capacity.
  when:
    all:
      - capacity: { lt: 50 }
      - not: { active_slot: { eq: focus } }
  then:
    action: force_atomize
    params: { target_ae: 3 }
  priority: 80
  severity: nudge
  cooldown: { minutes: 360, max_per_day: 2, backoff: exponential }
  enabled: true

# ── M2/M3 Fristdruck ────────────────────────────────────────────────────

- id: R-140
  title: "Die Frist ist näher als der Anlauf"
  title_en: "The deadline is closer than the run-up"
  deficit: D4
  rationale: >
    Zeitliche Distanz wird bei diesem Profil systematisch unterschätzt: Eine
    Frist "morgen" fühlt sich weit an, solange sie nicht in Stunden dasteht.
    Diese Regel vergleicht keine Wichtigkeit, sondern zwei Zahlen — die
    Stunden bis zur Frist und den Anlauf, den die Aufgabe braucht
    (Kaltstart plus Bearbeitung). Wird der Anlauf größer als die
    verbleibende Zeit, ist der Moment, in dem Anfangen noch gereicht hätte,
    bereits vorbei. Genau dieser Moment ist von innen nicht sichtbar. Die
    Regel meldet ihn einmal, nennt beide Zahlen und urteilt nicht: Was
    daraus folgt — anfangen, zerlegen, die Frist verschieben oder sie
    verstreichen lassen — entscheidet niemand außer dem Nutzer.
  rationale_en: >
    Temporal distance is systematically underestimated in this profile: a
    deadline "tomorrow" feels far away as long as it is not stated in hours.
    This rule compares no importance, only two numbers — the hours left
    until the deadline and the run-up the task needs (cold start plus work).
    Once the run-up grows larger than the time left, the moment in which
    starting would still have been enough has already passed. That moment is
    invisible from the inside. The rule reports it once, names both numbers
    and passes no judgement: what follows from it — starting, splitting,
    moving the deadline or letting it pass — is nobody's decision but the
    user's.
  when:
    all:
      # Der Rest, wenn man den Anlauf abzieht. Null oder darunter heißt:
      # Die Zeit reicht rechnerisch nicht mehr.
      - deadline_slack_hours: { lte: 0 }
      # Eine abgelaufene Frist ist keine Frist mehr, sondern ein Zustand.
      # Ohne diese Zeile meldete sich die Regel bis zum Aufräumen täglich.
      - hours_to_deadline: { gt: 0 }
  then:
    action: log_only          # SHADOW: sieben Tage stumm, dann auswerten
    params: { hint: deadline_pressure }
  priority: 75
  severity: info
  cooldown: { minutes: 720, max_per_day: 2 }
  enabled: true
