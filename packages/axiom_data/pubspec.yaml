name: axiom_data
description: >
  AXIOM Infrastruktur — SQLite-EventStore, YAML-Regelquelle, Signal-Aggregation.
  Implementiert die Ports aus axiom_core. Darf axiom_core kennen, nie umgekehrt.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  axiom_core:
    path: ../axiom_core
  sqlite3: ^2.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
