name: axiom_data
description: >
  AXIOM Infrastruktur — SQLite-EventStore, YAML-Regelquelle, Signal-Aggregation.
  Implementiert die Ports aus axiom_core. Darf axiom_core kennen, nie umgekehrt.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  axiom_core:
    path: ../axiom_core
  crypto: ^3.0.7
  meta: ^1.16.0
  sqlite3: ^3.5.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# SQLite mit Verschluesselung statt der nackten Fassung.
#
# `sqlite3mc` ist SQLite3MultipleCiphers: dasselbe SQLite, um Chiffren
# erweitert. Die Auswahl passiert beim Bauen ueber einen Hook, nicht zur
# Laufzeit — es gibt kein zweites Paket und keine Bibliothek daneben, die
# man verwechseln koennte.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
